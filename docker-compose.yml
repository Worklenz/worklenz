services:
  frontend:
    image: chamikajaycey/worklenz-frontend:3.1.0-beta
    container_name: worklenz_frontend
    ports:
      - "5000:5000"
    depends_on:
      - backend
    restart: unless-stopped
    env_file:
      - ./.env
    networks:
      - worklenz

  backend:
    image: chamikajaycey/worklenz-backend:3.1.0-beta
    container_name: worklenz_backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # Allows the current published image to start when Google OAuth is not configured.
      # Replace these defaults with real credentials in .env to enable Google sign-in.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost/api/auth/google/verify}
    networks:
      - worklenz

  client-portal:
    image: chamikajaycey/worklenz-client-portal:latest
    container_name: worklenz_client_portal
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - worklenz

  nginx:
    image: nginx:alpine
    container_name: worklenz_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - worklenz

  minio:
    image: minio/minio:latest
    container_name: worklenz_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - worklenz_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - worklenz

  # MinIO setup helper - creates default bucket on startup
  createbuckets:
    image: minio/mc
    container_name: worklenz_createbuckets
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c '
        echo "Waiting for MinIO to start...";
        sleep 15;
        for i in 1 2 3 4 5; do
          echo "Attempt $$i to connect to MinIO...";
          if /usr/bin/mc alias set myminio http://minio:9000 ${AWS_ACCESS_KEY_ID:-minioadmin} ${AWS_SECRET_ACCESS_KEY:-minioadmin}; then
            echo "Successfully connected to MinIO!";
            /usr/bin/mc mb --ignore-existing myminio/worklenz-bucket;
            /usr/bin/mc policy set public myminio/worklenz-bucket;
            exit 0;
          fi
          echo "Connection failed, retrying in 5 seconds...";
          sleep 5;
        done;
        echo "Failed to connect to MinIO after 5 attempts";
        exit 1;
            '
    networks:
      - worklenz
  db:
    image: postgres:15
    container_name: worklenz_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-worklenz_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -d ${DB_NAME:-worklenz_db} -U ${DB_USER:-postgres}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - worklenz
    volumes:
      - worklenz_postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./worklenz-backend/database/sql
        target: /docker-entrypoint-initdb.d/sql
        consistency: cached
      - type: bind
        source: ./worklenz-backend/database/migrations
        target: /docker-entrypoint-initdb.d/migrations
        consistency: cached
      - type: bind
        source: ./worklenz-backend/database/00_init.sh
        target: /docker-entrypoint-initdb.d/00_init.sh
        consistency: cached
      - type: bind
        source: ./pg_backups
        target: /docker-entrypoint-initdb.d/pg_backups
    command: >
        bash -c '
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y dos2unix
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache dos2unix
          fi

          find /docker-entrypoint-initdb.d -type f -name "*.sh" -exec sh -c '"'"'
            for f; do
              dos2unix "$$f" 2>/dev/null || true
              chmod +x "$$f"
            done
          '"'"' sh {} +

          exec docker-entrypoint.sh postgres
        '
  db-backup:
    image: postgres:15
    container_name: worklenz_db_backup
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-worklenz_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./pg_backups:/pg_backups #host dir for backups files
    #setup bassh loop to backup data evey 24h
    command: >
           bash -c 'while true; do
              sleep 86400;
              PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -h worklenz_db -U $$POSTGRES_USER -d $$POSTGRES_DB \
              > /pg_backups/worklenz_db_$$(date +%Y-%m-%d_%H-%M-%S).sql;
              find /pg_backups -type f -name "*.sql" -mtime +30 -delete;
            done'
    restart: unless-stopped
    networks:
      - worklenz

volumes:
  worklenz_postgres_data:
  worklenz_minio_data:
  pgdata:

networks:
  worklenz:
