            {mine.length===0 && <p style={{ opacity:.45, fontSize:12.5, margin:0 }}>No updates published yet.</p>}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">Internal notes</span><span className="tag tag-gray"><SvgIcon name="lock" size={11}/>&nbsp;Never shown to the client</span></div>
          <textarea className="form-input" rows={3} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Margin, risks, staffing…"/>
          <div style={{ marginTop:10 }}><button className="btn btn-default btn-sm" onClick={()=>{ updateProject(project.id, { internalNotes:notes }); toast('Internal notes saved.'); }}>Save notes</button></div>
        </div>
      </div>
    </div>
  );
};

// ── Milestones (spec 7) ────────────────────────────────────────────────────────

const MilestoneModal = ({ open, project, editing, onClose }) => {
  const { milestones, setMilestones, updateMilestone, log, tasks, files } = useStore();
  const blank = { name:'', description:'', target:'', status:'upcoming', visibility:'internal', internalNote:'', taskIds:[], fileIds:[] };
  const [f, setF] = useState(blank);
  useEffect(() => { if (open) setF(editing ? { name:editing.name, description:editing.description, target:editing.target, status:editing.status, visibility:editing.visibility, internalNote:editing.internalNote||'', taskIds:editing.taskIds||[], fileIds:editing.fileIds||[] } : blank); }, [open, editing && editing.id]);
  if (!open) return null;
  const projTasks = tasks.filter(t => t.projectId===project.id), projFiles = files.filter(x => x.projectId===project.id);
  const flip = (key, id) => setF(s => ({ ...s, [key]: s[key].includes(id) ? s[key].filter(x => x!==id) : [...s[key], id] }));
  const save = () => {
    if (!f.name.trim() || !f.target) { toast('A milestone needs a name and a target date.'); return; }
    if (editing) {
      const patch = { ...f, completed: f.status==='completed' ? (editing.completed || TODAY) : null };
      updateMilestone(editing.id, patch);
      if (editing.visibility!==f.visibility) log({ type:'visibility', action: f.visibility==='client' ? 'Entity made Client Visible' : 'Entity returned to Internal Only', target:`Milestone: ${f.name}`, orgId:project.orgId });
      toast('Milestone updated.');
    } else {
      setMilestones(list => [...list, { id:Math.max(0, ...list.map(m => m.id))+1, projectId:project.id, ...f, completed:null, completionNote:'' }]);
      if (f.visibility==='client') log({ type:'visibility', action:'Entity made Client Visible', target:`Milestone: ${f.name}`, orgId:project.orgId });
      toast(f.visibility==='client' ? 'Milestone added and visible to the client.' : 'Milestone added as Internal Only.');
    }
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} width={520} title={editing ? 'Edit milestone' : 'Add milestone'}
      footer={<><button className="btn btn-default" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>{editing ? 'Save' : 'Add milestone'}</button></>}>
      <Field label="Milestone name" hint="A short business-level label, not a technical task name."><input className="form-input" value={f.name} onChange={e=>setF({ ...f, name:e.target.value })}/></Field>
      <Field label="Description (client-facing, optional)"><textarea className="form-input" rows={2} value={f.description} onChange={e=>setF({ ...f, description:e.target.value })}/></Field>
      <div className="form-row">
        <Field label="Target date"><input className="form-input" type="date" value={f.target} onChange={e=>setF({ ...f, target:e.target.value })}/></Field>
        <Field label="Status"><select className="form-select" value={f.status} onChange={e=>setF({ ...f, status:e.target.value })}>{Object.keys(MILESTONE_STATUS).map(k => <option key={k} value={k}>{MILESTONE_STATUS[k].label}</option>)}</select></Field>
      </div>
      <Field label="Visibility"><Seg value={f.visibility} onChange={v=>setF({ ...f, visibility:v })} options={[['internal','Internal only','internal'],['client','Client visible']]}/></Field>
      <Field label="Linked work (optional)" hint="The client sees only linked items that are Client Visible. Internal Only items stay hidden, and the client is never told they exist.">
        <div style={{ border:'1px solid var(--border)', borderRadius:8, padding:'6px 10px', maxHeight:150, overflowY:'auto' }}>
          {projTasks.map(t => <label key={'t'+t.id} style={{ display:'flex', gap:8, alignItems:'center', fontSize:12.5, padding:'3px 0' }}><input type="checkbox" checked={f.taskIds.includes(t.id)} onChange={()=>flip('taskIds', t.id)} style={{ accentColor:'#1677ff' }}/><span style={{ flex:1 }}>Task: {t.title}</span><VisTag v={t.visibility}/></label>)}
          {projFiles.map(x => <label key={'f'+x.id} style={{ display:'flex', gap:8, alignItems:'center', fontSize:12.5, padding:'3px 0' }}><input type="checkbox" checked={f.fileIds.includes(x.id)} onChange={()=>flip('fileIds', x.id)} style={{ accentColor:'#1677ff' }}/><span style={{ flex:1 }}>File: {x.name}</span><VisTag v={x.visibility}/></label>)}
        </div>
      </Field>
      {f.status==='delayed' && <Banner kind="warn" icon="clock">The client sees “Delayed” and the dates, never your internal reason. Put anything the client should know in the description above.</Banner>}
      <Field label="Internal note (private)"><textarea className="form-input" rows={2} value={f.internalNote} onChange={e=>setF({ ...f, internalNote:e.target.value })} placeholder="Delay reasons, capacity, risks…"/></Field>
    </Modal>
  );
};

const MilestonesTab = ({ project }) => {
  const { milestones, setMilestones, updateMilestone, setVisibility, log, tasks, files } = useStore();
  const [modal, setModal] = useState(null);       // null | 'new' | milestone
  const [completing, setCompleting] = useState(null);
  const [note, setNote] = useState('');
  const mine = milestones.filter(m => m.projectId===project.id).sort((a,b) => a.target.localeCompare(b.target));
  const hidden = mine.filter(m => m.visibility==='internal').length;
  const complete = () => {
    updateMilestone(completing.id, { status:'completed', completed:TODAY, completionNote:note.trim() });
    toast(completing.visibility==='client' ? `“${completing.name}” marked complete. The client is notified${note.trim() ? ' with your completion note' : ''}.` : `“${completing.name}” marked complete. It is Internal Only, so the client is not notified.`);
    setCompleting(null); setNote('');
  };
  return (
    <div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12, gap:12, flexWrap:'wrap' }}>
        <span style={{ fontSize:12.5, opacity:.6 }}>{mine.length-hidden} shared with the client · {hidden} internal only. Internal milestones are never counted or hinted at in the portal.</span>
        <button className="btn btn-primary btn-sm" onClick={()=>setModal('new')}>+ Add milestone</button>
      </div>
      <div className="card" style={{ padding:0 }}>
        <div style={{ overflowX:'auto' }}>
          <table className="wl-table">
            <thead><tr><th>Milestone</th><th>Status</th><th>Target</th><th>Completed</th><th>Client visible</th><th></th></tr></thead>
            <tbody>
              {mine.map(m => (
                <tr key={m.id} style={{ opacity:m.visibility==='internal' ? .75 : 1 }}>
                  <td><div style={{ fontWeight:600, fontSize:13, display:'flex', alignItems:'center', gap:6 }}>{m.visibility==='internal' && <SvgIcon name="lock" size={12}/>}{m.name}</div>
                    <div style={{ fontSize:11.5, opacity:.55 }}>{m.description}</div>
                    {((m.taskIds||[]).length>0 || (m.fileIds||[]).length>0) && (() => {
                      const lt = (m.taskIds||[]).map(id => tasks.find(t => t.id===id)).filter(Boolean), lf = (m.fileIds||[]).map(id => files.find(x => x.id===id)).filter(Boolean);
                      const shown = lt.filter(t => t.visibility==='client').length + lf.filter(x => x.visibility==='client').length, total = lt.length + lf.length;
                      return <div style={{ fontSize:11.5, opacity:.6, marginTop:3 }}>Linked: {lt.length} task{lt.length===1?'':'s'}, {lf.length} file{lf.length===1?'':'s'} · client sees {shown} of {total}</div>;
                    })()}
                    {m.internalNote && <div style={{ fontSize:11.5, color:'#d46b08', marginTop:3 }}>Internal: {m.internalNote}</div>}</td>
                  <td onClick={e=>e.stopPropagation()}>
                    <select className="form-select" style={{ width:'auto', fontSize:12 }} value={m.status} onChange={e=>{ if (e.target.value==='completed') { setCompleting(m); setNote(m.completionNote||''); } else updateMilestone(m.id, { status:e.target.value, completed:null }); }}>
                      {Object.keys(MILESTONE_STATUS).map(k => <option key={k} value={k}>{MILESTONE_STATUS[k].label}</option>)}
                    </select>
                  </td>
                  <td style={{ fontSize:12.5 }}>{fmtDate(m.target)}</td>
                  <td style={{ fontSize:12.5, opacity:m.completed?1:.4 }}>{fmtDate(m.completed,'—')}</td>
                  <td><Switch on={m.visibility==='client'} onChange={v=>setVisibility('milestone', m.id, v ? 'client' : 'internal')}/></td>
                  <td><RowMenu items={[
                    { label:'Edit milestone', onClick:()=>setModal(m) },
                    { label:'Mark complete…', hidden:m.status==='completed', onClick:()=>{ setCompleting(m); setNote(''); } },
                    { label:'Delete milestone', danger:true, onClick:()=>{ setMilestones(list => list.filter(x => x.id!==m.id)); toast('Milestone deleted.'); } },
                  ]}/></td>
                </tr>
              ))}
              {mine.length===0 && <tr><td colSpan="6" style={{ textAlign:'center', padding:30, opacity:.4 }}>No milestones yet.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      <MilestoneModal open={!!modal} project={project} editing={modal && modal!=='new' ? modal : null} onClose={()=>setModal(null)}/>
      <Modal open={!!completing} onClose={()=>setCompleting(null)} width={460} title="Mark milestone complete"
        footer={<><button className="btn btn-default btn-sm" onClick={()=>setCompleting(null)}>Cancel</button><button className="btn btn-primary btn-sm" onClick={complete}>Mark complete</button></>}>
        {completing && <>
          <p style={{ fontSize:13, marginTop:0 }}><b>{completing.name}</b> will keep its target date ({fmtDate(completing.target)}) and record today as the completion date.</p>
          <Field label="Completion note for the client (optional)" hint={completing.visibility==='client' ? 'Shown on the milestone in the portal.' : 'This milestone is Internal Only, so nothing is shown to the client.'}>
            <textarea className="form-input" rows={3} value={note} onChange={e=>setNote(e.target.value)} placeholder="What was delivered?"/>
          </Field>
        </>}
      </Modal>
    </div>
  );
};

const FileModal = ({ open, project, replacing, onClose }) => {
  const { setFiles, updateFile, approvals, log, notify } = useStore();
  const [name, setName] = useState('');
  const [cat, setCat] = useState('Deliverable');
  const [vis, setVis] = useState('internal');
  const ref = useRef(null);
  useEffect(() => { if (open) { setName(replacing ? replacing.name : ''); setCat(replacing ? replacing.category : 'Deliverable'); setVis(replacing ? replacing.visibility : 'internal'); } }, [open, replacing && replacing.id]);
  if (!open) return null;
  const linked = replacing ? approvals.filter(a => a.linked.type==='file' && a.linked.id===replacing.id && a.status!=='cancelled') : [];
  const save = () => {
    if (!name.trim()) { toast('Choose a file first.'); return; }
    if (replacing) {
      const v = curVersion(replacing) + 1;
      updateFile(replacing.id, f => ({ versions:[...f.versions, { v, date:TODAY, by:ME.short }], date:TODAY, by:ME.short }));
      log({ type:'file', action:'File version uploaded', target:`File: ${replacing.name} (v${v})`, orgId:project.orgId });
      toast(`${replacing.name} is now v${v}. ${linked.length ? 'Existing approvals still point to the version they approved.' : 'Earlier versions are kept.'}`);
    } else {
      setFiles(list => [{ id:Math.max(0, ...list.map(f => f.id)) + 1, projectId:project.id, name:name.trim(), category:cat, visibility:vis, side:'internal', by:ME.short, date:TODAY, size:'1.2 MB', versions:[{ v:1, date:TODAY, by:ME.short }] }, ...list]);
      if (vis==='client') log({ type:'visibility', action:'Entity made Client Visible', target:`File: ${name.trim()}`, orgId:project.orgId });
      toast(vis==='client' ? `${name.trim()} uploaded and shared. Client users are notified.` : `${name.trim()} uploaded as Internal Only.`);
    }
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} width={480} title={replacing ? `Replace · ${replacing.name}` : 'Upload file'}
      footer={<><button className="btn btn-default" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>{replacing ? 'Upload new version' : 'Upload'}</button></>}>
      <div style={{ border:'1px dashed var(--border)', borderRadius:8, padding:'18px 10px', textAlign:'center', marginBottom:16 }}>
        <input ref={ref} type="file" style={{ display:'none' }} onChange={e=>{ const fl = e.target.files && e.target.files[0]; if (fl && !replacing) setName(fl.name); if (fl && replacing) toast(`${fl.name} selected.`); }}/>
        <button className="btn btn-default btn-sm" onClick={()=>ref.current && ref.current.click()}>Choose file</button>
        <div style={{ fontSize:12.5, marginTop:8, fontWeight:600 }}>{name || 'No file chosen'}</div>
        {!replacing && <input className="form-input" style={{ marginTop:10 }} placeholder="…or type a file name for the demo" value={name} onChange={e=>setName(e.target.value)}/>}
      </div>
      {!replacing && <>
        <Field label="Category"><select className="form-select" value={cat} onChange={e=>setCat(e.target.value)}>{FILE_CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></Field>
        <Field label="Visibility" hint="Internal Only by default. A direct file link never bypasses portal permissions."><Seg value={vis} onChange={setVis} options={[['internal','Internal only','internal'],['client','Client visible']]}/></Field>
      </>}
      {replacing && <Banner kind="info" icon="clock">Saves as <b>v{curVersion(replacing)+1}</b>. {linked.length>0 ? <>Approval{linked.length>1?'s':''} {linked.map(a => a.id).join(', ')} keep{linked.length>1?'':'s'} pointing at the version that was sent for approval.</> : 'Earlier versions are kept as a replacement record.'}</Banner>}
    </Modal>
  );
};

// ─── APPROVALS (spec 11) — formal, auditable sign-off on a client-visible item ──

const nextApprovalId = (list) => 'AP-' + String(Math.max(...list.map(a => Number(a.id.slice(3))), 120) + 1).padStart(6, '0');

const linkedItemLabel = (l) => `${l.name}${l.version ? ` · v${l.version}` : ''}`;

const CreateApprovalModal = ({ open, orgId, onClose }) => {
  const { projects, files, milestones, tasks, users, approvals, setApprovals, log, notify, clients } = useStore();
  const eligible = projects.filter(p => p.portalEnabled && (!orgId || p.orgId===orgId));
  const [projectId, setProjectId] = useState('');
  const [title, setTitle] = useState('');
  const [mode, setMode] = useState('existing');   // 'existing' (file, milestone or task) or 'freeform'
  const [ffName, setFfName] = useState('');
  const [ffDesc, setFfDesc] = useState('');
  const [itemKey, setItemKey] = useState('');
  const [approverId, setApproverId] = useState('');
  const [instructions, setInstructions] = useState('');
  const [due, setDue] = useState('');
  useEffect(() => { if (open) { setProjectId(eligible[0] ? String(eligible[0].id) : ''); setTitle(''); setMode('existing'); setFfName(''); setFfDesc(''); setItemKey(''); setApproverId(''); setInstructions(''); setDue(''); } }, [open, orgId]);
  useEffect(() => { setItemKey(''); setApproverId(''); }, [projectId]);
  if (!open) return null;
  const pid = Number(projectId);
  const shareFiles = files.filter(f => f.projectId===pid && f.visibility==='client');
  const shareMs = milestones.filter(m => m.projectId===pid && m.visibility==='client');
  const shareTasks = tasks.filter(t => t.projectId===pid && t.visibility==='client');
  const hiddenCount = files.filter(f => f.projectId===pid && f.visibility==='internal').length + milestones.filter(m => m.projectId===pid && m.visibility==='internal').length + tasks.filter(t => t.projectId===pid && t.visibility==='internal').length;
  const approvers = users.filter(u => u.role==='admin' && u.status==='active' && u.projects.includes(pid));

  const build = (status) => {
    const proj = projects.find(p => p.id===pid);
    const [kind, rawId] = itemKey.split(':');
    let linked;
    if (mode==='freeform') linked = { type:'freeform', id:null, name:ffName.trim(), version:null, description:ffDesc.trim(), snapshots:[{ rev:1, description:ffDesc.trim() }] };
    else if (kind==='file') { const f = files.find(x => x.id===Number(rawId)); linked = { type:'file', id:f.id, name:f.name, version:curVersion(f) }; }
    else if (kind==='task') { const t = tasks.find(x => x.id===Number(rawId)); linked = { type:'task', id:t.id, key:t.key, name:t.clientTitle || t.title, version:null }; }
    else { const m = milestones.find(x => x.id===Number(rawId)); linked = { type:'milestone', id:m.id, name:m.name, version:null }; }
    const id = nextApprovalId(approvals);
    const approver = users.find(u => u.id===Number(approverId));
    const entry = {
      id, orgId:proj.orgId, projectId:pid, title:title.trim(), linked,
      approverId:Number(approverId), instructions:instructions.trim(), due:due||null, status, revision:1, createdBy:ME.short, decision:null,
      history:[{ ts:'Just now', actor:ME.short, side:'internal', text: status==='draft' ? 'Draft created. Not visible to the client until sent.' : `Approval requested for ${linkedItemLabel(linked)}` }],
    };
    if (status==='awaiting') entry.history.push({ ts:'Just now', actor:'System', side:'internal', text:`${approver.name} notified by email and in the portal` });
    setApprovals(list => [entry, ...list]);
    log({ type:'approval', action: status==='draft' ? 'Approval drafted' : 'Approval requested', target:`${id} · ${entry.title}`, orgId:proj.orgId });
    toast(status==='draft' ? `${id} saved as a draft. The client cannot see it yet.` : `${id} sent. ${approver.name} is notified.`);
    onClose();
  };
  const valid = title.trim() && projectId && (mode==='freeform' ? ffName.trim() : itemKey) && approverId;

  return (
    <Modal open={open} onClose={onClose} width={560} title="New approval request"
      footer={<>
        <button className="btn btn-default" onClick={onClose}>Cancel</button>
        <button className="btn btn-default" disabled={!valid} onClick={()=>build('draft')}>Save draft</button>
        <button className="btn btn-primary" disabled={!valid} onClick={()=>build('awaiting')}>Send for approval</button>
      </>}>
      <Field label="Project"><select className="form-select" value={projectId} onChange={e=>setProjectId(e.target.value)}>{eligible.map(p => <option key={p.id} value={p.id}>{p.name} · {(clients.find(c => c.id===p.orgId)||{}).name}</option>)}</select></Field>
      <Field label="What is being approved"><input className="form-input" value={title} onChange={e=>setTitle(e.target.value)} placeholder="e.g. Approve homepage wireframe v3"/></Field>
      <Field label="Linked item" hint={mode==='freeform' ? 'A free-form item has no record behind it. The name and description you write here are exactly what the client sees and approves.' : (hiddenCount>0 ? `${hiddenCount} item${hiddenCount>1?'s':''} in this project ${hiddenCount>1?'are':'is'} Internal Only and cannot be linked. Share ${hiddenCount>1?'them':'it'} with the client first.` : 'Only Client Visible files, milestones and tasks can be linked. The exact file version is recorded.')}>
        <div style={{ display:'flex', gap:8, marginBottom:8 }}>
          <button type="button" className={`btn btn-sm ${mode==='existing'?'btn-primary':'btn-default'}`} onClick={()=>setMode('existing')}>Existing item</button>
          <button type="button" className={`btn btn-sm ${mode==='freeform'?'btn-primary':'btn-default'}`} onClick={()=>setMode('freeform')}>Free-form item</button>
        </div>
        {mode==='existing' ? (
          <select className="form-select" value={itemKey} onChange={e=>setItemKey(e.target.value)}>
            <option value="">Select a file, milestone or task…</option>
            <optgroup label="Files">{shareFiles.map(f => <option key={f.id} value={`file:${f.id}`}>{f.name} · v{curVersion(f)}</option>)}</optgroup>
            <optgroup label="Milestones">{shareMs.map(m => <option key={m.id} value={`milestone:${m.id}`}>{m.name}</option>)}</optgroup>
            <optgroup label="Tasks">{shareTasks.map(t => <option key={t.id} value={`task:${t.id}`}>{t.key} · {t.clientTitle || t.title}</option>)}</optgroup>
          </select>
        ) : (
          <>
            <input className="form-input" style={{ marginBottom:8 }} value={ffName} onChange={e=>setFfName(e.target.value)} placeholder="Item name, e.g. Launch rollout approach"/>
            <textarea className="form-input" rows={3} value={ffDesc} onChange={e=>setFfDesc(e.target.value)} placeholder="Describe what the client is approving (optional)"/>
          </>
        )}
      </Field>
      <Field label="Approver" hint={approvers.length===0 ? 'No active Client Admin is assigned to this project. Only Client Admins can approve.' : 'Only Client Admins can make an approval decision.'}>
        <select className="form-select" value={approverId} onChange={e=>setApproverId(e.target.value)} disabled={approvers.length===0}>
          <option value="">Select an approver…</option>{approvers.map(u => <option key={u.id} value={u.id}>{u.name} · {u.email}</option>)}
        </select>
      </Field>
      <div className="form-row">
        <Field label="Instructions (what the client should check)"><textarea className="form-input" rows={3} value={instructions} onChange={e=>setInstructions(e.target.value)}/></Field>
        <Field label="Due date (optional)"><input className="form-input" type="date" value={due} onChange={e=>setDue(e.target.value)}/></Field>
      </div>
    </Modal>
  );
};

const ApprovalDetail = ({ approval, onClose }) => {
  const { users, projects, files, tasks, clients, updateApproval, setApprovals, log, notify, go, threads } = useStore();
  const [confirmCancel, setConfirmCancel] = useState(false);
  const [simComment, setSimComment] = useState('');
  const [reviseOpen, setReviseOpen] = useState(false);
  const [reviseDesc, setReviseDesc] = useState('');
  if (!approval) return null;
  const a = approval;
  const thread = threads.find(t => t.ctx.type==='approval' && t.ctx.refId===a.id);
  const approver = users.find(u => u.id===a.approverId);
  const proj = projects.find(p => p.id===a.projectId);
  const org = clients.find(c => c.id===a.orgId);
  const file = a.linked.type==='file' ? files.find(f => f.id===a.linked.id) : null;
  const moved = file && a.linked.version && curVersion(file) > a.linked.version;
  const overdue = a.status==='awaiting' && a.due && a.due < TODAY;

  const push = (patch, text, side='internal', actor=ME.short) => updateApproval(a.id, x => ({ ...patch, history:[...x.history, { ts:'Just now', actor, side, text }] }));
  const send = () => { push({ status:'awaiting' }, `Sent to ${approver.name}`); log({ type:'approval', action:'Approval requested', target:`${a.id} · ${a.title}`, orgId:a.orgId }); toast(`${a.id} sent. ${approver.name} is notified.`); };
  const cancel = () => { push({ status:'cancelled' }, 'Request cancelled by the internal team'); log({ type:'approval', action:'Approval cancelled', target:`${a.id} · ${a.title}`, orgId:a.orgId }); toast(`${a.id} cancelled. It disappears from the client's pending actions.`); };
  // Free-form items have no record to update, so the new description is entered here and kept per revision.
  const startRevise = () => { if (a.linked.type==='freeform') { setReviseDesc(a.linked.description || ''); setReviseOpen(true); } else revise(); };
  const revise = (newDesc) => {
    const nextV = file ? curVersion(file) : null;
    const rev = a.revision + 1;
    const task = a.linked.type==='task' ? tasks.find(t => t.id===a.linked.id) : null;
    let linked = { ...a.linked, version: nextV };
    let extra = nextV ? ` with ${a.linked.name} v${nextV}` : '';
    if (task) linked = { ...linked, name:task.clientTitle || task.title };
    if (a.linked.type==='freeform') {
      const changed = newDesc.trim() !== (a.linked.description || '');
      linked = { ...linked, description:newDesc.trim(), snapshots:[...(a.linked.snapshots || []), { rev, description:newDesc.trim() }] };
      extra = changed ? ' with an updated description' : ' with the same description';
    }
    push({ status:'awaiting', revision:rev, decision:null, linked, due:a.due }, `Resubmitted as revision ${rev}${extra}. The earlier decision stays in the history.`);
    updateApproval(a.id, x => ({ history:[...x.history, { ts:'Just now', actor:'System', side:'internal', text:`${approver.name} notified by email and in the portal` }] }));
    log({ type:'approval', action:'Approval requested', target:`${a.id} · revision ${rev}`, orgId:a.orgId });
    toast(`${a.id} is awaiting approval again as revision ${rev}. ${approver.name} is notified. The previous decision is preserved.`);
  };
  const simulate = (outcome) => {
    if (a.status!=='awaiting') return;
    const comment = simComment.trim();
    const label = outcome==='approved' ? 'Approved' : 'Requested changes';
    updateApproval(a.id, x => ({ status:outcome, decision:{ by:approver.name, at:'Just now', outcome, comment }, history:[...x.history, { ts:'Just now', actor:approver.name, side:'client', text:`${label}${comment ? `: “${comment}”` : ''} (${decisionRef(a)})` }] }));
    log({ actor:approver.name, side:'client', type:'approval', action: outcome==='approved' ? 'Approval: approved' : 'Approval: changes requested', target:`${a.id} · ${a.title} (${decisionRef(a)})`, orgId:a.orgId });
    notify({ type:'Approval', title: outcome==='approved' ? `${approver.name} approved ${a.id}` : `Changes requested on ${a.id}`, body:a.title, route:{ key:'approvals', params:{ id:a.id } } });
    setSimComment('');
    toast(`${approver.name} ${outcome==='approved' ? 'approved' : 'requested changes on'} ${a.id}. Your team is notified.`);
  };

  return (
    <Modal open onClose={onClose} width={760} title={<span style={{ display:'flex', alignItems:'center', gap:10 }}>{a.id}<ApprovalStatusTag s={a.status}/><span className="tag tag-gray">Revision {a.revision}</span></span>}
      footer={<>
        <button className="btn btn-default btn-sm" onClick={onClose}>Close</button>
        {thread && <button className="btn btn-default btn-sm" onClick={()=>{ onClose(); go('discussions', { id:thread.id }); }}>Open discussion ({thread.messages.length})</button>}
        {a.status==='draft' && <button className="btn btn-primary btn-sm" onClick={send}>Send to client</button>}
        {a.status==='awaiting' && <button className="btn btn-default btn-sm" onClick={()=>setConfirmCancel(true)}>Cancel request</button>}
        {a.status==='changes_requested' && <button className="btn btn-primary btn-sm" onClick={startRevise}>Resubmit as new revision</button>}
        {a.status==='approved' && <button className="btn btn-default btn-sm" onClick={startRevise}>Request re-approval (new revision)</button>}
      </>}>
      <div style={{ display:'flex', gap:20, flexWrap:'wrap' }}>
        <div style={{ flex:'3 1 340px', minWidth:0 }}>
          <h3 style={{ fontSize:16, fontWeight:700, margin:'0 0 4px' }}>{a.title}</h3>
          <div style={{ fontSize:12, opacity:.6, marginBottom:14 }}>{org ? org.name : ''} · {proj ? proj.name : ''}</div>

          <div className="card card-sm" style={{ marginBottom:12 }}>
            <div style={{ fontSize:11.5, opacity:.55, marginBottom:6 }}>LINKED ITEM</div>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:10 }}>
              <div style={{ display:'flex', alignItems:'center', gap:8 }}><SvgIcon name={LINK_ICON[a.linked.type]} size={16}/><div><div style={{ fontWeight:600, fontSize:13 }}>{a.linked.name}</div><div style={{ fontSize:11.5, opacity:.55 }}>{a.linked.type==='file' ? `File · version ${a.linked.version} recorded` : a.linked.type==='task' ? `Task · ${a.linked.key}` : a.linked.type==='freeform' ? 'Free-form item · not linked to a record' : 'Milestone'}</div></div></div>
              {a.linked.type!=='freeform' && <button className="btn btn-default btn-sm" onClick={()=>{ onClose(); go('projects', { id:a.projectId, tab:a.linked.type==='file' ? 'files' : a.linked.type==='task' ? 'tasks' : 'milestones' }); }}>Open item</button>}
            </div>
            {a.linked.type==='freeform' && (
              <div style={{ marginTop:10, fontSize:13 }}>
                {a.linked.description ? <div style={{ whiteSpace:'pre-wrap' }}>{a.linked.description}</div> : <span style={{ opacity:.4 }}>No description.</span>}
                {(a.linked.snapshots || []).length>1 && (
                  <div style={{ marginTop:10, paddingTop:8, borderTop:'1px solid var(--border)' }}>
                    <div style={{ fontSize:11.5, opacity:.55, marginBottom:4 }}>EARLIER REVISIONS</div>
                    {a.linked.snapshots.slice(0,-1).reverse().map(sn => <div key={sn.rev} style={{ fontSize:12.5, opacity:.7, marginBottom:4 }}><b>Revision {sn.rev}:</b> {sn.description || 'No description.'}</div>)}
                  </div>
                )}
              </div>
            )}
            {moved && <Banner kind="info" icon="clock">The client approved <b>v{a.linked.version}</b>. The file has since moved to <b>v{curVersion(file)}</b>. The approval still points at v{a.linked.version}; request a new revision to cover the newer version.</Banner>}
          </div>

          <div className="card card-sm" style={{ marginBottom:12 }}>
            <div style={{ fontSize:11.5, opacity:.55, marginBottom:6 }}>INSTRUCTIONS FOR THE CLIENT</div>
            <div style={{ fontSize:13 }}>{a.instructions || <span style={{ opacity:.4 }}>No instructions.</span>}</div>
          </div>

          {a.decision && (
            <div className="card card-sm" style={{ marginBottom:12, borderColor: a.decision.outcome==='approved' ? '#b7eb8f' : '#ffccc7' }}>
              <div style={{ fontSize:11.5, opacity:.55, marginBottom:6 }}>CLIENT DECISION</div>
              <div style={{ fontSize:13, fontWeight:600 }}>{a.decision.outcome==='approved' ? 'Approved' : 'Changes requested'} by {a.decision.by} <span style={{ opacity:.5, fontWeight:400 }}>· {a.decision.at}</span></div>
              {a.decision.comment && <div style={{ fontSize:13, marginTop:6, opacity:.85 }}>“{a.decision.comment}”</div>}
            </div>
          )}

          {a.status==='awaiting' && (
            <ProtoHelper title="the client decides in their own portal">
              <input className="form-input" style={{ marginBottom:8 }} placeholder="Optional decision comment" value={simComment} onChange={e=>setSimComment(e.target.value)}/>
              <div style={{ display:'flex', gap:8 }}>
                <button className="btn btn-sm btn-default" onClick={()=>simulate('approved')}>{approver.name.split(' ')[0]} approves</button>
                <button className="btn btn-sm btn-default" onClick={()=>simulate('changes_requested')}>{approver.name.split(' ')[0]} requests changes</button>
              </div>
            </ProtoHelper>
          )}
        </div>

        <div style={{ flex:'2 1 220px', minWidth:200 }}>
          <div className="card card-sm" style={{ marginBottom:12 }}>
            <KV rows={[['Approver', approver ? approver.name : '—'], ['Role', approver ? ROLES[approver.role].label : '—'], ['Due', <span style={{ color:overdue?'#ff4d4f':undefined }}>{fmtDate(a.due,'No due date')}{overdue ? ' · overdue' : ''}</span>], ['Created by', a.createdBy], ['Visible to client', a.status==='draft' ? 'No (draft)' : 'Yes']]}/>
          </div>
          <div className="form-label">HISTORY</div>
          {a.history.slice().reverse().map((h,i) => (
            <div key={i} className="timeline-item" style={{ paddingBottom:12 }}>
              <div className="timeline-dot" style={{ width:24, height:24 }}><SvgIcon name={h.side==='client' ? 'user' : 'shield'} size={11}/></div>
              <div><div style={{ fontSize:12.5 }}><b>{h.actor}</b> {h.text}</div><div style={{ fontSize:11, opacity:.45 }}>{h.ts}</div></div>
            </div>
          ))}
        </div>
      </div>
      <Modal open={reviseOpen} onClose={()=>setReviseOpen(false)} width={520} title={`Revision ${a.revision+1} of ${a.id}`}
        footer={<><button className="btn btn-default" onClick={()=>setReviseOpen(false)}>Cancel</button><button className="btn btn-primary" onClick={()=>{ revise(reviseDesc); setReviseOpen(false); }}>Resubmit for approval</button></>}>
        <Field label="Description for the client" hint={`The current description is kept as revision ${a.revision}. ${approver ? approver.name : 'The approver'} is notified by email and in the portal.`}>
          <textarea className="form-input" rows={5} value={reviseDesc} onChange={e=>setReviseDesc(e.target.value)}/>
        </Field>
      </Modal>
      <Confirm open={confirmCancel} danger title="Cancel this approval request?" confirmLabel="Cancel request" onClose={()=>setConfirmCancel(false)} onConfirm={cancel}>
        <b>{a.id}</b> is withdrawn and {approver ? approver.name : 'the approver'} no longer sees it as pending. The history is kept.
      </Confirm>
    </Modal>
  );
};

// ─── CHANGE REQUESTS (spec 12) — formal scope changes, reviewed on the internal side ──

const CR_STEPS = ['Submitted','Under review','Decision','In progress','Completed'];
const crStep = (s) => ({ submitted:0, under_review:1, more_info:1, approved:2, rejected:2, in_progress:3, completed:4, cancelled:-1 }[s]);
const fmtEstimate = (e) => !e ? null : [e.hours!=null && e.hours!=='' ? `${e.hours} h` : null, e.cost!=null && e.cost!=='' ? `$${Number(e.cost).toLocaleString()}` : null].filter(Boolean).join(' · ') || null;

const CRStepper = ({ status }) => {
  const idx = crStep(status);
  return (
    <div style={{ display:'flex', gap:4, margin:'4px 0 2px' }}>
      {CR_STEPS.map((label,i) => {
        const done = idx>=0 && i<idx, cur = i===idx;
        const rejected = cur && status==='rejected';
        const lbl = i===2 ? (status==='rejected' ? 'Rejected' : status==='approved' || idx>2 ? 'Approved' : 'Decision') : label;
        const color = rejected ? '#ff4d4f' : (done || cur) ? '#1677ff' : 'var(--border)';
        return (
          <div key={label} style={{ flex:1 }}>
            <div style={{ height:4, borderRadius:2, background:color, opacity:cur&&!rejected?1:(done?.55:1) }}/>
            <div style={{ fontSize:11, marginTop:5, fontWeight:cur?700:500, opacity:cur?1:done?.7:.4, color:rejected?'#ff4d4f':undefined }}>{lbl}</div>
          </div>
        );
      })}
    </div>
  );
};

const CRDetail = ({ cr, onBack, onBilling }) => {
  const { updateCR, setTasks, tasks, projects, clients, log, notify, go, setVisibility } = useStore();
  const [reply, setReply] = useState('');
  const [notes, setNotes] = useState(cr.internalNotes);
  const [hours, setHours] = useState(cr.estimate && cr.estimate.hours!=null ? cr.estimate.hours : '');
  const [cost, setCost] = useState(cr.estimate && cr.estimate.cost!=null ? cr.estimate.cost : '');
  const [convert, setConvert] = useState(false);
  const [confirmCancel, setConfirmCancel] = useState(false);
  const [followUp, setFollowUp] = useState('');
  useEffect(() => { setNotes(cr.internalNotes); setHours(cr.estimate && cr.estimate.hours!=null ? cr.estimate.hours : ''); setCost(cr.estimate && cr.estimate.cost!=null ? cr.estimate.cost : ''); setReply(''); }, [cr.id]);

  const proj = projects.find(p => p.id===cr.projectId);
  const org = clients.find(c => c.id===cr.orgId);
  const assignee = teamById(cr.assignee);
  const est = fmtEstimate(cr.estimate);
  const terminal = ['completed','rejected','cancelled'].includes(cr.status);
  const billable = CR_BILLABLE.includes(cr.status);

  const move = (status, text, extra={}, message) => {
    const label = CR_STATUS[status].label;
    updateCR(cr.id, x => ({
      status, ...extra,
      response: message!=null ? message : x.response,
      history:[...x.history, { ts:'Just now', actor:ME.short, side:'internal', text }],
      thread: message ? [...x.thread, { from:'team', author:ME.short, text:message, ts:'Just now' }] : x.thread,
    }));
    log({ type:'change_request', action: status==='completed' ? 'Change request completed' : 'Change request status changed', target:`${cr.crNo} · ${CR_STATUS[cr.status].label} → ${label}` , orgId:cr.orgId });
    toast(`${cr.crNo} is now “${label}”. The client sees the new status and your response, but not your internal notes.`);
    setReply('');
  };

  const saveEstimate = () => {
    const h = hours===''?null:Number(hours), c = cost===''?null:Number(cost);
    updateCR(cr.id, { estimate: h==null && c==null ? null : { hours:h, cost:c } });
    toast(h==null && c==null ? 'Estimate cleared. The client sees no time or cost.' : 'Estimate saved. The client sees it with your response.');
  };

  const doConvert = ({ mode, title, assignee: a, vis, taskId }) => {
    if (mode==='link') {
      const t = tasks.find(x => x.id===taskId); if (!t) return;
      setTasks(list => list.map(x => x.id===t.id ? { ...x, fromCR:cr.crNo } : x));
      updateCR(cr.id, x => ({ status:'in_progress', linkedTask:t.key, linkMode:'linked', history:[...x.history, { ts:'Just now', actor:ME.short, side:'internal', text:`Linked to existing work item ${t.key}` }] }));
      log({ type:'change_request', action:'Change request status changed', target:`${cr.crNo} · Approved → In Progress (linked ${t.key})`, orgId:cr.orgId });
      toast(`${cr.crNo} is linked to ${t.key} and is now In Progress. The task keeps its own visibility.`);
      setConvert(false);
      return;
    }
    const key = 'WL-' + (272 + tasks.length);
    const t = { id:Math.max(0, ...tasks.map(x => x.id)) + 1, key, projectId:cr.projectId, title, status:'todo', due:null, assignee:a, visibility:vis, clientTitle: vis==='client' ? cr.title : '', clientDesc: vis==='client' ? cr.description : '', estimateH:cr.estimate && cr.estimate.hours || 0, loggedH:0, internalComments:0, fromCR:cr.crNo };
    setTasks(list => [t, ...list]);
    updateCR(cr.id, x => ({ status:'in_progress', linkedTask:key, linkMode:'created', assignee:a, history:[...x.history, { ts:'Just now', actor:ME.short, side:'internal', text:`Converted to work item ${key}` }] }));
    log({ type:'change_request', action:'Change request status changed', target:`${cr.crNo} · Approved → In Progress (${key})`, orgId:cr.orgId });
    toast(`${key} created from ${cr.crNo}. The request is now In Progress and keeps a link to the task.`);
    setConvert(false);
  };

  const simulateFollowUp = () => {
    if (!followUp.trim()) return;
    updateCR(cr.id, x => ({ status:'under_review', thread:[...x.thread, { from:'client', author:cr.requester, text:followUp.trim(), ts:'Just now' }], history:[...x.history, { ts:'Just now', actor:cr.requester, side:'client', text:'Added follow-up information' }, { ts:'Just now', actor:'System', side:'internal', text:'Status returned to Under Review' }] }));
    log({ actor:cr.requester, side:'client', type:'change_request', action:'Change request status changed', target:`${cr.crNo} · More Information Required → Under Review`, orgId:cr.orgId });
    notify({ type:'Change Request', title:`${cr.requester} replied on ${cr.crNo}`, body:followUp.trim().slice(0,80), route:{ key:'change-requests', params:{ id:cr.id } } });
    setFollowUp('');
    toast(`${cr.requester} sent the information. ${cr.crNo} is back in Under Review.`);
  };

  const needMsg = (fn) => () => { if (!reply.trim()) { toast('Write a response for the client first.'); return; } fn(); };

  return (
    <div>
      <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:18, flexWrap:'wrap', gap:12 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <button className="wl-icon-btn" style={{ fontSize:18 }} onClick={onBack}>←</button>
          <div>
            <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
              <h2 style={{ fontSize:16, fontWeight:700, margin:0 }}>{cr.crNo} · {cr.title}</h2><CRStatusTag s={cr.status}/><PriorityTag p={cr.priority}/>
            </div>
            <div style={{ fontSize:12, opacity:.55, marginTop:2 }}>{org ? org.name : ''} · {proj ? proj.name : ''} · Submitted by {cr.requester} on {fmtDate(cr.submitted)}</div>
          </div>
        </div>
      </div>

      <div className="card" style={{ marginBottom:16 }}>
        {cr.status==='cancelled' ? <Banner kind="warn" icon="x">This request was cancelled.</Banner> : <CRStepper status={cr.status}/>}
        <p style={{ fontSize:11.5, opacity:.5, margin:'10px 0 0' }}>Submitting a change request never creates a task by itself. Approve it, then convert it to work.</p>
      </div>

      <div style={{ display:'flex', gap:20, alignItems:'flex-start', flexWrap:'wrap' }}>
        <div style={{ flex:'2 1 420px', minWidth:0 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Client request</span><span className="tag tag-purple">From the client</span></div>
            <div style={{ fontSize:13, lineHeight:1.6 }}>{cr.description}</div>
            {cr.notes && <div style={{ fontSize:12.5, opacity:.7, marginTop:10 }}><b>Notes:</b> {cr.notes}</div>}
            {cr.attachments.length>0 && <div style={{ display:'flex', gap:8, marginTop:12, flexWrap:'wrap' }}>{cr.attachments.map(a => <span key={a} className="tag tag-gray" style={{ padding:'4px 10px', gap:5 }}><SvgIcon name="paperclip" size={11}/>{a}</span>)}</div>}
          </div>

          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Conversation with the client</span><span className="tag tag-green"><SvgIcon name="eye" size={11}/>&nbsp;Client visible</span></div>
            {cr.thread.map((m,i) => (
              <div key={i} style={{ display:'flex', gap:10, marginBottom:14 }}>
                <Av initials={initialsFromName(m.author)} color={m.from==='client' ? '#722ed1' : '#1677ff'} size={30}/>
                <div><div style={{ fontSize:12.5, fontWeight:600 }}>{m.author} <span className={`tag ${m.from==='client'?'tag-purple':'tag-blue'}`} style={{ marginLeft:4 }}>{m.from==='client'?'Client':'Team'}</span><span style={{ fontWeight:400, opacity:.45, marginLeft:8 }}>{m.ts}</span></div>
                  <div style={{ fontSize:13, marginTop:3 }}>{m.text}</div></div>
              </div>
            ))}
            {cr.thread.length===0 && <p style={{ opacity:.45, fontSize:12.5, marginTop:0 }}>No response sent to the client yet.</p>}
            {!terminal && (
              <div style={{ borderTop:'1px solid var(--border)', paddingTop:12 }}>
                <textarea className="form-input" rows={2} value={reply} onChange={e=>setReply(e.target.value)} placeholder="Write the response the client will see…"/>
                <div style={{ display:'flex', gap:8, flexWrap:'wrap', marginTop:10 }}>
                  <button className="btn btn-default btn-sm" disabled={!reply.trim()} onClick={()=>{ updateCR(cr.id, x => ({ response:reply.trim(), thread:[...x.thread, { from:'team', author:ME.short, text:reply.trim(), ts:'Just now' }], history:[...x.history, { ts:'Just now', actor:ME.short, side:'internal', text:'Sent a response to the client' }] })); setReply(''); toast('Response sent. The client is notified.'); }}>Send response only</button>
                </div>
              </div>
            )}
          </div>

          <div className="card">
            <div className="card-header"><span className="card-title">History</span></div>
            {cr.history.slice().reverse().map((h,i) => (
              <div key={i} className="timeline-item" style={{ paddingBottom:12 }}>
                <div className="timeline-dot" style={{ width:24, height:24 }}><SvgIcon name={h.side==='client'?'user':'shield'} size={11}/></div>
                <div><div style={{ fontSize:12.5 }}><b>{h.actor}</b> {h.text}</div><div style={{ fontSize:11, opacity:.45 }}>{h.ts}</div></div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ flex:'1 1 280px', minWidth:260 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Decision</span></div>
            <Field label="Assignee">
              <select className="form-select" value={cr.assignee||''} onChange={e=>{ updateCR(cr.id, { assignee:e.target.value||null }); toast('Assignee updated. The client never sees internal assignment.'); }} disabled={terminal}>
                <option value="">Unassigned</option>{TEAM.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>
            </Field>
            <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
              {cr.status==='submitted' && <button className="btn btn-primary btn-sm" style={{ justifyContent:'center' }} onClick={()=>move('under_review', 'Started review', { assignee:cr.assignee || 'kf' })}>Start review</button>}
              {cr.status==='under_review' && <>
                <button className="btn btn-primary btn-sm" style={{ justifyContent:'center' }} onClick={()=>move('approved', `Approved${fmtEstimate(cr.estimate) ? ` with an estimate of ${fmtEstimate(cr.estimate)}` : ''}`, {}, reply.trim() || 'Approved. We will schedule the work and keep you posted.')}>Approve</button>
                <button className="btn btn-default btn-sm" style={{ justifyContent:'center' }} onClick={needMsg(()=>move('more_info', 'Asked the client for more information', {}, reply.trim()))}>Ask client for more info</button>
                <button className="btn btn-default btn-sm" style={{ justifyContent:'center', color:'#ff4d4f' }} onClick={needMsg(()=>move('rejected', 'Rejected with a response', {}, reply.trim()))}>Reject</button>
                <div style={{ fontSize:11, opacity:.5 }}>Asking for info and rejecting need a written response (use the box on the left). Approve sends a default one if you leave it empty.</div>
              </>}
              {cr.status==='more_info' && <>
                <div style={{ fontSize:12.5, opacity:.7 }}>Waiting on {cr.requester}. The request returns to Under Review when they reply.</div>
                <button className="btn btn-default btn-sm" style={{ justifyContent:'center' }} onClick={()=>move('under_review', 'Returned to Under Review')}>Return to review</button>
              </>}
              {cr.status==='approved' && <button className="btn btn-primary btn-sm" style={{ justifyContent:'center' }} onClick={()=>setConvert(true)}>Convert to work…</button>}
              {cr.status==='in_progress' && <button className="btn btn-primary btn-sm" style={{ justifyContent:'center' }} onClick={()=>move('completed', 'Marked as completed', {}, 'Done. This change is delivered and closed.')}>Mark completed</button>}
              {terminal && <div style={{ fontSize:12.5, opacity:.6 }}>This request is closed. Its history is preserved.</div>}
              {!terminal && <button className="btn btn-default btn-sm" style={{ justifyContent:'center' }} onClick={()=>setConfirmCancel(true)}>Cancel request</button>}
            </div>
          </div>

          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Estimate</span></div>
            <div className="form-row">
              <Field label="Extra time (hours)"><input className="form-input" type="number" min="0" value={hours} onChange={e=>setHours(e.target.value)} placeholder="Not set"/></Field>
              <Field label="Extra cost ($)"><input className="form-input" type="number" min="0" value={cost} onChange={e=>setCost(e.target.value)} placeholder="Not set"/></Field>
            </div>
            <div style={{ fontSize:11.5, opacity:.5, marginBottom:10 }}>Leave blank if not applicable. The client never sees “0” unless you enter zero on purpose.</div>
            <button className="btn btn-default btn-sm" disabled={terminal} onClick={saveEstimate}>Save estimate</button>
          </div>

          <div className="card" style={{ marginBottom:16, borderColor:'#ffd666' }}>
            <div className="card-header"><span className="card-title">Internal assessment</span><span className="tag tag-gray"><SvgIcon name="lock" size={11}/>&nbsp;Never shown to the client</span></div>
            <textarea className="form-input" rows={4} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Effort, risks, margin, negotiation notes…"/>
            <div style={{ marginTop:10 }}><button className="btn btn-default btn-sm" onClick={()=>{ updateCR(cr.id, { internalNotes:notes }); toast('Internal notes saved.'); }}>Save notes</button></div>
          </div>

          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Linked work</span></div>
            {cr.linkedTask ? (
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                <div><div style={{ fontWeight:600, fontSize:13 }}>{cr.linkedTask}</div><div style={{ fontSize:11.5, opacity:.55 }}>{cr.linkMode==='linked' ? 'Linked to' : 'Created from'} {cr.crNo}</div></div>
                <button className="btn btn-default btn-sm" onClick={()=>go('projects', { id:cr.projectId, tab:'tasks' })}>Open</button>
              </div>
            ) : <p style={{ fontSize:12.5, opacity:.5, margin:0 }}>{cr.status==='approved' ? 'Approved but not converted yet.' : 'No task yet. A task is only created when you convert an approved request.'}</p>}
            {billable && <div style={{ display:'flex', gap:8, marginTop:12, paddingTop:12, borderTop:'1px solid var(--border)' }}>
              <button className="btn btn-default btn-sm" onClick={()=>onBilling('quote', cr)}>Create quote</button>
              <button className="btn btn-default btn-sm" onClick={()=>onBilling('invoice', cr)}>Create invoice</button>
            </div>}
          </div>

          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">What the client sees</span></div>
            <KV rows={[['Status', CR_STATUS[cr.status].label], ['Response', cr.response ? 'Shown' : 'None yet'], ['Estimate', est || 'Not shown'], ['Assignee', 'Hidden'], ['Internal notes', 'Hidden']]}/>
          </div>

          {cr.status==='more_info' && (
            <ProtoHelper title="the client replies in their own portal">
              <input className="form-input" style={{ marginBottom:8 }} placeholder={`Reply as ${cr.requester}…`} value={followUp} onChange={e=>setFollowUp(e.target.value)}/>
              <button className="btn btn-sm btn-default" disabled={!followUp.trim()} onClick={simulateFollowUp}>{cr.requester.split(' ')[0]} sends information</button>
            </ProtoHelper>
          )}
        </div>
      </div>

      <ConvertToWorkModal open={convert} cr={cr} onClose={()=>setConvert(false)} onConfirm={doConvert}/>
      <Confirm open={confirmCancel} danger title="Cancel this change request?" confirmLabel="Cancel request" onClose={()=>setConfirmCancel(false)}
        onConfirm={()=>move('cancelled', 'Cancelled by the internal team', {}, reply.trim() || 'This request was withdrawn.')}>
        The client sees “Cancelled”. Nothing is deleted and the history stays.
      </Confirm>
    </div>
  );
};

const SIM_CR_POOL = [
  { title:'Add a live chat widget to the site', description:'We would like a live chat widget on the contact and pricing pages.', priority:'Medium', requesterId:2, requester:'Jamie Wu' },
  { title:'Add Google Analytics 4 event tracking', description:'Track form submissions and CTA clicks as GA4 events.', priority:'Low', requesterId:1, requester:'Alex Chen' },

];

const ChangeRequests = ({ onBilling }) => {
  const { changeRequests, setChangeRequests, clients, route, go, log, notify } = useStore();
  const [openId, setOpenId] = useState(null);
  const [query, setQuery] = useState('');
  const [status, setStatus] = useState('all');
  const [org, setOrg] = useState('all');
  const [prio, setPrio] = useState('all');

  useEffect(() => { if (route.key==='change-requests') setOpenId(route.params.id || null); }, [route.n]);

  const rows = changeRequests.filter(c => (status==='all' || c.status===status) && (org==='all' || c.orgId===Number(org)) && (prio==='all' || c.priority===prio)
    && (!query || (c.crNo+c.title+c.requester).toLowerCase().includes(query.toLowerCase())))
    .sort((a,b) => b.id-a.id);
  const { paged, pager } = usePaged(rows, [query, status, org, prio], 10);

  const open = changeRequests.find(c => c.id===openId);
  if (open) return <CRDetail cr={open} onBack={()=>setOpenId(null)} onBilling={onBilling}/>;

  const simulate = () => {
    const base = SIM_CR_POOL[changeRequests.length % SIM_CR_POOL.length];
    const id = Math.max(...changeRequests.map(c => c.id)) + 1;
    const crNo = 'CR-' + String(49 + (id - 9)).padStart(4, '0');
    const entry = { id, crNo, orgId:1, client:'Brandbase', projectId:1, ...base, submitted:TODAY, status:'submitted', assignee:null, notes:'', attachments:[], estimate:null, response:'', internalNotes:'', linkedTask:null,
      history:[{ ts:'Just now', actor:base.requester, side:'client', text:'Submitted the change request' }], thread:[] };
    setChangeRequests(list => [entry, ...list]);
    log({ actor:base.requester, side:'client', type:'change_request', action:'Change request created', target:`${crNo} · ${base.title}`, orgId:1 });
    notify({ type:'Change Request', title:`New change request ${crNo}`, body:`${base.requester}: ${base.title}`, route:{ key:'change-requests', params:{ id } } });
    toast(`${crNo} submitted by ${base.requester}. No task was created.`);
  };

  const count = (...s) => changeRequests.filter(c => s.includes(c.status)).length;

  return (
    <div>
      <PageHeader title="Change Requests" sub="Scope and feature changes your clients ask for. Review, estimate, decide, then convert approved ones into work.">
        <button className="btn btn-default btn-sm" style={{ borderStyle:'dashed' }} onClick={simulate} title="Prototype helper: stands in for a client submitting from their own portal">Simulate client submission</button>
      </PageHeader>
      <div className="grid-stat-4">
        <Stat label="Needs your review" value={count('submitted','under_review')} color="#d46b08" sub="Submitted and under review"/>
        <Stat label="Waiting on client" value={count('more_info')} color="#ff4d4f" sub="More information required"/>
        <Stat label="Approved / in progress" value={count('approved','in_progress')} color="#1677ff"/>
        <Stat label="Completed" value={count('completed')} color="#52c41a"/>
      </div>
      <div style={{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap' }}>
        <input className="form-input" style={{ maxWidth:260 }} placeholder="Search change requests…" value={query} onChange={e=>setQuery(e.target.value)}/>
        <select className="form-select" style={{ width:'auto' }} value={status} onChange={e=>setStatus(e.target.value)}><option value="all">All statuses</option>{Object.keys(CR_STATUS).map(k => <option key={k} value={k}>{CR_STATUS[k].label}</option>)}</select>
        <select className="form-select" style={{ width:'auto' }} value={org} onChange={e=>setOrg(e.target.value)}><option value="all">All clients</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
        <select className="form-select" style={{ width:'auto' }} value={prio} onChange={e=>setPrio(e.target.value)}><option value="all">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select>
      </div>
      <div className="card" style={{ padding:0 }}>
        <div style={{ overflowX:'auto' }}>
          <table className="wl-table">
            <thead><tr><th>ID</th><th>Request</th><th>Priority</th><th>Submitted</th><th>Status</th><th>Assignee</th><th>Estimate</th><th></th></tr></thead>
            <tbody>
              {paged.map(c => {
                const a = teamById(c.assignee), est = fmtEstimate(c.estimate);
                return (
                  <tr key={c.id} style={{ cursor:'pointer' }} onClick={()=>setOpenId(c.id)}>
                    <td style={{ color:'#1677ff', fontWeight:600 }}>{c.crNo}</td>
                    <td><div style={{ fontSize:13, fontWeight:600 }}>{c.title}</div><div style={{ fontSize:11.5, opacity:.5 }}>{c.client} · {c.requester}</div></td>
                    <td><PriorityTag p={c.priority}/></td>
                    <td style={{ fontSize:12, opacity:.65 }}>{fmtDate(c.submitted)}</td>
                    <td><CRStatusTag s={c.status}/></td>
                    <td>{a ? <Av initials={a.initials} color={a.color} size={24}/> : <span style={{ opacity:.35 }}>—</span>}</td>
                    <td style={{ fontSize:12.5 }}>{est || <span style={{ opacity:.35 }}>—</span>}</td>
                    <td onClick={e=>e.stopPropagation()}><RowMenu items={[
                      { label:'Open', onClick:()=>setOpenId(c.id) },
                      { label:'Create quote', hidden:!CR_BILLABLE.includes(c.status), onClick:()=>onBilling('quote', c) },
                      { label:'Create invoice', hidden:!CR_BILLABLE.includes(c.status), onClick:()=>onBilling('invoice', c) },
                    ]}/></td>
                  </tr>
                );
              })}
              {rows.length===0 && <tr><td colSpan="8" style={{ textAlign:'center', padding:30, opacity:.4 }}>No change requests match.</td></tr>}
            </tbody>
          </table>
        </div>
        {pager}
      </div>
    </div>
  );
};

const CTX_ICON = { project:'folder', task:'check-square', file:'file-text', approval:'clipboard-check' };

const NewDiscussionModal = ({ open, projectId, onClose, onCreate }) => {
  const { projects, tasks, files, approvals } = useStore();
  const eligible = projects.filter(p => p.portalEnabled);
  const [pid, setPid] = useState('');
  const [ctx, setCtx] = useState('project:');
  const [text, setText] = useState('');
  useEffect(() => { if (open) { setPid(String(projectId || (eligible[0] && eligible[0].id) || '')); setCtx('project:'); setText(''); } }, [open]);
  useEffect(() => { setCtx('project:'); }, [pid]);
  if (!open) return null;
  const p = Number(pid);
  const ts = tasks.filter(t => t.projectId===p && t.visibility==='client');
  const fs = files.filter(f => f.projectId===p && f.visibility==='client');
  const aps = approvals.filter(a => a.projectId===p && a.status!=='draft');
  return (
    <Modal open={open} onClose={onClose} width={500} title="New client-visible discussion"
      footer={<><button className="btn btn-default" onClick={onClose}>Cancel</button><button className="btn btn-primary" disabled={!text.trim()} onClick={()=>{ onCreate(p, ctx, text.trim()); onClose(); }}>Start discussion</button></>}>
      <Field label="Project"><select className="form-select" value={pid} onChange={e=>setPid(e.target.value)} disabled={!!projectId}>{eligible.map(x => <option key={x.id} value={x.id}>{x.name}</option>)}</select></Field>
      <Field label="About" hint="Only Client Visible tasks and files, and approvals the client can see, can host a client-visible discussion.">
        <select className="form-select" value={ctx} onChange={e=>setCtx(e.target.value)}>
          <option value="project:">The project in general</option>
          {ts.map(t => <option key={t.id} value={`task:${t.id}`}>Task: {t.clientTitle || t.title}</option>)}
          {fs.map(f => <option key={f.id} value={`file:${f.id}`}>File: {f.name}</option>)}
          {aps.map(a => <option key={a.id} value={`approval:${a.id}`}>Approval: {a.id} · {a.title}</option>)}
        </select>
      </Field>
      <Field label="First message (visible to the client)"><textarea className="form-input" rows={3} value={text} onChange={e=>setText(e.target.value)}/></Field>
    </Modal>
  );
};

const DiscussionsView = ({ projectId, embedded }) => {
  const { threads, setThreads, updateThread, users, projects, clients, tasks, files, route, log, notify } = useStore();
  const list = threads.filter(t => !projectId || t.projectId===projectId);
  const [activeId, setActiveId] = useState(null);
  const [vis, setVis] = useState('client');
  const [draft, setDraft] = useState('');
  const [query, setQuery] = useState('');
  const [unreadOnly, setUnreadOnly] = useState(false);
  const [showNew, setShowNew] = useState(false);
  const [simText, setSimText] = useState('');

  useEffect(() => { if (route.key==='discussions' && route.params.id) setActiveId(route.params.id); }, [route.n]);
  const filtered = list.filter(t => (!unreadOnly || t.unread>0) && (!query || (t.ctx.label + (projects.find(p => p.id===t.projectId)||{}).name + t.messages.map(m => m.text).join(' ')).toLowerCase().includes(query.toLowerCase())));
  const active = list.find(t => t.id===activeId) || filtered[0] || list[0];
  useEffect(() => { if (active && active.unread>0) updateThread(active.id, { unread:0 }); }, [active && active.id, active && active.messages.length]);

  const hiddenCtx = (t) => (t.ctx.type==='task' && (tasks.find(x => x.id===t.ctx.refId)||{}).visibility==='internal') || (t.ctx.type==='file' && (files.find(x => x.id===t.ctx.refId)||{}).visibility==='internal');
  const send = () => {
    if (!draft.trim() || !active) return;
    // Only a client-visible message can mention a client user. An internal comment never reaches them.
    const mentions = vis==='client' ? audience.filter(u => draft.includes('@'+u.name)).map(u => u.name) : [];
    updateThread(active.id, x => ({ messages:[...x.messages, { id:uid('m'), author:ME.short, side:'internal', vis, text:draft.trim(), time:'Just now', mentions }] }));
    toast(vis==='client'
      ? (mentions.length ? `Reply sent. ${mentions.join(' and ')} ${mentions.length>1?'are':'is'} notified that they were mentioned.` : 'Reply sent. Client users on this project are notified.')
      : 'Internal comment saved. The client cannot see it.');
    setDraft('');
  };
  const create = (pid, ctxKey, text) => {
    const [type, ref] = ctxKey.split(':');
    const label = type==='task' ? `Task: ${(tasks.find(t => t.id===Number(ref))||{}).clientTitle || (tasks.find(t => t.id===Number(ref))||{}).title}` : type==='file' ? `File: ${(files.find(f => f.id===Number(ref))||{}).name}` : type==='approval' ? `Approval: ${ref}` : 'General';
    const proj = projects.find(p => p.id===pid);
    const t = { id:uid('th'), orgId:proj.orgId, projectId:pid, ctx:{ type, refId: type==='project' ? undefined : type==='approval' ? ref : Number(ref), label }, unread:0, messages:[{ id:uid('m'), author:ME.short, side:'internal', vis:'client', text, time:'Just now' }] };
    setThreads(l => [t, ...l]); setActiveId(t.id);
    toast('Discussion started. Client users on this project are notified.');
  };
  const simulate = () => {
    if (!simText.trim() || !active) return;
    const people = users.filter(u => u.status==='active' && u.role!=='viewer' && u.projects.includes(active.projectId));
    const who = people[0] ? people[0].name : 'Client';
    updateThread(active.id, x => ({ unread:0, messages:[...x.messages, { id:uid('m'), author:who, side:'client', vis:'client', text:simText.trim(), time:'Just now' }] }));
    log({ actor:who, side:'client', type:'comment', action:'Client comment created', target:`${(projects.find(p => p.id===active.projectId)||{}).name} · ${active.ctx.label}`, orgId:active.orgId });
    notify({ type:'Comment', title:`${who} commented on ${active.ctx.label.replace(/^(Task|File|Approval): /, '')}`, body:simText.trim().slice(0,80), route:{ key:'discussions', params:{ id:active.id } } });
    setSimText('');
    toast(`${who} replied from their portal.`);
  };

  const audience = active ? users.filter(u => u.status==='active' && u.projects.includes(active.projectId)) : [];
  const activeProj = active ? projects.find(p => p.id===active.projectId) : null;

  const body = (
    <div className="chat-layout" style={{ maxWidth:'none', height: embedded ? 560 : 'calc(100vh - 210px)' }}>
      <div className="chat-sidebar">
        <div className="chat-search-row">
          <input className="chat-search-input" placeholder="Search discussions" value={query} onChange={e=>setQuery(e.target.value)}/>
          <button className="chat-new-btn" title="New discussion" onClick={()=>setShowNew(true)}>+</button>
        </div>
        <div style={{ padding:'0 14px 10px', display:'flex', gap:6 }}><Seg value={unreadOnly?'unread':'all'} onChange={v=>setUnreadOnly(v==='unread')} options={[['all','All'],['unread','Unread']]}/></div>
        <div className="chat-list">
          {filtered.map(t => {
            const last = t.messages[t.messages.length-1];
            const org = clients.find(c => c.id===t.orgId);
            return (
              <div key={t.id} className={`chat-list-item${active && active.id===t.id?' active':''}`} onClick={()=>setActiveId(t.id)}>
                <div className="chat-list-dot" style={{ background:t.unread>0 ? '#ff4d4f' : 'transparent' }}/>
                <Av initials={org ? org.initials : '?'} color={org ? org.color : '#999'} size={30}/>
                <div className="chat-list-body">
                  <div className="chat-list-top-row"><span className="chat-list-name">{t.ctx.label}</span>{hiddenCtx(t) && <span className="chat-list-tag" style={{ background:'rgba(255,77,79,.12)', color:'#ff4d4f' }}>Hidden</span>}</div>
                  <div className="chat-list-meta">{org ? org.name : ''} · {(projects.find(p => p.id===t.projectId)||{}).name}</div>
                  <div className="chat-list-preview">{last ? `${last.vis==='internal' ? '🔒 ' : ''}${last.text}` : ''}</div>
                </div>
              </div>
            );
          })}
          {filtered.length===0 && <div style={{ padding:'24px 16px', textAlign:'center', opacity:.4, fontSize:13 }}>No discussions here.</div>}
        </div>
      </div>

      {active ? (
        <div className="chat-main">
          <div className="chat-main-head">
            <div>
              <div style={{ fontWeight:600, fontSize:14, display:'flex', alignItems:'center', gap:8 }}><SvgIcon name={CTX_ICON[active.ctx.type]} size={15}/>{active.ctx.label}</div>
              <div style={{ fontSize:11, opacity:.5, marginTop:2 }}>{(clients.find(c => c.id===active.orgId)||{}).name} · {activeProj && activeProj.name}</div>
            </div>
            {hiddenCtx(active) && <span className="tag tag-red"><SvgIcon name="eye-off" size={11}/>&nbsp;Hidden from the client: the linked item is Internal Only</span>}
          </div>
          <div className="chat-messages">
            {active.messages.map(m => {
              const mine = m.side==='internal';
              const isInternal = m.vis==='internal';
              return (
                <div key={m.id} className={`chat-msg-row${mine?' mine':''}`}>
                  {!mine && <Av initials={initialsFromName(m.author)} color="#722ed1" size={26}/>}
                  <div className="chat-msg-col">
                    <div className="chat-msg-sender" style={{ display:'flex', gap:6, alignItems:'center' }}>{m.author}
                      {!mine && <span className="tag tag-purple">Client</span>}
                      {isInternal && <span className="tag tag-orange"><SvgIcon name="lock" size={10}/>&nbsp;Internal</span>}
                    </div>
                    <div className={`chat-msg ${mine?'mine':'theirs'}${isInternal?' internal':''}`}>{isInternal ? m.text : renderMentions(m.text)}</div>
                    <div className="chat-msg-time">{m.time}{isInternal && ' · only your team sees this'}</div>
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ borderTop:'1px solid var(--border)', padding:'10px 16px 12px' }}>
            <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, marginBottom:8, flexWrap:'wrap' }}>
              <div style={{ display:'flex', gap:8, alignItems:'center' }}>
                <Seg value={vis} onChange={setVis} options={[['client','Client visible'],['internal','Internal comment','internal']]}/>
                {vis==='client' && audience.length>0 && (
                  <select className="form-select" style={{ width:'auto', fontSize:12 }} value="" onChange={e=>{ if (e.target.value) setDraft(d => (d && !d.endsWith(' ') ? d+' ' : d) + '@'+e.target.value+' '); }}>
                    <option value="">@ Mention…</option>{audience.map(u => <option key={u.id} value={u.name}>{u.name}</option>)}
                  </select>
                )}
              </div>
              <span style={{ fontSize:11.5, opacity:.65, display:'flex', alignItems:'center', gap:5, color: vis==='internal' ? '#d46b08' : undefined }}>
                <SvgIcon name={vis==='internal' ? 'lock' : 'eye'} size={12}/>
                {vis==='internal' ? 'Only your team can see this' : `Visible to ${audience.length ? audience.map(u => u.name.split(' ')[0]).join(', ') : 'no active client users'} and your team`}
              </span>
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <input className={`chat-input`} style={vis==='internal' ? { borderColor:'#faad14', background:'rgba(250,173,20,.07)' } : undefined} placeholder={vis==='internal' ? 'Add an internal comment…' : 'Reply to the client…'} value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==='Enter' && send()}/>
              <button className="btn btn-primary btn-sm" onClick={send}>Send</button>
            </div>
            <div style={{ display:'flex', gap:8, marginTop:10, alignItems:'center' }}>
              <span style={{ fontSize:10.5, fontWeight:700, letterSpacing:.5, opacity:.45, whiteSpace:'nowrap' }}>PROTOTYPE HELPER</span>
              <input className="form-input" style={{ padding:'4px 10px', fontSize:12 }} placeholder="Simulate a client reply…" value={simText} onChange={e=>setSimText(e.target.value)} onKeyDown={e=>e.key==='Enter' && simulate()}/>
              <button className="btn btn-default btn-sm" disabled={!simText.trim()} onClick={simulate}>Simulate</button>
            </div>
          </div>
        </div>
      ) : <div className="chat-main"><Empty icon="message" text="No discussions yet. Start one with the + button."/></div>}
      <NewDiscussionModal open={showNew} projectId={projectId} onClose={()=>setShowNew(false)} onCreate={create}/>
    </div>
  );
  return body;
};

const AUDIT_TYPES = { access:'Access', visibility:'Visibility', file:'Files', comment:'Comments', approval:'Approvals', change_request:'Change requests' };

const AuditLog = () => {
  const { audit, clients, route } = useStore();
  const [query, setQuery] = useState('');
  const [type, setType] = useState('all');
  const [side, setSide] = useState('all');
  const [org, setOrg] = useState('all');
  useEffect(() => { if (route.key==='audit' && route.params.orgId) setOrg(String(route.params.orgId)); }, [route.n]);
  const rows = audit.filter(a => (type==='all' || a.type===type) && (side==='all' || a.side===side) && (org==='all' || a.orgId===Number(org))
    && (!query || (a.actor+a.action+a.target).toLowerCase().includes(query.toLowerCase())));
  const { paged, pager } = usePaged(rows, [query, type, side, org], 10);
  return (
    <div>
      <PageHeader title="Audit Log" sub="Every important client and internal action, timestamped and attributed to a user.">
        <button className="btn btn-default btn-sm" onClick={()=>toast('Audit log exported as CSV (prototype).')}><SvgIcon name="download" size={13}/> Export CSV</button>
      </PageHeader>
      <div style={{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap' }}>
        <input className="form-input" style={{ maxWidth:280 }} placeholder="Search actor, event or target…" value={query} onChange={e=>setQuery(e.target.value)}/>
        <select className="form-select" style={{ width:'auto' }} value={type} onChange={e=>setType(e.target.value)}><option value="all">All event types</option>{Object.keys(AUDIT_TYPES).map(k => <option key={k} value={k}>{AUDIT_TYPES[k]}</option>)}</select>
        <select className="form-select" style={{ width:'auto' }} value={side} onChange={e=>setSide(e.target.value)}><option value="all">Client and internal</option><option value="client">Client actions</option><option value="internal">Internal actions</option></select>
        <select className="form-select" style={{ width:'auto' }} value={org} onChange={e=>setOrg(e.target.value)}><option value="all">All clients</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
      </div>
      <div className="card" style={{ padding:0 }}>
        <div style={{ overflowX:'auto' }}>
          <table className="wl-table">
            <thead><tr><th>When</th><th>Actor</th><th>Event</th><th>Target</th><th>Client</th></tr></thead>
            <tbody>
              {paged.map(a => (
                <tr key={a.id}>
                  <td style={{ fontSize:12, opacity:.7, whiteSpace:'nowrap' }}>{a.ts}</td>
                  <td style={{ fontSize:13 }}><b>{a.actor}</b> <span className={`tag ${a.side==='client'?'tag-purple':'tag-gray'}`} style={{ marginLeft:4 }}>{a.side==='client'?'Client':'Internal'}</span></td>
                  <td style={{ fontSize:13 }}>{a.action}</td>
                  <td style={{ fontSize:12.5, opacity:.8 }}>{a.target}</td>
                  <td style={{ fontSize:12.5 }}>{(clients.find(c => c.id===a.orgId)||{}).name || '—'}</td>
                </tr>
              ))}
              {rows.length===0 && <tr><td colSpan="5" style={{ textAlign:'center', padding:30, opacity:.4 }}>No events match.</td></tr>}
            </tbody>
          </table>
        </div>
        {pager}
      </div>
    </div>
  );
};

const INVOICE_STATUS_OPTIONS = [['draft','Draft'], ['sent','Sent'], ['pending','Pending'], ['overdue','Overdue']];
const PAYMENT_STATUS_OPTIONS = ['Unpaid', 'Partially Paid', 'Paid'];
const PAYMENT_STATUS_TAG = { Paid:'tag-green', 'Partially Paid':'tag-orange', Unpaid:'tag-red' };
const PaymentStatusTag = ({ s }) => <span className={`tag ${PAYMENT_STATUS_TAG[s]||'tag-gray'}`}>{s}</span>;

const RecordPaymentModal = ({ open, invoice, initialStatus, onClose, onConfirm }) => {
  const [paymentStatus, setPaymentStatus] = useState('Paid');
  const [paidAmount, setPaidAmount] = useState('');
  const [proof, setProof] = useState(null);
  const proofRef = useRef(null);

  useEffect(() => {
    if (open && invoice) {
      const s = initialStatus || 'Paid';
      setPaymentStatus(s);
      setPaidAmount(s==='Paid' ? invoice.amount : (invoice.paid_amount || ''));
      setProof(null);
    }
  }, [open, invoice, initialStatus]);

  if (!open || !invoice) return null;

  const pickStatus = (s) => {
    setPaymentStatus(s);
    setPaidAmount(s==='Paid' ? invoice.amount : (invoice.paid_amount || ''));
  };

  const onProofChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (file) setProof(file.name);
  };

  const confirm = () => {
    const today = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
    const amt = paymentStatus==='Paid' ? invoice.amount : Math.max(0, Math.min(Number(paidAmount)||0, invoice.amount));
    onConfirm({ payment_status:paymentStatus, paid_amount:amt, paidAt:today, updatedAt:today, paymentProof: proof || invoice.paymentProof });
  };

  return (
    <Modal open={open} onClose={onClose} width={440} title="Record Payment"
      footer={<>
        <button className="btn btn-default btn-sm" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary btn-sm" onClick={confirm}>Save</button>
      </>}>
      <p style={{ fontSize:13, opacity:.7, marginTop:0 }}>Record a payment for <strong>{invoice.id}</strong> — invoice total ${invoice.amount.toFixed(2)}.</p>
      <div className="form-group">
        <label className="form-label">Payment Status</label>
        <div style={{ display:'flex', gap:8 }}>
          {['Paid','Partially Paid'].map(s => (
            <button key={s} type="button" className={`btn btn-sm ${paymentStatus===s?'btn-primary':'btn-default'}`} onClick={()=>pickStatus(s)}>{s}</button>
          ))}
        </div>
      </div>
      <div className="form-group">
        <label className="form-label">Paid Amount</label>
        {paymentStatus==='Paid' ? (
          <input className="form-input" value={`$${invoice.amount.toFixed(2)}`} disabled style={{ opacity:.7 }} />
        ) : (
          <input className="form-input" type="number" min="0" max={invoice.amount} step="0.01" value={paidAmount} onChange={e=>setPaidAmount(e.target.value)} placeholder="0.00" />
        )}
      </div>
      <div className="form-group" style={{ marginBottom:0 }}>
        <label className="form-label">Payment Proof (Optional)</label>
        {proof ? (
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', border:'1px solid var(--border)', borderRadius:7, padding:'8px 10px' }}>
            <span style={{ fontSize:12.5 }}>{proof}</span>
            <button className="wl-icon-btn" style={{ width:24, height:24, fontSize:12 }} onClick={()=>setProof(null)}>✕</button>
          </div>
        ) : (
          <div style={{ border:'1px dashed var(--border)', borderRadius:7, padding:'16px 10px', textAlign:'center' }}>
            <button className="btn btn-default btn-sm" onClick={()=>proofRef.current && proofRef.current.click()}>Upload File</button>
            <input ref={proofRef} type="file" accept="image/*,.pdf" style={{ display:'none' }} onChange={onProofChange} />
          </div>
        )}
      </div>
    </Modal>
  );
};
