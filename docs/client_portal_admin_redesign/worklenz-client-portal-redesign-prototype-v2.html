const INVOICABLE_REQUESTS_HELP = 'Only approved, in-progress and completed change requests can be invoiced. Leave blank to create a standalone invoice.';

const CreateInvoiceModal = ({ open, onClose, onCreate }) => {
  const { changeRequests, clients:CLIENTS } = useStore();
  const [requestId, setRequestId] = useState(null);
  const [requestQuery, setRequestQuery] = useState('');
  const [showRequestDropdown, setShowRequestDropdown] = useState(false);
  const [clientId, setClientId] = useState(CLIENTS[0] ? CLIENTS[0].id : '');
  const [project, setProject] = useState('');
  const [services, setServices] = useState([{ desc:'', qty:1, rate:0 }]);
  const [notes, setNotes] = useState('');
  const [currency, setCurrency] = useState('USD');
  const [dueDate, setDueDate] = useState('');
  const [discount, setDiscount] = useState(0);
  const [discountUnit, setDiscountUnit] = useState('%');
  const [tax, setTax] = useState(0);
  const [previewOpen, setPreviewOpen] = useState(false);
  const [previewInvoice, setPreviewInvoice] = useState(null);

  useEffect(() => {
    if (open) {
      setRequestId(null); setRequestQuery(''); setShowRequestDropdown(false);
      setClientId(CLIENTS[0] ? CLIENTS[0].id : '');
      setProject('');
      setServices([{ desc:'', qty:1, rate:0 }]);
      setNotes('');
      setCurrency('USD');
      setDueDate('');
      setDiscount(0); setDiscountUnit('%'); setTax(0);
    }
  }, [open]);

  useEffect(() => {
    if (!open) return;
    const close = () => setShowRequestDropdown(false);
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);

  const selectedRequest = changeRequests.find(r => r.id===requestId);
  const invoicableRequests = changeRequests.filter(r => CR_BILLABLE.includes(r.status));
  const filteredRequests = invoicableRequests.filter(r => {
    const q = requestQuery.trim().toLowerCase();
    return !q || r.crNo.toLowerCase().includes(q) || r.title.toLowerCase().includes(q);
  });

  const pickRequest = (r) => {
    setRequestId(r.id);
    setRequestQuery('');
    setShowRequestDropdown(false);
    setProject(r.title);
    setServices([{ desc:r.title, qty:1, rate:0 }]);
  };
  const clearRequest = () => setRequestId(null);

  const updateService = (i, field, val) => setServices(list => list.map((s,idx) => idx===i ? { ...s, [field]:val } : s));
  const addService = () => setServices(list => [...list, { desc:'', qty:1, rate:0 }]);
  const removeService = i => setServices(list => list.filter((_,idx) => idx!==i));

  const subtotal = services.reduce((s,row) => s + (Number(row.qty)||0) * (Number(row.rate)||0), 0);
  const discountAmt = discountUnit==='%' ? subtotal * (Number(discount)||0) / 100 : (Number(discount)||0);
  const taxAmt = Math.max(subtotal - discountAmt, 0) * (Number(tax)||0) / 100;
  const total = Math.max(subtotal - discountAmt, 0) + taxAmt;

  const resolveBilling = () => {
    if (selectedRequest) {
      const cRec = CLIENTS.find(c => c.name===selectedRequest.client);
      return { clientName:selectedRequest.client, company: cRec ? cRec.company : selectedRequest.client, email: cRec ? cRec.email : '', requester:selectedRequest.requester };
    }
    const cRec = CLIENTS.find(c => c.id === Number(clientId));
    if (!cRec) return null;
    return { clientName:cRec.name, company:cRec.company, email:cRec.email, requester:cRec.poc };
  };

  const buildInvoice = (status) => {
    const billing = resolveBilling();
    if (!billing) return null;
    const today = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
    const dueLabel = dueDate ? new Date(dueDate + 'T00:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }) : today;
    return {
      id: 'INV-' + Math.random().toString(36).slice(2,8).toUpperCase(),
      client: billing.clientName, project: project || (selectedRequest ? selectedRequest.title : 'Untitled Invoice'), amount: total,
      status, issued:today, due:dueLabel, paid_amount:0, payment_status:'Unpaid',
      currency: currency.toLowerCase(), notes, createdBy:'Gayan Thakshila',
      requestId: selectedRequest ? selectedRequest.id : undefined,
      company:billing.company, email:billing.email, requester:billing.requester,
      serviceDescription: selectedRequest ? selectedRequest.title : (project || ''),
      subtotal, discount:Number(discount)||0, discountUnit, tax:Number(tax)||0,
      services: services.map(s => ({ desc:s.desc, qty:Number(s.qty)||0, rate:Number(s.rate)||0, amount:(Number(s.qty)||0)*(Number(s.rate)||0) })),
    };
  };

  const create = (mode) => {
    const inv = buildInvoice(mode==='download' ? 'sent' : 'draft');
    if (!inv) { toast('Select a client first.'); return; }
    onCreate(inv);
    if (mode==='download') toast(`Downloading ${inv.id}.pdf…`);
  };

  const openPreview = () => {
    const inv = buildInvoice('draft');
    if (!inv) { toast('Select a client first.'); return; }
    setPreviewInvoice(inv);
    setPreviewOpen(true);
  };

  return (
    <>
    <Modal open={open} onClose={onClose} width={960} title="Create Invoice"
      footer={<>
        <button className="btn btn-default btn-sm" onClick={onClose}>Cancel</button>
        <button className="btn btn-default btn-sm" onClick={openPreview}>Preview</button>
        <button className="btn btn-default btn-sm" onClick={()=>create('draft')}>Save Draft</button>
        <button className="btn btn-primary btn-sm" onClick={()=>create('download')}>➤ Create &amp; Download</button>
      </>}>
      <div className="invoice-form-cols" style={{ display:'flex', gap:20, alignItems:'flex-start', flexWrap:'wrap' }}>
        <div style={{ flex:'2 1 380px', minWidth:0 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Select Change Request</span></div>
            {selectedRequest ? (
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', border:'1px solid var(--border)', borderRadius:7, padding:'8px 10px' }}>
                <div>
                  <div style={{ fontSize:13, fontWeight:700, color:'#1677ff' }}>{selectedRequest.crNo}</div>
                  <div style={{ fontSize:12.5, marginTop:2 }}>{selectedRequest.title} · {selectedRequest.client}</div>
                </div>
                <button className="wl-icon-btn" style={{ width:24, height:24, fontSize:12 }} onClick={clearRequest}>✕</button>
              </div>
            ) : (
              <div style={{ position:'relative' }} onMouseDown={e=>e.stopPropagation()}>
                <input className="form-input" placeholder="Search by change request number or title" value={requestQuery}
                  onFocus={()=>setShowRequestDropdown(true)}
                  onChange={e=>{ setRequestQuery(e.target.value); setShowRequestDropdown(true); }} />
                {showRequestDropdown && (
                  <div className="dropdown-menu" style={{ position:'absolute', top:'calc(100% + 4px)', left:0, right:0, width:'auto' }}>
                    {filteredRequests.length ? filteredRequests.map(r => (
                      <div key={r.id} className="dropdown-item" onClick={()=>pickRequest(r)}>
                        <div style={{ fontWeight:600 }}>{r.crNo}</div>
                        <div style={{ fontSize:11.5, opacity:.6 }}>{r.title} · {r.client}</div>
                      </div>
                    )) : <div style={{ padding:'10px 12px', fontSize:12.5, opacity:.5 }}>No matching change requests.</div>}
                  </div>
                )}
                <p style={{ fontSize:11.5, opacity:.5, margin:'6px 0 0' }}>{INVOICABLE_REQUESTS_HELP}</p>
              </div>
            )}
          </div>

          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Billing Details</span></div>
            <div className="form-group">
              <label className="form-label">Client</label>
              {selectedRequest ? (
                <div style={{ fontSize:13.5, fontWeight:600, border:'1px solid var(--border)', borderRadius:7, padding:'8px 10px', opacity:.85 }}>{selectedRequest.client}</div>
              ) : (
                <select className="form-select" value={clientId} onChange={e=>setClientId(e.target.value)}>
                  {CLIENTS.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              )}
            </div>
            <div className="form-group" style={{ marginBottom:0 }}>
              <label className="form-label">Project / Description</label>
              <input className="form-input" value={project} onChange={e=>setProject(e.target.value)} placeholder="e.g. Website Redesign" />
            </div>
          </div>

          <LineItemsCard title="Services" addLabel="+ Add Service" services={services} onUpdate={updateService} onAdd={addService} onRemove={removeService} />

          <div className="card">
            <div className="card-header"><span className="card-title">Notes</span></div>
            <textarea className="form-input" rows={3} style={{ resize:'vertical' }} value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Add payment terms, thank you message, or any additional notes…" />
          </div>
        </div>

        <div style={{ flex:'1 1 260px', minWidth:240 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Invoice Settings</span></div>
            <div className="form-group">
              <label className="form-label">Currency</label>
              <select className="form-select" value={currency} onChange={e=>setCurrency(e.target.value)}>
                <option value="USD">USD - US Dollar</option>
                <option value="LKR">LKR - Sri Lankan Rupee</option>
                <option value="EUR">EUR - Euro</option>
              </select>
            </div>
            <div className="form-group" style={{ marginBottom:0 }}>
              <label className="form-label">Payment Due Date (Optional)</label>
              <input className="form-input" type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} />
            </div>
          </div>

          <TaxDiscountCard discount={discount} discountUnit={discountUnit} tax={tax} onDiscount={setDiscount} onDiscountUnit={setDiscountUnit} onTax={setTax} />
          <SummaryCard subtotal={subtotal} total={total} />
        </div>
      </div>
    </Modal>
    <InvoicePreviewModal open={previewOpen} invoice={previewInvoice} onClose={()=>setPreviewOpen(false)} />
    </>
  );
};

  const [openInvoiceId, setOpenInvoiceId] = useState(null);
  const [openRowMenu, setOpenRowMenu] = useState(null);
  const [paymentModal, setPaymentModal] = useState(null);
  const [showCreateModal, setShowCreateModal] = useState(false);

  useEffect(() => {
    const close = () => setOpenRowMenu(null);
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);

  const updateInvoice = (id, patch) => setInvoices(prev => prev.map(i => i.id===id ? { ...i, ...patch } : i));

  const setStatus = (id, s) => updateInvoice(id, { status: s });

  const onPaymentStatusChange = (inv, ps) => {
    if (ps==='Unpaid') { updateInvoice(inv.id, { payment_status:'Unpaid', paid_amount:0, paidAt:null }); return; }
    setPaymentModal({ invoice: inv, initialStatus: ps });
  };

  const duplicateInvoice = (inv) => {
    const newId = 'INV-' + Math.random().toString(36).slice(2,8).toUpperCase();
    const copy = { ...inv, id:newId, status:'draft', payment_status:'Unpaid', paid_amount:0, paidAt:null,
      issued: new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }) };
    setInvoices(prev => [copy, ...prev]);
    toast(`Duplicated as ${newId}.`);
  };

  if (openInvoiceId) {
    const inv = invoices.find(i => i.id===openInvoiceId);
    return <InvoiceDetail invoice={inv} onBack={()=>setOpenInvoiceId(null)} onUpdate={updateInvoice} />;
  }

  const totalInvoiced = invoices.reduce((s,i) => s+i.amount, 0);
  const totalPaid = invoices.reduce((s,i) => s+(i.paid_amount||0), 0);
  const totalOutstanding = invoices.reduce((s,i) => s+(i.amount-(i.paid_amount||0)), 0);
  return (
    <div>
      <div className="page-header-row">
        <div><h1 style={{ fontSize:22, fontWeight:700, margin:0 }}>Invoices</h1>
          <p style={{ opacity:.5, fontSize:13, margin:'4px 0 0' }}>Send, track, and collect client payments</p></div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowCreateModal(true)}>+ Create Invoice</button>
      </div>
      <div className="grid-3">
        {[
          { l:'Total invoiced', v:'$'+totalInvoiced.toLocaleString(), c:'var(--text)' },
          { l:'Total paid', v:'$'+totalPaid.toLocaleString(), c:'#52c41a' },
          { l:'Total outstanding', v:'$'+totalOutstanding.toLocaleString(), c:'#ff4d4f' },
        ].map(s => (
          <div key={s.l} className="stat-card"><div className="label">{s.l}</div><div className="value" style={{ color:s.c }}>{s.v}</div></div>
        ))}
      </div>
      <div className="card" style={{ padding:0, overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
        <table className="wl-table">
          <thead><tr><th>Invoice</th><th>Client</th><th>Project</th><th>Amount</th><th>Payment Status</th><th>Paid Amount</th><th>Status</th><th>Issued</th><th>Due</th><th></th></tr></thead>
          <tbody>{invoices.map(inv => (
            <tr key={inv.id} style={{ cursor:'pointer' }} onClick={()=>setOpenInvoiceId(inv.id)}>
              <td><span style={{ fontWeight:600, color:'#1677ff' }}>{inv.id}</span></td>
              <td style={{ fontSize:13 }}>{inv.client}</td>
              <td style={{ fontSize:12, opacity:.65 }}>{inv.project}</td>
              <td style={{ fontWeight:600 }}>${inv.amount.toLocaleString()}</td>
              <td onClick={e=>e.stopPropagation()} onMouseDown={e=>e.stopPropagation()}>
                <select className="form-select" style={{ width:'auto', fontSize:12 }} value={inv.payment_status} onChange={e=>onPaymentStatusChange(inv, e.target.value)}>
                  {PAYMENT_STATUS_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </td>
              <td onClick={e=>e.stopPropagation()} onMouseDown={e=>e.stopPropagation()} style={{ fontWeight:600 }}>
                {inv.payment_status==='Partially Paid' ? (
                  <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                    <span style={{ opacity:.5 }}>$</span>
                    <input className="form-input" type="number" min="0" max={inv.amount} step="0.01" style={{ width:90, fontSize:12 }}
                      value={inv.paid_amount}
                      onChange={e=>updateInvoice(inv.id, { paid_amount: Math.max(0, Math.min(Number(e.target.value)||0, inv.amount)) })} />
                  </div>
                ) : (
                  <span style={{ color:inv.paid_amount>0?'#52c41a':'var(--text-sec)' }}>{inv.paid_amount>0?'$'+inv.paid_amount.toLocaleString():'—'}</span>
                )}
              </td>
              <td onClick={e=>e.stopPropagation()} onMouseDown={e=>e.stopPropagation()}>
                <select className="form-select" style={{ width:'auto', fontSize:12 }} value={inv.status} onChange={e=>setStatus(inv.id, e.target.value)}>
                  {INVOICE_STATUS_OPTIONS.map(([k,l]) => <option key={k} value={k}>{l}</option>)}
                </select>
              </td>
              <td style={{ fontSize:12, opacity:.65 }}>{inv.issued}</td>
              <td style={{ fontSize:12, color:inv.status==='overdue'?'#ff4d4f':'var(--text)' }}>{inv.due}</td>
              <td onClick={e=>e.stopPropagation()} onMouseDown={e=>e.stopPropagation()} style={{ position:'relative' }}>
                <button className="btn btn-default btn-sm" style={{ padding:'4px 9px', lineHeight:1 }} onClick={()=>setOpenRowMenu(openRowMenu===inv.id ? null : inv.id)}>⋮</button>
                {openRowMenu===inv.id && (
                  <div className="dropdown-menu" style={{ minWidth:170, top:'calc(100% + 2px)' }}>
                    <div className="dropdown-item" onClick={()=>{ setOpenRowMenu(null); setOpenInvoiceId(inv.id); }}>View</div>
                    <div className="dropdown-item" onClick={()=>{ setOpenRowMenu(null); toast(`Downloading ${inv.id}.pdf…`); }}>Download Invoice</div>
                    <div className="dropdown-item" onClick={()=>{ setOpenRowMenu(null); duplicateInvoice(inv); }}>Duplicate Invoice</div>
                  </div>
                )}
              </td>
            </tr>
          ))}</tbody>
        </table>
        </div>
      </div>

      <RecordPaymentModal open={!!paymentModal} invoice={paymentModal && paymentModal.invoice} initialStatus={paymentModal && paymentModal.initialStatus}
        onClose={()=>setPaymentModal(null)}
        onConfirm={patch => { updateInvoice(paymentModal.invoice.id, patch); setPaymentModal(null); toast(`${paymentModal.invoice.id} payment recorded.`); }} />

      <CreateInvoiceModal open={showCreateModal} onClose={()=>setShowCreateModal(false)}
        onCreate={inv => { setInvoices(prev => [inv, ...prev]); setShowCreateModal(false); toast(`${inv.id} created.`); }} />
    </div>
  );
};

const QUOTABLE_REQUESTS_HELP = 'Only approved, in-progress and completed change requests can be quoted. Leave blank to create a standalone quote.';

const CreateQuoteModal = ({ open, onClose, onCreate }) => {
  const { changeRequests, clients:CLIENTS } = useStore();
  const [requestId, setRequestId] = useState(null);
  const [requestQuery, setRequestQuery] = useState('');
  const [showRequestDropdown, setShowRequestDropdown] = useState(false);
  const [clientId, setClientId] = useState(CLIENTS[0] ? CLIENTS[0].id : '');
  const [project, setProject] = useState('');
  const [services, setServices] = useState([{ desc:'', qty:1, rate:0 }]);
  const [notes, setNotes] = useState('');
  const [currency, setCurrency] = useState('USD');
  const [validUntil, setValidUntil] = useState('');
  const [discount, setDiscount] = useState(0);
  const [discountUnit, setDiscountUnit] = useState('%');
  const [tax, setTax] = useState(0);
  const [previewOpen, setPreviewOpen] = useState(false);
  const [previewQuote, setPreviewQuote] = useState(null);

  useEffect(() => {
    if (open) {
      setRequestId(null); setRequestQuery(''); setShowRequestDropdown(false);
      setClientId(CLIENTS[0] ? CLIENTS[0].id : '');
      setProject('');
      setServices([{ desc:'', qty:1, rate:0 }]);
      setNotes('');
      setCurrency('USD');
      setValidUntil('');
      setDiscount(0); setDiscountUnit('%'); setTax(0);
    }
  }, [open]);

  useEffect(() => {
    if (!open) return;
    const close = () => setShowRequestDropdown(false);
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);

  const selectedRequest = changeRequests.find(r => r.id===requestId);
  const quotableRequests = changeRequests.filter(r => CR_BILLABLE.includes(r.status));
  const filteredRequests = quotableRequests.filter(r => {
    const query = requestQuery.trim().toLowerCase();
    return !query || r.crNo.toLowerCase().includes(query) || r.title.toLowerCase().includes(query);
  });

  const pickRequest = (r) => {
    setRequestId(r.id);
    setRequestQuery('');
    setShowRequestDropdown(false);
    setProject(r.title);
    setServices([{ desc:r.title, qty:1, rate:0 }]);
  };
  const clearRequest = () => setRequestId(null);

  const updateService = (i, field, val) => setServices(list => list.map((s,idx) => idx===i ? { ...s, [field]:val } : s));
  const addService = () => setServices(list => [...list, { desc:'', qty:1, rate:0 }]);
  const removeService = i => setServices(list => list.filter((_,idx) => idx!==i));

  const subtotal = services.reduce((s,row) => s + (Number(row.qty)||0) * (Number(row.rate)||0), 0);
  const discountAmt = discountUnit==='%' ? subtotal * (Number(discount)||0) / 100 : (Number(discount)||0);
  const taxAmt = Math.max(subtotal - discountAmt, 0) * (Number(tax)||0) / 100;
  const total = Math.max(subtotal - discountAmt, 0) + taxAmt;

  const resolveBilling = () => {
    if (selectedRequest) {
      const cRec = CLIENTS.find(c => c.name===selectedRequest.client);
      return { clientName:selectedRequest.client, company: cRec ? cRec.company : selectedRequest.client, email: cRec ? cRec.email : '', requester:selectedRequest.requester };
    }
    const cRec = CLIENTS.find(c => c.id === Number(clientId));
    if (!cRec) return null;
    return { clientName:cRec.name, company:cRec.company, email:cRec.email, requester:cRec.poc };
  };

  const buildQuote = (status) => {
    const billing = resolveBilling();
    if (!billing) return null;
    const today = new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
    const validLabel = validUntil ? new Date(validUntil + 'T00:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }) : today;
    return {
      id: 'QUO-' + Math.random().toString(36).slice(2,8).toUpperCase(),
      client: billing.clientName, project: project || (selectedRequest ? selectedRequest.title : 'Untitled Quote'), amount: total,
      status, issued:today, validUntil:validLabel,
      currency: currency.toLowerCase(), notes, createdBy:'Gayan Thakshila',
      requestId: selectedRequest ? selectedRequest.id : undefined,
      company:billing.company, email:billing.email, requester:billing.requester,
      subtotal, discount:Number(discount)||0, discountUnit, tax:Number(tax)||0,
      services: services.map(s => ({ desc:s.desc, qty:Number(s.qty)||0, rate:Number(s.rate)||0, amount:(Number(s.qty)||0)*(Number(s.rate)||0) })),
    };
  };

  const create = (mode) => {
    const q = buildQuote(mode==='download' ? 'sent' : 'draft');
    if (!q) { toast('Select a client first.'); return; }
    onCreate(q);
    if (mode==='download') toast(`Downloading ${q.id}.pdf…`);
  };

  const openPreview = () => {
    const q = buildQuote('draft');
    if (!q) { toast('Select a client first.'); return; }
    setPreviewQuote(q);
    setPreviewOpen(true);
  };

  return (
    <>
    <Modal open={open} onClose={onClose} width={960} title="Create Quote"
      footer={<>
        <button className="btn btn-default btn-sm" onClick={onClose}>Cancel</button>
        <button className="btn btn-default btn-sm" onClick={openPreview}>Preview</button>
        <button className="btn btn-default btn-sm" onClick={()=>create('draft')}>Save Draft</button>
        <button className="btn btn-primary btn-sm" onClick={()=>create('download')}>➤ Create &amp; Download</button>
      </>}>
      <div className="invoice-form-cols" style={{ display:'flex', gap:20, alignItems:'flex-start', flexWrap:'wrap' }}>
        <div style={{ flex:'2 1 380px', minWidth:0 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Select Change Request</span></div>
            {selectedRequest ? (
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', border:'1px solid var(--border)', borderRadius:7, padding:'8px 10px' }}>
                <div>
                  <div style={{ fontSize:13, fontWeight:700, color:'#1677ff' }}>{selectedRequest.crNo}</div>
                  <div style={{ fontSize:12.5, marginTop:2 }}>{selectedRequest.title} · {selectedRequest.client}</div>
                </div>
                <button className="wl-icon-btn" style={{ width:24, height:24, fontSize:12 }} onClick={clearRequest}>✕</button>
              </div>
            ) : (
              <div style={{ position:'relative' }} onMouseDown={e=>e.stopPropagation()}>
                <input className="form-input" placeholder="Search by change request number or title" value={requestQuery}
                  onFocus={()=>setShowRequestDropdown(true)}
                  onChange={e=>{ setRequestQuery(e.target.value); setShowRequestDropdown(true); }} />
                {showRequestDropdown && (
                  <div className="dropdown-menu" style={{ position:'absolute', top:'calc(100% + 4px)', left:0, right:0, width:'auto' }}>
                    {filteredRequests.length ? filteredRequests.map(r => (
                      <div key={r.id} className="dropdown-item" onClick={()=>pickRequest(r)}>
                        <div style={{ fontWeight:600 }}>{r.crNo}</div>

const QUOTE_STATUS_OPTIONS = [['draft','Draft'], ['sent','Sent'], ['accepted','Accepted'], ['declined','Declined'], ['expired','Expired']];

const ClientQuotesLite = () => {
  const [quotes, setQuotes] = useState(() => QUOTES.map(q => ({ ...q })));
  const [openQuoteId, setOpenQuoteId] = useState(null);
  const [openRowMenu, setOpenRowMenu] = useState(null);
  const [showCreateModal, setShowCreateModal] = useState(false);

  useEffect(() => {
    const close = () => setOpenRowMenu(null);
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);

  const updateQuote = (id, patch) => setQuotes(prev => prev.map(q => q.id===id ? { ...q, ...patch } : q));
  const setStatus = (id, s) => updateQuote(id, { status:s });

  const duplicateQuote = (q) => {
    const newId = 'QUO-' + Math.random().toString(36).slice(2,8).toUpperCase();
    const copy = { ...q, id:newId, status:'draft', issued: new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }) };
    setQuotes(prev => [copy, ...prev]);
    toast(`Duplicated as ${newId}.`);
  };

  if (openQuoteId) {
    const q = quotes.find(x => x.id===openQuoteId);
    return <QuoteDetail quote={q} onBack={()=>setOpenQuoteId(null)} />;
  }

  const totalQuoted = quotes.reduce((s,q) => s+q.amount, 0);
  const totalAccepted = quotes.filter(q=>q.status==='accepted').reduce((s,q)=>s+q.amount, 0);
  const totalPending = quotes.filter(q=>q.status==='draft'||q.status==='sent').reduce((s,q)=>s+q.amount, 0);

  return (
    <div>
      <div className="page-header-row">
        <div><h1 style={{ fontSize:22, fontWeight:700, margin:0 }}>Quotes</h1>
          <p style={{ opacity:.5, fontSize:13, margin:'4px 0 0' }}>Prepare, track, and follow up on client quotes</p></div>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowCreateModal(true)}>+ Create Quote</button>
      </div>
      <div className="grid-3">
        {[
          { l:'Total quoted', v:'$'+totalQuoted.toLocaleString(), c:'var(--text)' },
          { l:'Accepted', v:'$'+totalAccepted.toLocaleString(), c:'#52c41a' },
          { l:'Pending', v:'$'+totalPending.toLocaleString(), c:'#faad14' },
        ].map(s => (
          <div key={s.l} className="stat-card"><div className="label">{s.l}</div><div className="value" style={{ color:s.c }}>{s.v}</div></div>
        ))}
      </div>
      <div className="card" style={{ padding:0, overflow:'hidden' }}>
        <div style={{ overflowX:'auto' }}>
        <table className="wl-table">
          <thead><tr><th>Quote</th><th>Client</th><th>Project</th><th>Amount</th><th>Status</th><th>Issued</th><th>Valid Until</th><th></th></tr></thead>
          <tbody>{quotes.map(q => (
            <tr key={q.id} style={{ cursor:'pointer' }} onClick={()=>setOpenQuoteId(q.id)}>
              <td><span style={{ fontWeight:600, color:'#1677ff' }}>{q.id}</span></td>
              <td style={{ fontSize:13 }}>{q.client}</td>
              <td style={{ fontSize:12, opacity:.65 }}>{q.project}</td>
              <td style={{ fontWeight:600 }}>${q.amount.toLocaleString()}</td>
              <td onClick={e=>e.stopPropagation()} onMouseDown={e=>e.stopPropagation()}>
                <select className="form-select" style={{ width:'auto', fontSize:12 }} value={q.status} onChange={e=>setStatus(q.id, e.target.value)}>
                  {QUOTE_STATUS_OPTIONS.map(([k,l]) => <option key={k} value={k}>{l}</option>)}
                </select>
              </td>
              <td style={{ fontSize:12, opacity:.65 }}>{q.issued}</td>
              <td style={{ fontSize:12, color:q.status==='expired'?'#ff4d4f':'var(--text)' }}>{q.validUntil}</td>
              <td onClick={e=>e.stopPropagation()} onMouseDown={e=>e.stopPropagation()} style={{ position:'relative' }}>
                <button className="btn btn-default btn-sm" style={{ padding:'4px 9px', lineHeight:1 }} onClick={()=>setOpenRowMenu(openRowMenu===q.id ? null : q.id)}>⋮</button>
                {openRowMenu===q.id && (
                  <div className="dropdown-menu" style={{ minWidth:170, top:'calc(100% + 2px)' }}>
                    <div className="dropdown-item" onClick={()=>{ setOpenRowMenu(null); setOpenQuoteId(q.id); }}>View</div>
                    <div className="dropdown-item" onClick={()=>{ setOpenRowMenu(null); toast(`Downloading ${q.id}.pdf…`); }}>Download Quote</div>
                    <div className="dropdown-item" onClick={()=>{ setOpenRowMenu(null); duplicateQuote(q); }}>Duplicate Quote</div>
                  </div>
                )}
              </td>
            </tr>
          ))}</tbody>
        </table>
        </div>
      </div>

      <CreateQuoteModal open={showCreateModal} onClose={()=>setShowCreateModal(false)}
        onCreate={q => { setQuotes(prev => [q, ...prev]); setShowCreateModal(false); toast(`${q.id} created.`); }} />
    </div>
  );
};

                ].map(t => <div key={t} style={{ display:'flex', gap:8, padding:'8px 0', borderBottom:'1px solid var(--border)', fontSize:12.5 }}><span style={{ opacity:.4 }}>✓</span><span style={{ opacity:.75 }}>{t}</span></div>)}
              </div>
            </div>
          )}

          {section==='auth' && (
            <div className="card">
              <div className="card-header"><span className="card-title">Client Authentication</span></div>
              {row('Magic link sign-in', 'No password required. The default for every new client.', auth.magic, v=>setAuth(a => ({ ...a, magic:v })))}
              {row('Google sign-in', 'Let clients continue with their Google account.', auth.google, v=>setAuth(a => ({ ...a, google:v })))}
              {row('Password sign-in', 'Fallback for clients who prefer a password.', auth.password, v=>setAuth(a => ({ ...a, password:v })))}
              {row('Mark idle invitations as Expired', 'Invitations expire after 7 days. The user shows “Invite expired” with a one-click Resend.', auth.expire, v=>setAuth(a => ({ ...a, expire:v })))}
              {row('Email verification on activation', 'Every new client user confirms their invited email address with a 6-digit one-time code, valid for 10 minutes, before the account is activated. Always on.', true, ()=>{}, true)}
            </div>
          )}

          {section==='notifications' && (
            <div>
              <Banner kind="info" icon="shield">Notifications sent to clients never contain internal-only content in the title or body. In-app alerts are always on. Email is optional per event.</Banner>
              <div className="card" style={{ marginBottom:16, padding:0 }}>
                <div style={{ padding:'16px 20px 4px' }}><span className="card-title">Notifications to clients</span></div>
                <table className="wl-table">
                  <thead><tr><th>Event</th><th style={{ textAlign:'center' }}>In-app</th><th style={{ textAlign:'center' }}>Email</th></tr></thead>
                  <tbody>{NOTIF_CLIENT.map(([k,t,d]) => (
                    <tr key={k}><td><div style={{ fontSize:13, fontWeight:600 }}>{t}</div><div style={{ fontSize:11.5, opacity:.5 }}>{d}</div></td>
                      <td style={{ textAlign:'center' }}><Switch on disabled/></td>
                      <td style={{ textAlign:'center' }}><Switch on={notifs['c:'+k]} onChange={v=>setNotifs(n => ({ ...n, ['c:'+k]:v }))}/></td></tr>
                  ))}</tbody>
                </table>
              </div>
              <div className="card" style={{ padding:0 }}>
                <div style={{ padding:'16px 20px 4px' }}><span className="card-title">Notifications to your team</span></div>
                <table className="wl-table">
                  <thead><tr><th>Event</th><th style={{ textAlign:'center' }}>In-app</th><th style={{ textAlign:'center' }}>Email</th></tr></thead>
                  <tbody>{NOTIF_INTERNAL.map(([k,t,d]) => (
                    <tr key={k+t}><td><div style={{ fontSize:13, fontWeight:600 }}>{t}</div><div style={{ fontSize:11.5, opacity:.5 }}>{d}</div></td>
                      <td style={{ textAlign:'center' }}><Switch on disabled/></td>
                      <td style={{ textAlign:'center' }}><Switch on={notifs['i:'+k]} onChange={v=>setNotifs(n => ({ ...n, ['i:'+k]:v }))}/></td></tr>
                  ))}</tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
};

// ─── CLIENT PORTAL PREVIEW — read-only, staff-side: see exactly what one client user sees ──

const ClientPortalPreview = () => {
  const { users, clients, projects, milestones, tasks, files, approvals, changeRequests, updates, route, settings } = useStore();
  const candidates = users.filter(u => u.status==='active' && u.projects.length>0);
  const [userId, setUserId] = useState(() => {
    const pid = route.key==='portal' && route.params.projectId;
    const pick = pid ? candidates.find(u => u.projects.includes(pid) && u.role==='admin') || candidates.find(u => u.projects.includes(pid)) : null;
    return (pick || candidates[0] || {}).id;
  });
  const [tab, setTab] = useState('dashboard');
  const [openProject, setOpenProject] = useState(route.key==='portal' && route.params.projectId || null);
  const user = users.find(u => u.id===userId);
  useEffect(() => { if (route.key==='portal' && route.params.projectId) { const pid = route.params.projectId; setOpenProject(pid); setTab('projects'); const p = candidates.find(u => u.projects.includes(pid) && u.role==='admin') || candidates.find(u => u.projects.includes(pid)); if (p) setUserId(p.id); } }, [route.n]);

  if (!user) return <Empty icon="eye" text="No active client users to preview yet."/>;
  const org = clients.find(c => c.id===user.orgId);
  const myProjects = projects.filter(p => user.projects.includes(p.id) && p.portalEnabled);
  const ids = myProjects.map(p => p.id);
  const myMilestones = milestones.filter(m => ids.includes(m.projectId) && m.visibility==='client');
  const upcoming = myMilestones.filter(m => m.status!=='completed').sort((a,b) => a.target.localeCompare(b.target)).slice(0,4);
  const myApprovals = approvals.filter(a => ids.includes(a.projectId) && a.status!=='draft');
  const pendingMine = myApprovals.filter(a => a.status==='awaiting' && a.approverId===user.id);
  const myCRs = changeRequests.filter(c => c.orgId===user.orgId && ids.includes(c.projectId));
  const infoNeeded = myCRs.filter(c => c.status==='more_info' && c.requesterId===user.id);
  const hidden = {
    milestones:milestones.filter(m => ids.includes(m.projectId) && m.visibility==='internal').length,
    tasks:tasks.filter(t => ids.includes(t.projectId) && t.visibility==='internal').length,
    files:files.filter(f => ids.includes(f.projectId) && f.visibility==='internal').length,
    drafts:approvals.filter(a => ids.includes(a.projectId) && a.status==='draft').length,
  };
  const color = '#1677ff';
  const proj = projects.find(p => p.id===openProject && user.projects.includes(p.id) && p.portalEnabled);
  const TABS = [['dashboard','Dashboard'],['projects','Projects'],['approvals','Approvals'],['change-requests','Change Requests']];

  return (
    <div>
      <PageHeader title="Client Portal" sub="A read-only preview of what one client user sees, built from the same visibility rules the portal enforces.">
        <button className="btn btn-primary btn-sm" onClick={()=>window.open('worklenz-user-client-portal-redesign-prototype-v2.html','_blank')}><SvgIcon name="external" size={13}/> Open the client portal prototype</button>
      </PageHeader>

      <div style={{ display:'flex', gap:12, alignItems:'center', marginBottom:14, flexWrap:'wrap' }}>
        <span style={{ fontSize:12.5, opacity:.6 }}>Preview as</span>
        <select className="form-select" style={{ width:'auto', minWidth:260 }} value={userId} onChange={e=>{ setUserId(Number(e.target.value)); setOpenProject(null); setTab('dashboard'); }}>
          {candidates.map(u => <option key={u.id} value={u.id}>{u.name} · {(clients.find(c => c.id===u.orgId)||{}).name} · {ROLES[u.role].label}</option>)}
        </select>
        <RoleTag role={user.role}/>
      </div>

      <div style={{ display:'flex', gap:20, alignItems:'flex-start', flexWrap:'wrap' }}>
        <div style={{ flex:'3 1 520px', minWidth:0, border:'2px solid var(--border)', borderRadius:12, overflow:'hidden' }}>
          <div style={{ background:color, padding:'14px 20px', color:'#fff', display:'flex', justifyContent:'space-between', alignItems:'center', gap:12 }}>
            <div><div style={{ fontWeight:700, fontSize:16 }}>Ceydigital Project Hub</div><div style={{ opacity:.8, fontSize:12 }}>{org ? org.name : ''} · {user.name}</div></div>
            <span style={{ position:'relative' }}><SvgIcon name="bell" size={18}/></span>
          </div>
          <div style={{ background:'rgba(22,119,255,.06)', borderBottom:'1px solid var(--border)', display:'flex', overflowX:'auto' }}>
            {TABS.map(([k,l]) => <button key={k} className={`wl-nav-item${tab===k?' active':''}`} style={{ padding:'10px 16px', whiteSpace:'nowrap' }} onClick={()=>{ setTab(k); if (k!=='projects') setOpenProject(null); }}>{l}</button>)}
          </div>
          <div style={{ padding:20, background:'var(--card)', minHeight:320 }}>
            {tab==='dashboard' && <>
              <div className="grid-3" style={{ gap:12, marginBottom:18 }}>
                {[['Active projects', myProjects.filter(p => p.status!=='completed').length, color], ['Pending actions', pendingMine.length + infoNeeded.length, pendingMine.length+infoNeeded.length ? '#d46b08' : undefined], ['Upcoming milestones', upcoming.length, '#52c41a']].map(([l,v,c]) => (
                  <div key={l} style={{ padding:12, background:'var(--hover)', borderRadius:8 }}><div style={{ fontSize:11, opacity:.55 }}>{l}</div><div style={{ fontSize:22, fontWeight:700, color:c }}>{v}</div></div>
                ))}
              </div>
              <div className="form-label">NEEDS YOUR ACTION</div>
              {pendingMine.map(a => <div key={a.id} style={{ display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom:'1px solid var(--border)', fontSize:13 }}><span>{a.id} · {a.title}</span><span className="tag tag-orange">Approve</span></div>)}
              {infoNeeded.map(c => <div key={c.id} style={{ display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom:'1px solid var(--border)', fontSize:13 }}><span>{c.crNo} · {c.title}</span><span className="tag tag-red">Info needed</span></div>)}
              {pendingMine.length+infoNeeded.length===0 && <p style={{ fontSize:12.5, opacity:.5, margin:'4px 0 14px' }}>Nothing needs this user's action.{user.role!=='admin' && ' Only Client Admins can approve.'}</p>}
              <div className="form-label" style={{ marginTop:14 }}>PROJECTS</div>
              {myProjects.map(p => <div key={p.id} style={{ display:'flex', alignItems:'center', gap:12, padding:'9px 0', borderBottom:'1px solid var(--border)' }}><span style={{ flex:1, fontSize:13, fontWeight:600 }}>{p.name}</span><ProjectStatusTag s={p.status}/><Progress value={p.progress} color={p.color}/></div>)}
              {myProjects.length===0 && <p style={{ fontSize:12.5, opacity:.5 }}>No projects are assigned to this user. They see a friendly empty state, never your workspace.</p>}
            </>}

            {tab==='projects' && !proj && <>
              {myProjects.map(p => <div key={p.id} className="card card-sm" style={{ marginBottom:10, cursor:'pointer' }} onClick={()=>setOpenProject(p.id)}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}><b style={{ fontSize:13.5 }}>{p.name}</b><ProjectStatusTag s={p.status}/></div>
                <div style={{ fontSize:12, opacity:.6, margin:'4px 0 8px' }}>{p.phase} · Expected completion {fmtDate(p.due)}</div><Progress value={p.progress} color={p.color}/></div>)}
              {myProjects.length===0 && <p style={{ fontSize:12.5, opacity:.5 }}>No assigned projects.</p>}
            </>}
            {tab==='projects' && proj && <>
              <button className="btn btn-default btn-sm" style={{ marginBottom:12 }} onClick={()=>setOpenProject(null)}>← Projects</button>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}><b style={{ fontSize:16 }}>{proj.name}</b><ProjectStatusTag s={proj.status}/></div>
              <p style={{ fontSize:13, opacity:.75 }}>{proj.summary}</p>
              <KV rows={[['Phase', proj.phase], ['Progress', `${proj.progress}%`], ['Start', fmtDate(proj.start)], ['Expected completion', fmtDate(proj.due)], ['Primary contact', teamById(proj.contactId).name]]}/>
              {(() => { const u = updates.filter(x => x.projectId===proj.id).sort((a,b) => b.date.localeCompare(a.date))[0]; return u ? <div className="card card-sm" style={{ margin:'14px 0' }}><div style={{ fontSize:11.5, opacity:.55 }}>LATEST UPDATE · {teamById(u.authorId).short} · {fmtDate(u.date)}</div><div style={{ fontSize:13, marginTop:4 }}>{u.text}</div></div> : null; })()}
              <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
                {[['Milestones', myMilestones.filter(m => m.projectId===proj.id).length], ['Tasks', tasks.filter(t => t.projectId===proj.id && t.visibility==='client').length], ['Files', files.filter(f => f.projectId===proj.id && f.visibility==='client').length]].map(([l,n]) => <span key={l} className="tag tag-blue" style={{ padding:'4px 10px' }}>{n} {l}</span>)}
              </div>
            </>}

            {tab==='approvals' && <>
              {myApprovals.map(a => <div key={a.id} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'9px 0', borderBottom:'1px solid var(--border)', fontSize:13 }}><span><b>{a.id}</b> · {a.title}<div style={{ fontSize:11.5, opacity:.5 }}>{a.approverId===user.id && user.role==='admin' ? 'You can decide this' : 'View only for you'}</div></span><ApprovalStatusTag s={a.status}/></div>)}
              {myApprovals.length===0 && <p style={{ fontSize:12.5, opacity:.5 }}>No approvals on this user's projects. Drafts are never shown.</p>}
            </>}
            {tab==='change-requests' && <>
              {myCRs.map(c => <div key={c.id} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'9px 0', borderBottom:'1px solid var(--border)', fontSize:13 }}><span><b>{c.crNo}</b> · {c.title}<div style={{ fontSize:11.5, opacity:.5 }}>{fmtEstimate(c.estimate) ? `Estimate: ${fmtEstimate(c.estimate)}` : 'No estimate shown'}</div></span><CRStatusTag s={c.status}/></div>)}
              {myCRs.length===0 && <p style={{ fontSize:12.5, opacity:.5 }}>No change requests yet.</p>}
            </>}
          </div>
        </div>

        <div style={{ flex:'1 1 260px', minWidth:240 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Hidden from this view</span><span className="tag tag-gray"><SvgIcon name="lock" size={11}/>&nbsp;Staff only</span></div>
            <p style={{ fontSize:12, opacity:.55, margin:'-4px 0 8px' }}>This panel is never shown to the client. They cannot infer these counts from anything in the portal.</p>
            <KV rows={[['Internal-only milestones', hidden.milestones], ['Internal-only tasks', hidden.tasks], ['Internal-only files', hidden.files], ['Draft approvals', hidden.drafts]]}/>
          </div>
          <div className="card">
            <div className="card-header"><span className="card-title">{ROLES[user.role].label} can</span></div>
            {CAPABILITIES.map(([k,label]) => <div key={k} style={{ display:'flex', gap:8, fontSize:12, padding:'4px 0', opacity:ROLES[user.role].can[k]?1:.4 }}><span style={{ color:ROLES[user.role].can[k]?'#52c41a':'inherit' }}>{ROLES[user.role].can[k]?'✓':'—'}</span><span>{k==='manageUsers' && !(settings.adminsInvite||settings.adminsRemove) ? 'Manage organization users (currently off in Settings)' : label}</span></div>)}
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── SPEC COVERAGE DRAWER — maps the Prototype Functional Specification to what is on screen ──

const COVERAGE = [
  ['1. Dashboard', 'Clients › Overview “Needs attention” · Portal Projects', 'Dashboard'],
  ['2. Project Overview', 'Portal Projects › Overview (status, phase, progress, dates, contact, latest update)', 'Projects › Overview'],
  ['3. Milestones', 'Portal Projects › Milestones (create, status, visibility, completion note)', 'Projects › Milestones'],
  ['4. Client-visible tasks', 'Portal Projects › Tasks (Client Visible toggle, client-facing wording)', 'Projects › Tasks'],
  ['5. Files & documents', 'Portal Projects › Files (category, visibility, versions)', 'Projects › Files'],
  ['6. Comments / communication', 'Discussions (Client visible vs Internal comment composer)', 'Projects › Discussions'],
  ['7. Approvals', 'Approvals (create, revise, audit history)', 'Approvals'],
  ['8. Change requests', 'Change Requests (review, estimate, decide, convert to work)', 'Change Requests'],
  ['9. Notifications', 'Top-bar bell · Portal Settings › Notifications', 'Notifications'],
  ['10. Client user access', 'Clients › Users & Access · Add Client wizard', 'Account › Organization'],
];

// The six end-to-end workflows in section 16 of the Functional Specification (v1.0, 5 Oct 2026), and where each one runs.
const WORKFLOWS = [
  ['16.1 Client onboarding and first access', 'Clients › Add Client: organization, role, projects, send. Users & Access: “client verifies email and activates” (every client user confirms their email with a one-time code), expired link, resend.', 'Sign in › Activate › email code · expired · invalid link'],
  ['16.2 Sharing a task', 'Projects › Tasks: Client Visible switch and wording, audit event. Discussions: client comment notifies the team.', 'Tasks · task comments'],
  ['16.3 Sharing a file', 'Projects › Files: category, Client Visible, client notified. Helper: client previews, downloads, uploads. All logged.', 'Files · Prototype Controls › Recorded for your team'],
  ['16.4 Approval', 'Approvals: exact version, approver, due date, decision, resubmit as a new revision.', 'Approvals'],
  ['16.5 Change request', 'Change Req.: review, ask for information, estimate, decide, convert or link to work, complete.', 'Change Requests'],
  ['16.6 Revoke client access', 'Users & Access: deactivate. Client Access: remove a project. Both audited.', 'Access removed · item unavailable'],
];

const RATIONALE = [
  { tag:'Roles', before:'Company users were POC or Member, each with one of three per-project permission levels and three templates.', after:'Three roles only: Client Admin, Client Member, Client Viewer. One role per user, applied to every assigned project. Only a Client Admin can approve.', source:'Spec §2.1 and §14' },
  { tag:'Sharing model', before:'Eight section-level toggles (Project Plan, Gantt, Files, Invoices…) decided what the whole portal showed.', after:'Sharing is per item. Every task, file, milestone and comment is Internal Only until someone marks it Client Visible. Invoices keep their one section toggle.', source:'Spec §15.1' },
  { tag:'Requests', before:'Requests came from a service catalog. Services and Requests were separate modules.', after:'Change Requests belong to a project: submit, review, ask for information, estimate, approve or reject, then convert to work. Quotes and invoices link to them.', source:'Spec §12' },
  { tag:'Communication', before:'Chats were direct messages per client.', after:'Discussions attach to the project, task, file or approval they are about. Internal comments sit beside client-visible ones and are never sent to the portal.', source:'Spec §10' },
  { tag:'Approvals', before:'No formal sign-off. Approve buttons sat inside Project Updates.', after:'Approvals link to an exact file version, record the decision and keep a revision history.', source:'Spec §11' },
  { tag:'Audit', before:'Client activity was a few lines on a client overview.', after:'An Audit Log records access, visibility, file, comment, approval and change-request events with actor and timestamp.', source:'Spec §18.2' },
  { tag:'Removed', before:'Ticketing, Services, Chats and Client Reports.', after:'A full support desk, a service catalog and advanced analytics are outside the 10 agreed features, so they are not in this prototype.', source:'Spec §20' },
  { tag:'Kept as is', before:'Quotes and Invoices.', after:'Unchanged, apart from linking to a Change Request instead of a service request.', source:'Product decision' },
];

const RationaleDrawer = ({ open, onClose }) => (
  <React.Fragment>
    <div className={`side-drawer-scrim${open?' open':''}`} onClick={onClose}></div>
    <div className={`side-drawer${open?' open':''}`} style={{ width:460 }}>
      <div className="side-drawer-head">
        <div>
          <div style={{ fontWeight:700, fontSize:15 }}>Spec coverage</div>
          <div style={{ fontSize:11.5, opacity:.5, marginTop:2 }}>Client Portal Prototype Functional Specification v1.0 (5 Oct 2026) → this prototype</div>
        </div>
        <button className="wl-icon-btn" onClick={onClose}>✕</button>
      </div>
      <div className="side-drawer-body">
        <div className="form-label">THE 10 CORE FEATURES</div>
        <div className="card card-sm" style={{ marginBottom:18 }}>
          {COVERAGE.map(([f, admin, client]) => (
            <div key={f} style={{ padding:'7px 0', borderBottom:'1px solid var(--border)' }}>
              <div style={{ fontSize:12.5, fontWeight:700 }}>{f}</div>
              <div style={{ fontSize:11.5, opacity:.65 }}>Internal: {admin}</div>
              <div style={{ fontSize:11.5, opacity:.65 }}>Client: {client}</div>
            </div>
          ))}
        </div>
        <div className="form-label">THE SIX WORKFLOWS (SECTION 16)</div>
        <div className="card card-sm" style={{ marginBottom:18 }}>
          {WORKFLOWS.map(([f, admin, client]) => (
            <div key={f} style={{ padding:'7px 0', borderBottom:'1px solid var(--border)' }}>
              <div style={{ fontSize:12.5, fontWeight:700 }}>{f}</div>
              <div style={{ fontSize:11.5, opacity:.65 }}>Internal: {admin}</div>
              <div style={{ fontSize:11.5, opacity:.65 }}>Client: {client}</div>
            </div>
          ))}
        </div>
        <div className="form-label">WHAT CHANGED FROM THE EARLIER PROTOTYPE</div>
        {RATIONALE.map((r,i) => (
          <div key={i} className="rationale-card">
            <span className="tag tag-blue" style={{ marginBottom:8, display:'inline-block' }}>{r.tag}</span>
            <div className="rationale-before">{r.before}</div>
            <div className="rationale-after">{r.after}</div>
            <div style={{ fontSize:11, opacity:.45 }}>Source: {r.source}</div>
          </div>
        ))}
      </div>
    </div>
  </React.Fragment>
);

// ─── APP SHELL ──────────────────────────────────────────────────────────────────

const Shell = ({ dark, setDark }) => {
  const { route, go } = useStore();
  const [billing, setBilling] = useState(null);
  const [showRationale, setShowRationale] = useState(false);
  useEffect(() => { setBilling(null); }, [route.n]);

  const modules = {
    clients: <ClientsHome/>,
    projects: <PortalProjects/>,
    approvals: <Approvals/>,
    'change-requests': <ChangeRequests onBilling={(kind, cr)=>setBilling({ kind, cr })}/>,
    discussions: <Discussions/>,
    quotes: <ClientQuotesLite/>,
    invoices: <ClientInvoicesLite/>,
    audit: <AuditLog/>,
    'portal-settings': <PortalSettingsRedesigned/>,
    portal: <ClientPortalPreview/>,
  };
  let content = modules[route.key] || modules.clients;
  if (billing) {
    const back = () => { const id = billing.cr.id; setBilling(null); go('change-requests', { id }); };
    content = billing.kind==='quote' ? <CreateQuotePage request={billing.cr} onBack={back}/> : <CreateInvoicePage request={billing.cr} onBack={back}/>;
  }

  return (
    <div className="wl-app">
      <TopNav active="clients" dark={dark} onToggleDark={()=>setDark(d=>!d)}
        onNav={(k)=>{ if (k!=='clients') toast('This prototype is scoped to the Clients section.'); }} />
      <div className="wl-body">
        <Sidebar active={billing ? 'change-requests' : route.key} onNav={(k)=>go(k)} />
        <main className="wl-content">{content}</main>
      </div>
      <button className="fab-rationale" onClick={()=>setShowRationale(true)}>💡 Spec coverage</button>
      <RationaleDrawer open={showRationale} onClose={()=>setShowRationale(false)} />
      <ToastHost/>
    </div>
  );
};

const App = () => {
  const [dark, setDark] = useState(false);
  const [route, setRoute] = useState({ key:'clients', params:{}, n:0 });
  const go = (key, params={}) => setRoute(r => ({ key, params, n:r.n+1 }));
  useEffect(() => { document.body.className = dark ? 'dark' : ''; }, [dark]);
  return (
    <StoreProvider route={route} go={go}>
      <Shell dark={dark} setDark={setDark}/>
    </StoreProvider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
