<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worklenz Client Portal — Admin Prototype (v2, spec-aligned)</title>
<link rel="stylesheet" href="https://unpkg.com/antd@5.17.0/dist/reset.css">
<style>
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wl-app{min-height:100vh;display:flex;flex-direction:column}

/* TOP NAV */
.wl-topnav{height:52px;display:flex;align-items:center;padding:0 16px;gap:8px;position:fixed;top:0;left:0;right:0;z-index:100;border-bottom:1px solid var(--border);}
.wl-logo{display:flex;align-items:center;text-decoration:none;min-width:120px}
.wl-logo img{height:28px;width:auto;object-fit:contain}
.wl-nav-items{display:flex;align-items:center;gap:2px;flex:1}
.wl-nav-item{padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13.5px;font-weight:500;border:none;background:transparent;transition:all .15s;position:relative}
.wl-nav-item.active{color:#1677ff}
.wl-nav-item.active::after{content:'';position:absolute;bottom:-13px;left:12px;right:12px;height:2px;background:#1677ff;border-radius:2px}
.wl-nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.wl-search-bar{display:flex;align-items:center;gap:6px;padding:5px 16px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:12px;flex:1;max-width:560px;min-width:260px}
.wl-icon-btn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;font-size:15px;position:relative}
.wl-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#ff4d4f;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600}
.wl-team-pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-weight:500}

/* LAYOUT */
.wl-body{display:flex;flex:1;margin-top:52px;min-height:calc(100vh - 52px)}
.wl-sidebar{width:80px;min-width:80px;border-right:1px solid var(--border);padding:6px 0 0;display:flex;flex-direction:column;align-items:center;gap:0;position:fixed;top:52px;left:0;bottom:0;overflow-y:auto;overflow-x:hidden}
.wl-sidebar-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:100%;padding:10px 4px 9px;cursor:pointer;border:none;background:transparent;transition:all .15s;position:relative;color:var(--sidebar-text)}
.wl-sidebar-item .icon{display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.35);flex-shrink:0;transition:color .15s}
.wl-sidebar-item .label{font-size:10px;font-weight:500;text-align:center;line-height:1.2;color:rgba(0,0,0,.4);white-space:nowrap;transition:color .15s}
.wl-sidebar-item.active{background:rgba(22,119,255,.07)}
.wl-sidebar-item.active .icon{color:#1677ff}
.wl-sidebar-item.active .label{color:#1677ff;font-weight:600}
.wl-sidebar-item:hover:not(.active){background:rgba(0,0,0,.03)}
.wl-sidebar-item:hover:not(.active) .icon{color:rgba(0,0,0,.55)}
.wl-sidebar-item:hover:not(.active) .label{color:rgba(0,0,0,.55)}
.wl-sidebar-item .badge{position:absolute;top:7px;right:8px;min-width:16px;height:16px;border-radius:8px;background:#ff4d4f;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
.wl-sidebar-item .soon-tag{position:absolute;top:6px;right:5px;font-size:8px;background:rgba(250,173,20,.15);color:#d46b08;border-radius:3px;padding:1px 4px;font-weight:600}
.sidebar-divider{width:44px;height:1px;background:var(--border);margin:3px auto;flex-shrink:0}
.sidebar-bottom{margin-top:auto;width:100%;padding:8px 8px 16px;border-top:1px solid var(--sidebar-bottom-border);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.sidebar-settings-menu{background:var(--sidebar-menu-bg);border:1px solid var(--sidebar-menu-border);border-radius:10px;box-shadow:var(--sidebar-menu-shadow);padding:8px}
.sidebar-settings-header{font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;padding:2px 10px 8px;color:var(--sidebar-menu-header)}
.sidebar-settings-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;color:var(--sidebar-menu-text);transition:all .15s;border:none;background:transparent;width:100%;text-align:left;white-space:nowrap}
.sidebar-settings-item .icon{color:#1677ff;display:flex;align-items:center;flex-shrink:0}
.sidebar-settings-item:hover{background:var(--sidebar-menu-hover);color:var(--sidebar-menu-hover-text)}
.sidebar-trial-badge{display:flex;flex-direction:column;align-items:center;justify-content:center;width:48px;padding:5px 4px;border-radius:22px;background:transparent;color:var(--sidebar-toggle-color);cursor:pointer;border:1.5px solid var(--border)}
.sidebar-trial-badge .t-label{font-size:8px;font-weight:700;letter-spacing:.6px;line-height:1}
.sidebar-trial-badge .t-num{font-size:15px;font-weight:800;line-height:1.1;color:#1677ff}
.sidebar-icon-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;padding:7px 4px 6px;cursor:pointer;border:none;background:transparent;color:var(--sidebar-toggle-color);transition:all .15s;position:relative;border-radius:7px}
.sidebar-icon-btn:hover{background:var(--hover);color:var(--text)}
.sidebar-icon-btn .btn-label{font-size:9px;font-weight:500;line-height:1}
.sidebar-upgrade-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:calc(100% - 0px);padding:8px 4px;border-radius:7px;cursor:pointer;border:none;background:linear-gradient(135deg,#ff4d4f,#ff7875);color:#fff;transition:all .15s;font-size:9px;font-weight:700;letter-spacing:.2px}
.sidebar-upgrade-btn:hover{background:linear-gradient(135deg,#cf1322,#ff4d4f);box-shadow:0 4px 12px rgba(255,77,79,.4);transform:translateY(-1px)}
.sidebar-upgrade-btn .up-icon{font-size:16px;line-height:1}
.wl-content{flex:1;margin-left:80px;min-height:calc(100vh - 52px);padding:24px;overflow-y:auto}

/* CARDS */
.stat-card{border-radius:10px;padding:18px 20px;border:1px solid var(--border);background:var(--card)}
.stat-card .label{font-size:12px;opacity:.55;margin-bottom:4px}
.stat-card .value{font-size:26px;font-weight:700;line-height:1.2}
.stat-card .delta{font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px}
.delta.up{color:#52c41a}
.delta.down{color:#ff4d4f}

/* TABLES */
.wl-table{width:100%;border-collapse:collapse;font-size:13px}
.wl-table th{padding:8px 12px;text-align:left;font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:.55;border-bottom:1px solid var(--border)}
.wl-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.wl-table tr:hover td{background:var(--hover)}
.wl-table tr:last-child td{border-bottom:none}

/* TAGS / BADGES */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-red{background:rgba(255,77,79,.12);color:#ff4d4f}
.tag-green{background:rgba(82,196,26,.12);color:#52c41a}
.tag-orange{background:rgba(250,173,20,.12);color:#d46b08}
.tag-blue{background:rgba(22,119,255,.12);color:#1677ff}
.tag-purple{background:rgba(114,46,209,.12);color:#722ed1}
.tag-cyan{background:rgba(19,194,194,.12);color:#13c2c2}
.tag-gray{background:rgba(128,128,128,.12);color:#666}

/* PROGRESS */
.progress-bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .3s}

/* AVATARS */
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;border:2px solid var(--card)}
.av-group{display:flex}
.av-group .av{margin-left:-8px}
.av-group .av:first-child{margin-left:0}

/* PAGE HEADER */
.page-header{margin-bottom:20px}
.page-header h1{font-size:22px;font-weight:700;margin:0 0 4px}
.page-header p{font-size:13px;opacity:.55;margin:0}
.page-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}

/* SECTION TABS */
.section-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.section-tab{padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.section-tab.active{color:#1677ff;border-bottom-color:#1677ff}
.section-tab:hover:not(.active){opacity:.75}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap}
.btn-primary{background:#1677ff;color:#fff;border-color:#1677ff}
.btn-primary:hover{background:#0958d9}
.btn-default{background:var(--card);border-color:var(--border)}
.btn-default:hover{border-color:#1677ff;color:#1677ff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-danger{background:#fff1f0;color:#ff4d4f;border-color:#ffa39e}

/* GRID */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:16px}
.grid-stat-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.grid-stat-5{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px}

/* CARD */
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600}
.card-sm{padding:14px 16px}

/* HEALTH DOTS */
.health-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.health-dot.healthy{background:#52c41a}
.health-dot.risk{background:#ff4d4f}
.health-dot.watch{background:#faad14}
.health-dot.blocked{background:#d9d9d9}

/* DROPDOWN */
.dropdown{position:relative;display:inline-block}
.dropdown-menu{position:absolute;top:calc(100% + 4px);right:0;background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);min-width:180px;z-index:999;padding:4px}
.dropdown-item{padding:8px 12px;cursor:pointer;font-size:13px;border-radius:5px;transition:background .1s;white-space:nowrap}
.dropdown-item:hover{background:var(--hover)}
.dropdown-divider{height:1px;background:var(--border);margin:4px 0}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--card);border-radius:12px;width:480px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{margin:0;font-size:16px;font-weight:600}
.modal-body{padding:20px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* FORM */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;opacity:.7}
.form-input{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text)}
.form-input:focus{outline:none;border-color:#1677ff}
.form-select{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* CHAT */
.chat-layout{display:grid;grid-template-columns:320px 1fr;max-width:1100px;height:calc(100vh - 200px);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.chat-sidebar{width:320px;border-right:1px solid var(--border);display:flex;flex-direction:column}
.chat-search-row{display:flex;gap:8px;padding:14px 14px 12px}
.chat-search-input{flex:1;padding:7px 14px;border-radius:20px;border:1px solid var(--border);font-size:12.5px;background:var(--hover);color:var(--text)}
.chat-search-input:focus{outline:none;border-color:#1677ff;background:var(--card)}
.chat-new-btn{width:32px;height:32px;min-width:32px;border-radius:50%;border:none;background:#1677ff;color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
.chat-new-btn:hover{background:#0958d9}
.chat-list{flex:1;overflow-y:auto;border-top:1px solid var(--border)}
.chat-list-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;display:flex;gap:10px;align-items:flex-start}
.chat-list-item:hover,.chat-list-item.active{background:var(--hover)}
.chat-list-dot{width:8px;height:8px;min-width:8px;border-radius:50%;margin-top:7px}
.chat-list-body{flex:1;min-width:0}
.chat-list-top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chat-list-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list-tag{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:4px;flex-shrink:0}
.chat-list-meta{font-size:11.5px;opacity:.5;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-list-preview{font-size:12px;opacity:.55;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-main-head{padding:13px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.chat-messages{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.chat-date-divider{align-self:center;font-size:11px;opacity:.5;background:var(--hover);border-radius:12px;padding:3px 14px;margin-bottom:16px}
.chat-msg-row{display:flex;gap:8px;margin-bottom:16px;max-width:72%}
.chat-msg-row.mine{align-self:flex-end;flex-direction:row-reverse}
.chat-msg-col{min-width:0}
.chat-msg-sender{font-size:11.5px;font-weight:600;opacity:.55;margin-bottom:4px}
.chat-msg{display:inline-block;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5;word-break:break-word}
.chat-msg.mine{background:#1677ff;color:#fff;border-radius:10px 10px 2px 10px}
.chat-msg.theirs{background:var(--hover);border-radius:10px 10px 10px 2px}
.chat-msg-time{font-size:10px;opacity:.4;margin-top:4px}
.chat-msg-row.mine .chat-msg-time{text-align:right}
.chat-mention{background:rgba(22,119,255,.15);color:#1677ff;border-radius:4px;padding:0 4px;font-weight:600}
.chat-input-row{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input{flex:1;padding:9px 16px;border-radius:20px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text)}
.chat-input:focus{outline:none;border-color:#1677ff}

/* TIMELINE */
.timeline-item{display:flex;gap:12px;padding-bottom:16px;position:relative}
.timeline-item::before{content:'';position:absolute;left:15px;top:28px;bottom:0;width:1px;background:var(--border)}
.timeline-item:last-child::before{display:none}
.timeline-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;border:2px solid var(--border)}

/* COMING SOON */
.coming-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;gap:12px}
.coming-soon h2{font-size:20px;font-weight:700;margin:0}
.coming-soon p{font-size:14px;opacity:.55;max-width:360px;margin:0}
.coming-soon .icon-big{font-size:48px;margin-bottom:8px}

/* CRM-style settings layout (rail + content) — reused here for the Client Workspace */
.crm-settings-layout{display:flex;gap:28px;align-items:flex-start}
.crm-settings-rail{width:220px;flex:0 0 220px}
.crm-settings-rail-title{font-size:11px;font-weight:700;color:var(--text);opacity:.45;text-transform:uppercase;letter-spacing:.6px;padding:0 10px 8px}
.crm-settings-rail-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--text);cursor:pointer;opacity:.75;background:transparent;border:none;text-align:left;margin-bottom:2px}
.crm-settings-rail-item:hover{background:var(--hover);opacity:1}
.crm-settings-content{flex:1;min-width:0}
.crm-color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;padding:0}
.crm-color-swatch.active{border-color:var(--text)}
.crm-mini-list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.crm-mini-list-row:last-child{border-bottom:none}
.crm-dup-banner{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 14px;border-radius:8px;background:rgba(250,173,20,.1);border:1px solid rgba(250,173,20,.35);font-size:12.5px;margin-bottom:16px}

/* CRM PIPELINE BOARD — reused here for the per-client Tasks kanban */
.crm-board{display:flex;gap:12px;overflow-x:auto;align-items:flex-start}
.crm-board-col{flex:0 0 240px;background:var(--hover);border-radius:10px;border-top:3px solid var(--border);display:flex;flex-direction:column}
.crm-board-col-header{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-size:12.5px;font-weight:600}
.crm-board-col-body{flex:1;overflow-y:auto;padding:0 8px 8px;min-height:60px}
.crm-board-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.crm-board-card:hover{border-color:#1677ff}
.crm-board-card-title{font-size:12.5px;font-weight:600;margin-bottom:6px}
.crm-board-card-foot{display:flex;align-items:center;justify-content:space-between;font-size:11px;opacity:.7}

/* LIGHT THEME VARS */
body{
  --bg:#f0f2f5;
  --card:#ffffff;
  --border:#e8e8e8;
  --text:rgba(0,0,0,.88);
  --text-sec:rgba(0,0,0,.45);
  --hover:rgba(0,0,0,.04);
  --sidebar-bg:#ffffff;
  --sidebar-text:rgba(0,0,0,.65);
  --sidebar-active:rgba(22,119,255,.08);
  --sidebar-hover-text:rgba(0,0,0,.88);
  --sidebar-section-color:rgba(0,0,0,.35);
  --sidebar-bottom-border:rgba(0,0,0,.08);
  --sidebar-toggle-bg:rgba(0,0,0,.04);
  --sidebar-toggle-border:rgba(0,0,0,.1);
  --sidebar-toggle-color:rgba(0,0,0,.45);
  --sidebar-toggle-hover-bg:rgba(0,0,0,.08);
  --sidebar-toggle-hover-color:rgba(0,0,0,.8);
  --sidebar-menu-bg:#f5f6f8;
  --sidebar-menu-border:rgba(0,0,0,.1);
  --sidebar-menu-shadow:0 -12px 32px rgba(0,0,0,.12);
  --sidebar-menu-header:rgba(0,0,0,.35);
  --sidebar-menu-text:rgba(0,0,0,.65);
  --sidebar-menu-hover:rgba(0,0,0,.05);
  --sidebar-menu-hover-text:rgba(0,0,0,.9);
  --sidebar-menu-divider:rgba(0,0,0,.08);
  --topnav-bg:#ffffff;
  --shadow:0 2px 8px rgba(0,0,0,.08);
}
/* DARK THEME VARS */
body.dark{
  --bg:#141414;
  --card:#1f1f1f;
  --border:#303030;
  --text:rgba(255,255,255,.88);
  --text-sec:rgba(255,255,255,.45);
  --hover:rgba(255,255,255,.06);
  --sidebar-bg:#0d0d0d;
  --sidebar-text:rgba(255,255,255,.65);
  --sidebar-active:rgba(255,255,255,.08);
  --sidebar-hover-text:rgba(255,255,255,.85);
  --sidebar-section-color:rgba(255,255,255,.35);
  --sidebar-bottom-border:rgba(255,255,255,.07);
  --sidebar-toggle-bg:rgba(255,255,255,.06);
  --sidebar-toggle-border:rgba(255,255,255,.12);
  --sidebar-toggle-color:rgba(255,255,255,.55);
  --sidebar-toggle-hover-bg:rgba(255,255,255,.12);
  --sidebar-toggle-hover-color:rgba(255,255,255,.9);
  --sidebar-menu-bg:#0a2035;
  --sidebar-menu-border:rgba(255,255,255,.12);
  --sidebar-menu-shadow:0 -12px 32px rgba(0,0,0,.55);
  --sidebar-menu-header:rgba(255,255,255,.35);
  --sidebar-menu-text:rgba(255,255,255,.75);
  --sidebar-menu-hover:rgba(255,255,255,.1);
  --sidebar-menu-hover-text:#ffffff;
  --sidebar-menu-divider:rgba(255,255,255,.1);

      const id = Date.now() + Math.random();
      setItems(v => [...v, { id, msg }]);
      setTimeout(() => setItems(v => v.filter(x => x.id !== id)), 3400);
    };
    return () => { _toastFn = null; };
  }, []);
  return (
    <div className="toast-host">

// ─── STORE — one source of truth shared by every module, so an action in one place shows up everywhere ──

const StoreCtx = React.createContext(null);
const useStore = () => React.useContext(StoreCtx);

const StoreProvider = ({ route, go, children }) => {
  const [clients, setClients] = useState(CLIENTS_SEED);
  const [users, setUsers] = useState(USERS_SEED);
  const [projects, setProjects] = useState(PROJECTS_SEED);
  const [updates, setUpdates] = useState(PROJECT_UPDATES_SEED);
  const [milestones, setMilestones] = useState(MILESTONES_SEED);
  const [tasks, setTasks] = useState(TASKS_SEED);
  const [files, setFiles] = useState(FILES_SEED);
  const [threads, setThreads] = useState(THREADS_SEED);
  const [approvals, setApprovals] = useState(APPROVALS_SEED);
  const [changeRequests, setChangeRequests] = useState(CHANGE_REQUESTS_SEED);
  const [audit, setAudit] = useState(AUDIT_SEED);
  const [notifs, setNotifs] = useState(NOTIFS_SEED);
  const [settings, setSettings] = useState({ invoicesVisible:false, adminsInvite:false, adminsRemove:false });

  const log = (e) => setAudit(a => [{ id:uid('a'), ts:'Just now', actor:ME.short, side:'internal', ...e }, ...a]);
  const notify = (n) => setNotifs(list => [{ id:uid('n'), time:'Just now', unread:true, ...n }, ...list]);
  // Portal-wide switches that change what clients can do are permission changes, so they are audited (spec 18.2).
  const changeSetting = (key, value, label) => {
    setSettings(s => ({ ...s, [key]: value }));
    log({ type:'access', action:'Permission setting changed', target:`${label}: ${value ? 'On' : 'Off'}`, orgId:null });
  };

  const upd = (setter) => (id, patch) => setter(list => list.map(x => x.id===id ? { ...x, ...(typeof patch==='function' ? patch(x) : patch) } : x));
  const updateUser = upd(setUsers), updateProject = upd(setProjects), updateMilestone = upd(setMilestones), updateTask = upd(setTasks),
        updateFile = upd(setFiles), updateThread = upd(setThreads), updateApproval = upd(setApprovals), updateCR = upd(setChangeRequests);

  const orgOf = (id) => clients.find(c => c.id===id);
  const projectOf = (id) => projects.find(p => p.id===id);
  const usersOfOrg = (orgId) => users.filter(u => u.orgId===orgId);
  const orgStatus = (orgId) => {
    const us = usersOfOrg(orgId);
    if (us.some(u => u.status==='active')) return 'active';
    if (us.some(u => u.status==='invited')) return 'invited';
    if (us.length) return 'deactivated';
    return 'none';
  };
  const awaitingCount = (orgId) => approvals.filter(a => a.status==='awaiting' && (orgId==null || a.orgId===orgId)).length
    + changeRequests.filter(c => c.status==='more_info' && (orgId==null || c.orgId===orgId)).length;
  const unreadThreads = threads.filter(t => t.unread>0).length;
  const unreadNotifs = notifs.filter(n => n.unread).length;
  const reviewCRs = changeRequests.filter(c => c.status==='submitted' || c.status==='under_review').length;
  const awaitingApprovals = approvals.filter(a => a.status==='awaiting').length;

  // Visibility toggles share one audit message so Tasks / Files / Milestones behave identically.
  const setVisibility = (kind, id, visibility) => {
    const setters = { task:[tasks, updateTask, t=>t.title], file:[files, updateFile, f=>f.name], milestone:[milestones, updateMilestone, m=>m.name] };
    const [list, setter, label] = setters[kind];
    const item = list.find(x => x.id===id);
    if (!item || item.visibility===visibility) return;
    setter(id, { visibility });
    const proj = projectOf(item.projectId);
    log({ type:'visibility', action: visibility==='client' ? 'Entity made Client Visible' : 'Entity returned to Internal Only', target:`${kind[0].toUpperCase()+kind.slice(1)}: ${label(item)}`, orgId:proj ? proj.orgId : null });
    toast(visibility==='client' ? `“${label(item)}” is now visible to the client.` : `“${label(item)}” is Internal Only again. Client access was removed immediately.`);
  };

  const value = {
    route, go,
    clients, setClients, users, setUsers, projects, setProjects, updates, setUpdates, milestones, setMilestones, tasks, setTasks, files, setFiles,
    threads, setThreads, approvals, setApprovals, changeRequests, setChangeRequests, audit, notifs, setNotifs, settings, setSettings,
    log, notify, changeSetting, updateUser, updateProject, updateMilestone, updateTask, updateFile, updateThread, updateApproval, updateCR,
    orgOf, projectOf, usersOfOrg, orgStatus, awaitingCount, setVisibility,
    counts:{ unreadThreads, unreadNotifs, reviewCRs, awaitingApprovals },
  };
  return <StoreCtx.Provider value={value}>{children}</StoreCtx.Provider>;
};

// Row action menu. Rendered with position:fixed so tables inside overflow containers never clip it.
const RowMenu = ({ items, width=190 }) => {
  const [pos, setPos] = useState(null);
  const btn = useRef(null);
  useEffect(() => {
    if (!pos) return;
    const close = (e) => { if (!e.target.closest || !e.target.closest('.rowmenu-pop')) setPos(null); };
    const closeScroll = () => setPos(null);
    document.addEventListener('mousedown', close);
    window.addEventListener('scroll', closeScroll, true);
    return () => { document.removeEventListener('mousedown', close); window.removeEventListener('scroll', closeScroll, true); };
  }, [pos]);
  const visible = items.filter(i => !i.hidden);
  const toggle = () => {
    if (pos) { setPos(null); return; }
    const r = btn.current.getBoundingClientRect();
    const h = visible.length*34 + 12;
    const top = (r.bottom + h > window.innerHeight - 8) ? Math.max(8, r.top - h - 2) : r.bottom + 2;
    setPos({ top, left: Math.max(8, r.right - width) });
  };
  return (
    <div style={{ display:'inline-block' }} onClick={e=>e.stopPropagation()}>
      <button ref={btn} className="btn btn-default btn-sm" style={{ padding:'4px 9px', lineHeight:1 }} onClick={toggle}>⋮</button>
      {pos && (
        <div className="dropdown-menu rowmenu-pop" style={{ position:'fixed', top:pos.top, left:pos.left, right:'auto', minWidth:width }}>
          {visible.map((i,idx) => i.divider
            ? <div key={idx} className="dropdown-divider"/>
            : <div key={idx} className="dropdown-item" style={i.danger?{ color:'#ff4d4f' }:i.warn?{ color:'#d46b08' }:undefined} onClick={()=>{ setPos(null); i.onClick(); }}>{i.label}</div>)}
        </div>
      )}
    </div>
  );
};

// Pagination: 5/10/25 per page, resets to page 1 whenever the filters change (shared list pattern).
const usePaged = (list, deps, initialSize=10) => {
  const [page, setPage] = useState(1);
  const [pageSize, setPageSize] = useState(initialSize);
  useEffect(() => { setPage(1); }, [...deps, pageSize]);
  const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  const safe = Math.min(page, totalPages);
  const paged = list.slice((safe-1)*pageSize, safe*pageSize);
  const pager = list.length>0 ? (
    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10, padding:'10px 14px', borderTop:'1px solid var(--border)' }}>
      <div style={{ display:'flex', alignItems:'center', gap:10, fontSize:12, opacity:.6 }}>
        <span>Showing {(safe-1)*pageSize+1}–{Math.min(safe*pageSize, list.length)} of {list.length}</span>
        <select className="form-select" style={{ width:'auto' }} value={pageSize} onChange={e=>setPageSize(Number(e.target.value))}>
          <option value={5}>5 / page</option><option value={10}>10 / page</option><option value={25}>25 / page</option>
        </select>
      </div>
      <div style={{ display:'flex', gap:4 }}>
        <button className="btn btn-default btn-sm" disabled={safe===1} onClick={()=>setPage(p=>Math.max(1,p-1))}>‹ Prev</button>
        {Array.from({ length: totalPages }, (_,i) => i+1).map(n => (
          <button key={n} className={`btn btn-sm ${n===safe ? 'btn-primary' : 'btn-default'}`} onClick={()=>setPage(n)}>{n}</button>
        ))}
        <button className="btn btn-default btn-sm" disabled={safe===totalPages} onClick={()=>setPage(p=>Math.min(totalPages,p+1))}>Next ›</button>
      </div>
    </div>
  ) : null;
  return { paged, pager };
};

const PortalSwitch = ({ project }) => {
  const { updateProject, log, users } = useStore();
  const [confirm, setConfirm] = useState(false);
  const live = users.filter(u => u.status==='active' && u.projects.includes(project.id)).length;
  const turn = (on) => {
    if (!on) { setConfirm(true); return; }
    updateProject(project.id, { portalEnabled:true });
    log({ type:'access', action:'Project portal enabled', target:project.name, orgId:project.orgId });
    toast(`Client Portal is on for ${project.name}. Assigned users can see client-visible items only.`);
  };
  // A project must belong to a client organization before it can be shared.
  if (!project.orgId) return <Switch on={false} disabled title="Link this project to a client first" onChange={()=>{}} />;
  return (
    <>
      <Switch on={project.portalEnabled} onChange={turn} title={project.portalEnabled ? 'Portal on' : 'Portal off'} />
      <Confirm open={confirm} danger title="Turn the Client Portal off for this project?" confirmLabel="Turn off portal" onClose={()=>setConfirm(false)}
        onConfirm={()=>{
          updateProject(project.id, { portalEnabled:false });
          log({ type:'access', action:'Project portal disabled', target:project.name, orgId:project.orgId });
          toast(`Client access to ${project.name} was revoked immediately.`);
        }}>
        <b>{project.name}</b> disappears from the portal for {live} active client user{live===1?'':'s'}. Open pages stop loading on their next request. Nothing is deleted, and you can turn it back on at any time.
      </Confirm>
    </>
  );
};

const useUserActions = () => {
  const { users, setUsers, updateUser, clients, log, notify } = useStore();
  const [assignId, setAssignId] = useState(null);
  const [editId, setEditId] = useState(null);
  const [viewId, setViewId] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const orgName = (u) => (clients.find(c => c.id===u.orgId)||{}).name || '—';

  const actions = {
    onView:(u)=>setViewId(u.id), onEdit:(u)=>setEditId(u.id), onAssign:(u)=>setAssignId(u.id),
    // Prototype helpers: stand in for the client opening their invitation (spec 16.1). They are not product actions.
    onSimActivate:(u)=>{
      updateUser(u.id, { status:'active', inviteExpired:false, requestedNew:false, invitedAgo:undefined, lastAccess:'Just now' });
      // Every client user confirms the invited email with a one-time code before the account is activated.
      log({ actor:u.name, side:'client', type:'access', action:'Client email verified', target:`${u.name} · ${u.email}`, orgId:u.orgId });
      log({ actor:u.name, side:'client', type:'access', action:'Client activated', target:`${u.name} · ${orgName(u)}`, orgId:u.orgId });
      notify({ type:'Access', title:`${u.name} verified their email and activated their account`, body:`${orgName(u)} · ${ROLES[u.role].label}`, route:{ key:'clients', params:{ id:u.orgId, tab:'users' } } });
      toast(`${u.name} accepted the invitation, confirmed ${u.email} with a one-time code, and is now Active. They see only the projects assigned to them.`);
    },
    onSimRequestLink:(u)=>{
      updateUser(u.id, { requestedNew:true });
      notify({ type:'Access', title:`${u.name} asked for a new invitation`, body:`The invitation link expired. Resend it from Users & Access.`, route:{ key:'clients', params:{ id:u.orgId, tab:'users' } } });
      toast(`${u.name} asked for a new link from the expired-invitation screen. Resend it to let them in.`);
    },
    onResend:(u)=>{
      updateUser(u.id, { status:'invited', inviteExpired:false, requestedNew:false, invitedAgo:'Invited just now' });
      log({ type:'access', action:'Invitation resent', target:`${u.name} · ${orgName(u)}`, orgId:u.orgId });
      toast(`Invitation resent to ${u.email}. The link is valid for 7 days.`);
    },
    onDeactivate:(u)=>setConfirm({ kind:'deactivate', u }),
    onReactivate:(u)=>{
      updateUser(u.id, { status:u.priorStatus || 'invited', priorStatus:undefined });
      log({ type:'access', action:'Client activated', target:`${u.name} · ${orgName(u)}`, orgId:u.orgId });
      toast(`${u.name} can sign in again. Their previous status was restored.`);
    },
    onRemove:(u)=>setConfirm({ kind:'remove', u }),
  };

  const editUser = users.find(u => u.id===editId);
  const modals = (
    <>
      <EditUserModal open={!!editUser} user={editUser} orgName={editUser ? orgName(editUser) : ''} onClose={()=>setEditId(null)} />
      <AssignProjectsModal open={!!assignId} user={users.find(u => u.id===assignId)} onClose={()=>setAssignId(null)} />
      <UserProfileModal open={!!viewId} user={users.find(u => u.id===viewId)} orgName={users.find(u => u.id===viewId) ? orgName(users.find(u => u.id===viewId)) : ''} onClose={()=>setViewId(null)} />
      <Confirm open={!!confirm && confirm.kind==='deactivate'} danger title="Deactivate this client user?" confirmLabel="Deactivate" onClose={()=>setConfirm(null)}
        onConfirm={()=>{
          const u = confirm.u;
          updateUser(u.id, { priorStatus:u.status, status:'deactivated' });
          log({ type:'access', action:'Client deactivated', target:`${u.name} · ${orgName(u)}`, orgId:u.orgId });
          toast(`${u.name} was deactivated. Portal and API access is revoked immediately.`);
        }}>
        {confirm && <><b>{confirm.u.name}</b> loses access right away. If they have a session open, their next request fails and they are signed out. You can reactivate them later and their previous status is restored.</>}
      </Confirm>
      <Confirm open={!!confirm && confirm.kind==='remove'} danger title="Remove this client user?" confirmLabel="Remove user" onClose={()=>setConfirm(null)}
        onConfirm={()=>{
          const u = confirm.u;
          setUsers(list => list.filter(x => x.id!==u.id));
          log({ type:'access', action:'Client removed', target:`${u.name} · ${orgName(u)}`, orgId:u.orgId });
          toast(`${u.name} was removed from the portal.`);
        }}>
        {confirm && <><b>{confirm.u.name}</b> and their project assignments are removed. Comments and approvals they made stay in the history.</>}
      </Confirm>
    </>
  );
  return { actions, modals };
};

          <tbody>
            {paged.map(u => {
              const org = clients.find(c => c.id===u.orgId);

              return (
                <tr key={u.id} style={{ opacity:u.status==='deactivated' ? .6 : 1 }}>

                  <td><RoleTag role={u.role}/></td>

                      {u.status==='invited' && <button className="btn btn-default btn-sm" onClick={()=>actions.onResend(u)}>Resend</button>}
                      <RowMenu items={[
                        { label:'View profile', onClick:()=>actions.onView(u) },
                        { label:'Edit user & role', onClick:()=>actions.onEdit(u) },
                        { label:'Assign projects', onClick:()=>actions.onAssign(u) },
                        { label:'Resend invitation', hidden:u.status!=='invited', onClick:()=>actions.onResend(u) },
                        { label:'Prototype helper: client verifies email and activates', hidden:!(u.status==='invited' && !u.inviteExpired), onClick:()=>actions.onSimActivate(u) },
                        { label:'Prototype helper: client asks for a new link', hidden:!(u.status==='invited' && u.inviteExpired && !u.requestedNew), onClick:()=>actions.onSimRequestLink(u) },
                        { divider:true },
                        u.status==='deactivated'
                          ? { label:'Reactivate user', onClick:()=>actions.onReactivate(u) }
                          : { label:'Deactivate user', warn:true, onClick:()=>actions.onDeactivate(u) },
                        { label:'Remove user', danger:true, onClick:()=>actions.onRemove(u) },
                      ]}/>
                    </div>
                  </td>
                </tr>
              );
            })}
            {list.length===0 && <tr><td colSpan={showOrg?7:6} style={{ textAlign:'center', padding:30, opacity:.4 }}>No client users match.</td></tr>}
          </tbody>
        </table>
      </div>
      {pager}
    </div>
  );
};

const EditUserModal = ({ open, user, orgName, onClose }) => {
  const { updateUser, log } = useStore();
  const [f, setF] = useState({ name:'', email:'', phone:'', jobTitle:'', role:'member' });

const AssignProjectsModal = ({ open, user, onClose }) => {
  const { projects, updateUser, log, clients } = useStore();
  const [sel, setSel] = useState([]);
  useEffect(() => { if (open && user) setSel(user.projects); }, [open, user && user.id]);
  if (!open || !user) return null;
  const orgProjects = projects.filter(p => p.orgId===user.orgId);
  const org = clients.find(c => c.id===user.orgId);
  const toggle = (id) => setSel(s => s.includes(id) ? s.filter(x => x!==id) : [...s, id]);
  const save = () => {
    const added = sel.filter(id => !user.projects.includes(id)), removed = user.projects.filter(id => !sel.includes(id));
    updateUser(user.id, { projects:sel });
    added.forEach(id => log({ type:'access', action:'Project access assigned', target:`${user.name} · ${projects.find(p => p.id===id).name}`, orgId:user.orgId }));
    removed.forEach(id => log({ type:'access', action:'Project access removed', target:`${user.name} · ${(projects.find(p => p.id===id)||{}).name}`, orgId:user.orgId }));
    toast(removed.length ? `Project access updated for ${user.name}. Removed access applies immediately.` : `Project access updated for ${user.name}.`);
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} width={520} title={`Assign projects · ${user.name}`}
      footer={<><button className="btn btn-default" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={save}>Save</button></>}>
      <p style={{ fontSize:12.5, opacity:.6, marginTop:0 }}>A user only ever sees projects assigned here, even though they belong to {org ? org.name : 'the organization'}. What they can do inside each project depends on their role: <RoleTag role={user.role}/></p>

        <label key={p.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'10px 12px', border:'1px solid var(--border)', borderRadius:8, marginBottom:8, cursor:p.portalEnabled?'pointer':'not-allowed', opacity:p.portalEnabled?1:.55 }}>

          <ProjectStatusTag s={p.status}/>

// ─── ADD CLIENT WIZARD — two paths, one shared ending ─────────────────────────

const WIZARD_METHODS = [
  { key:'org', icon:'building', name:'New client organization', desc:'Create the organization and invite its first user as Client Admin.' },
  { key:'user', icon:'user', name:'Add a user to an existing organization', desc:'Invite another person to an organization that already has portal access.' },
];

const AddClientWizard = ({ open, onClose, initialMethod }) => {
  const { clients, setClients, setUsers, projects, updateProject, log } = useStore();
  const [step, setStep] = useState(1);
  const [method, setMethod] = useState(null);
  const [orgId, setOrgId] = useState('');
  const [f, setF] = useState({ org:'', first:'', last:'', email:'', phone:'', jobTitle:'', role:'member' });
  const [sel, setSel] = useState([]);
  const [send, setSend] = useState(true);

  const reset = () => { setStep(1); setMethod(null); setOrgId(''); setF({ org:'', first:'', last:'', email:'', phone:'', jobTitle:'', role:'member' }); setSel([]); setSend(true); };
  const close = () => { reset(); onClose(); };
  useEffect(() => { if (open && initialMethod) { setMethod(initialMethod); setStep(2); } }, [open, initialMethod]);

  const role = method==='org' ? 'admin' : f.role;
  // Existing organization: its projects (portal off ones are switched on if picked). New organization: workspace projects with no client yet.
  const orgProjects = method==='user' ? (orgId ? projects.filter(p => p.orgId===Number(orgId)) : []) : projects.filter(p => !p.orgId);
  const canContinue = step===1 ? !!method
    : step===2 ? (method==='org' ? (f.org.trim() && f.first.trim() && f.email.trim()) : (orgId && f.first.trim() && f.email.trim()))
    : true;

  const next = () => {
    if (!canContinue) { toast('Fill in the required fields to continue.'); return; }
    if (step<3) { setStep(step+1); return; }
    let targetOrg = Number(orgId);
    if (method==='org') {
      targetOrg = Math.max(0, ...clients.map(c => c.id)) + 1;
      const palette = ['#1677ff','#52c41a','#faad14','#ff4d4f','#722ed1','#13c2c2'];
      setClients(list => [...list, { id:targetOrg, name:f.org.trim(), initials:initialsFromName(f.org), color:palette[targetOrg % palette.length], email:f.email.trim(), poc:`${f.first} ${f.last}`.trim(), phone:f.phone.trim(), company:f.org.trim(), balance:0 }]);
    }
    const name = `${f.first} ${f.last}`.trim();
    setUsers(list => [...list, { id:Math.max(0, ...list.map(u => u.id)) + 1, orgId:targetOrg, name, email:f.email.trim(), phone:f.phone.trim(), jobTitle:f.jobTitle.trim(), initials:initialsFromName(name), color:'#1677ff', role,
      status:'invited', invitedAgo: send ? 'Invited just now' : 'Invite not sent yet', inviteExpired:false, lastAccess:'Never', projects: sel }]);
    const orgLabel = method==='org' ? f.org.trim() : (clients.find(c => c.id===targetOrg)||{}).name;
    log({ type:'access', action:'Client invited', target:`${name} · ${orgLabel} · ${ROLES[role].label}`, orgId:targetOrg });
    // Selecting a project links it to the client if it had none and switches its portal on, so onboarding is one flow (spec 21, step 1).
    sel.forEach(id => {
      const p = projects.find(x => x.id===id); if (!p) return;
      const patch = {};
      if (!p.orgId) { patch.orgId = targetOrg; log({ type:'access', action:'Project linked to client', target:`${p.name} · ${orgLabel}`, orgId:targetOrg }); }
      if (!p.portalEnabled) { patch.portalEnabled = true; log({ type:'access', action:'Project portal enabled', target:p.name, orgId:targetOrg }); }
      if (Object.keys(patch).length) updateProject(id, patch);
      log({ type:'access', action:'Project access assigned', target:`${name} · ${p.name}`, orgId:targetOrg });
    });
    const turnedOn = sel.filter(id => { const p = projects.find(x => x.id===id); return p && !p.portalEnabled; }).length;
    toast(send ? `Invitation sent to ${f.email.trim()} as ${ROLES[role].label}.${turnedOn ? ` Client Portal switched on for ${turnedOn} project${turnedOn>1?'s':''}.` : ''} They activate their account from the email link and confirm their email with a one-time code.` :`${name} was added as ${ROLES[role].label}. No invitation was sent yet.`);
    close();
  };

  const title = step===1 ? 'How do you want to add this client?' : step===2 ? (method==='org' ? 'Tell us about the organization' : 'Choose the organization and the user') : 'Access & review';

  return (
    <Modal open={open} onClose={close} width={560} title={title}
      footer={<>
        <button className="btn btn-default" onClick={()=> step===1 ? close() : setStep(step-1)}>{step===1?'Cancel':'Back'}</button>
        <button className="btn btn-primary" onClick={next}>{step===3 ? (send ? 'Send invitation' : 'Add user') : 'Continue'}</button>
      </>}>
      <div className="wiz-steps"><i className={step>1?'done':'active'}></i><i className={step>2?'done':step===2?'active':''}></i><i className={step===3?'active':''}></i></div>

      {step===1 && (
        <div>
          <p style={{ fontSize:12.5, opacity:.6, marginBottom:14 }}>Every client user belongs to an organization, and sees only the projects you assign to them.</p>
          {WIZARD_METHODS.map(m => (
            <div key={m.key} className={`wiz-method${method===m.key?' active':''}`} onClick={()=>{ setMethod(m.key); setSel([]); }}>
              <span className="wiz-method-icon"><SvgIcon name={m.icon} size={17}/></span>
              <div><div style={{ fontWeight:600, fontSize:13.5 }}>{m.name}</div><div style={{ fontSize:12, opacity:.6 }}>{m.desc}</div></div>
            </div>
          ))}
        </div>
      )}

      {step===2 && (
        <div>
          {method==='org'
            ? <Field label="Organization name"><input className="form-input" value={f.org} onChange={e=>setF({ ...f, org:e.target.value })} placeholder="e.g. Beacon Logistics"/></Field>
            : <Field label="Organization">
                <select className="form-select" value={orgId} onChange={e=>{ setOrgId(e.target.value); setSel([]); }}>
                  <option value="">Select an organization…</option>
                  {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </Field>}
          <div className="form-row">
            <Field label="First name"><input className="form-input" value={f.first} onChange={e=>setF({ ...f, first:e.target.value })} placeholder="Jane"/></Field>
            <Field label="Last name"><input className="form-input" value={f.last} onChange={e=>setF({ ...f, last:e.target.value })} placeholder="Doe"/></Field>
          </div>
          <Field label="Email address (required)" hint="This is the login and invitation address. It must be unique."><input className="form-input" value={f.email} onChange={e=>setF({ ...f, email:e.target.value })} placeholder="jane@company.com"/></Field>
          <div className="form-row">
            <Field label="Job title"><input className="form-input" value={f.jobTitle} onChange={e=>setF({ ...f, jobTitle:e.target.value })} placeholder="e.g. Marketing Manager"/></Field>
            <Field label="Phone (optional)"><input className="form-input" value={f.phone} onChange={e=>setF({ ...f, phone:e.target.value })} placeholder="+1 415 555 0142"/></Field>
          </div>
          {method==='org'
            ? <Banner kind="info" icon="shield">The first user of a new organization is a <b>Client Admin</b>. They can approve items and, if you enable it in Portal Settings, manage their own colleagues. Like every client user, they confirm their email with a one-time code when they activate.</Banner>
            : <><div className="form-label">ROLE</div><RoleCards value={f.role} onChange={r=>setF({ ...f, role:r })}/></>}
        </div>
      )}

      {step===3 && (
        <div>
          <div style={{ marginBottom:14 }}>
            <div className="form-label">PROJECT ACCESS</div>
            <p style={{ fontSize:12, opacity:.6, margin:'0 0 8px' }}>{method==='org'
              ? 'Pick the projects this client should see. Projects without a client are linked to the new organization, and the Client Portal is switched on for each one you pick.'
              : 'Pick the projects this user can open. If the Client Portal is off for a project you pick, it is switched on.'}</p>
            {orgProjects.map(p => (
              <label key={p.id} style={{ display:'flex', alignItems:'center', gap:10, padding:'9px 12px', border:'1px solid var(--border)', borderRadius:8, marginBottom:6, cursor:'pointer' }}>
                <input type="checkbox" checked={sel.includes(p.id)} onChange={()=>setSel(s => s.includes(p.id) ? s.filter(x => x!==p.id) : [...s, p.id])} style={{ accentColor:'#1677ff' }}/>
                <span style={{ flex:1, fontSize:13, fontWeight:600 }}>{p.name}
                  {!p.orgId && <span className="tag tag-blue" style={{ marginLeft:8 }}>No client yet</span>}
                  {!p.portalEnabled && <span className="tag tag-gray" style={{ marginLeft:6 }}>Portal off, will be switched on</span>}
                </span><ProjectStatusTag s={p.status}/>
              </label>
            ))}
            {orgProjects.length===0 && <p style={{ fontSize:12.5, opacity:.55, margin:0 }}>{method==='org' ? 'Every workspace project already has a client. Link one later from Portal Projects.' : 'This organization has no projects yet. The user can be assigned projects later.'}</p>}
          </div>
          <div className="card card-sm" style={{ marginBottom:14 }}>
            <KV rows={[
              ['Organization', method==='org' ? f.org || '—' : (clients.find(c => c.id===Number(orgId))||{}).name || '—'],
              ['Name', `${f.first} ${f.last}`.trim() || '—'], ['Email', f.email || '—'], ['Role', ROLES[role].label],
              ['Projects', sel.length ? `${sel.length} assigned` : 'None yet'],
            ]}/>
          </div>
          <label style={{ display:'flex', gap:10, alignItems:'flex-start', padding:'10px 12px', border:'1px solid var(--border)', borderRadius:8, cursor:'pointer' }}>
            <input type="checkbox" checked={send} onChange={()=>setSend(v=>!v)} style={{ marginTop:2, accentColor:'#1677ff' }}/>
            <span><div style={{ fontWeight:600, fontSize:13 }}>Send the invitation now</div><div style={{ fontSize:11.5, opacity:.55 }}>The link expires after 7 days. If it expires, resend it from the Users list. The user confirms their email with a one-time code when they activate.</div></span>
          </label>
        </div>
      )}
    </Modal>
  );
};

                  <thead><tr><th>Invoice</th><th>Amount</th><th>Status</th><th>Due</th></tr></thead>
                  <tbody>

                      <tr key={i.id}><td style={{ color:'#1677ff', fontWeight:600 }}>{i.id}</td><td style={{ fontWeight:600 }}>${i.amount.toLocaleString()}</td><td><StatusTag s={i.status}/></td><td style={{ fontSize:12, opacity:.65 }}>{i.due}</td></tr>

// ─── CLIENTS (list) ────────────────────────────────────────────────────────────

const ClientsHome = () => {
  const { clients, users, projects, route, go, orgStatus, awaitingCount } = useStore();
  const [openId, setOpenId] = useState(null);
  const [wsTab, setWsTab] = useState(null);
  const [homeTab, setHomeTab] = useState('orgs');
  const [query, setQuery] = useState('');
  const [roleFilter, setRoleFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('all');
  const [showWizard, setShowWizard] = useState(false);
  const { actions, modals } = useUserActions();

  useEffect(() => {
    if (route.key!=='clients') return;
    if (route.params.id) { setOpenId(route.params.id); setWsTab(route.params.tab || null); }
    else if (route.params.add) setShowWizard(true);
    else setOpenId(null);
  }, [route.n]);

  const orgRows = clients.filter(c => !query || c.name.toLowerCase().includes(query.toLowerCase()));
  const userRows = users.filter(u => {
    const q = query.toLowerCase();
    const org = clients.find(c => c.id===u.orgId);
    return (!q || u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q) || (org && org.name.toLowerCase().includes(q)))
      && (roleFilter==='all' || u.role===roleFilter)
      && (statusFilter==='all' || (statusFilter==='expired' ? (u.status==='invited' && u.inviteExpired) : u.status===statusFilter));
  });
  const { paged: pagedOrgs, pager: orgPager } = usePaged(orgRows, [query, homeTab], 10);

  if (openId) {
    const c = clients.find(x => x.id===openId);
    if (c) return <ClientWorkspace key={openId+(wsTab||'')} client={c} initialTab={wsTab} onBack={()=>setOpenId(null)} />;
  }

  const active = users.filter(u => u.status==='active').length;
  const invited = users.filter(u => u.status==='invited').length;
  const deactivated = users.filter(u => u.status==='deactivated').length;

  return (
    <div>
      <PageHeader title="Clients" sub="Client organizations, the people who can sign in to their portal, and what each of them is waiting on.">
        <button className="btn btn-primary btn-sm" onClick={()=>setShowWizard(true)}>+ Add Client</button>
      </PageHeader>

      <div className="section-tabs">
        <button className={`section-tab${homeTab==='orgs'?' active':''}`} onClick={()=>setHomeTab('orgs')}>Organizations<TabCount n={clients.length}/></button>
        <button className={`section-tab${homeTab==='users'?' active':''}`} onClick={()=>setHomeTab('users')}>Client Users<TabCount n={users.length}/></button>
      </div>

      <div className="grid-stat-4">
        <Stat label="Client organizations" value={clients.length}/>
        <Stat label="Active users" value={active} color="#52c41a"/>
        <Stat label="Invited" value={invited} color="#faad14" sub={`${users.filter(u => u.status==='invited' && u.inviteExpired).length} expired`}/>
        <Stat label="Awaiting client action" value={awaitingCount()} color="#d46b08" sub="Approvals and info requests"/>
      </div>

      <div style={{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap', alignItems:'center' }}>
        <input className="form-input" style={{ maxWidth:300 }} placeholder={homeTab==='orgs' ? 'Search organizations…' : 'Search users, emails or organizations…'} value={query} onChange={e=>setQuery(e.target.value)}/>
        {homeTab==='users' && <>
          <select className="form-select" style={{ width:'auto' }} value={roleFilter} onChange={e=>setRoleFilter(e.target.value)}>
            <option value="all">All roles</option>{ROLE_ORDER.map(k => <option key={k} value={k}>{ROLES[k].label}</option>)}
          </select>
          <select className="form-select" style={{ width:'auto' }} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
            <option value="all">All statuses</option><option value="active">Active</option><option value="invited">Invited</option><option value="expired">Invite expired</option><option value="deactivated">Deactivated</option>
          </select>
        </>}
      </div>

      {homeTab==='orgs' && (
        <div className="card" style={{ padding:0 }}>
          <div style={{ overflowX:'auto' }}>
            <table className="wl-table">
              <thead><tr><th>Client</th><th>Primary contact</th><th>Portal access</th><th>Users</th><th>Portal projects</th><th>Awaiting client</th><th>Actions</th></tr></thead>
              <tbody>
                {pagedOrgs.map(c => {
                  const us = users.filter(u => u.orgId===c.id);
                  const wait = awaitingCount(c.id);
                  return (
                    <tr key={c.id} style={{ cursor:'pointer' }} onClick={()=>{ setWsTab(null); setOpenId(c.id); }}>
                      <td><div style={{ display:'flex', alignItems:'center', gap:10 }}><Av initials={c.initials} color={c.color} size={36}/><span style={{ fontWeight:600, fontSize:13 }}>{c.name}</span></div></td>
                      <td style={{ fontSize:12.5 }}>{c.poc}<div style={{ fontSize:11.5, opacity:.5 }}>{c.email}</div></td>
                      <td><OrgStatusTag s={orgStatus(c.id)}/></td>
                      <td style={{ fontSize:12.5 }}>{us.filter(u => u.status==='active').length} active · {us.length} total</td>
                      <td style={{ fontWeight:600 }}>{projects.filter(p => p.orgId===c.id && p.portalEnabled).length}</td>
                      <td>{wait>0 ? <span className="tag tag-orange">{wait} waiting</span> : <span style={{ opacity:.4 }}>—</span>}</td>
                      <td onClick={e=>e.stopPropagation()}>
                        <RowMenu items={[
                          { label:'Open workspace', onClick:()=>{ setWsTab(null); setOpenId(c.id); } },
                          { label:'Manage users & access', onClick:()=>{ setWsTab('users'); setOpenId(c.id); } },
                          { label:'Manage projects', onClick:()=>{ setWsTab('projects'); setOpenId(c.id); } },
                          { label:'Request approval', onClick:()=>go('approvals', { newFor:c.id }) },
                        ]}/>
                      </td>
                    </tr>
                  );
                })}
                {orgRows.length===0 && <tr><td colSpan="7" style={{ textAlign:'center', padding:30, opacity:.4 }}>No clients match this search.</td></tr>}
              </tbody>
            </table>
          </div>
          {orgPager}
        </div>
      )}

      {homeTab==='users' && <ClientUsersTable list={userRows} showOrg actions={actions} onOpenOrg={(id)=>{ setWsTab(null); setOpenId(id); }}/>}

      <AddClientWizard open={showWizard} onClose={()=>setShowWizard(false)} />
      {modals}
    </div>
  );
};

// ─── PORTAL PROJECTS — what is shared with each client, project by project ─────
// In the real product these controls live inside the existing WorkLenz project, task and file screens
// (spec 17, "Internal Visibility Controls"). The prototype gathers them in one workspace so they can be demoed together.

const nextMilestone = (milestones, projectId, clientOnly=true) => milestones
  .filter(m => m.projectId===projectId && m.status!=='completed' && (!clientOnly || m.visibility==='client'))
  .sort((a,b) => a.target.localeCompare(b.target))[0];

const PortalProjects = () => {
  const { projects, clients, users, milestones, approvals, changeRequests, route, go } = useStore();
  const [openId, setOpenId] = useState(null);
  const [tab, setTab] = useState(null);
  const [query, setQuery] = useState('');
  const [orgFilter, setOrgFilter] = useState('all');
  const [portalFilter, setPortalFilter] = useState('all');

  useEffect(() => {
    if (route.key!=='projects') return;
    if (route.params.id) { setOpenId(route.params.id); setTab(route.params.tab || null); } else setOpenId(null);
  }, [route.n]);

  const rows = projects.filter(p => (!query || p.name.toLowerCase().includes(query.toLowerCase()))
    && (orgFilter==='all' || p.orgId===Number(orgFilter))
    && (portalFilter==='all' || (portalFilter==='on') === p.portalEnabled));
  const { paged, pager } = usePaged(rows, [query, orgFilter, portalFilter], 10);

  const project = projects.find(p => p.id===openId);
  if (project) return <ProjectWorkspace key={project.id+(tab||'')} project={project} initialTab={tab} onBack={()=>setOpenId(null)} />;
  const enabled = projects.filter(p => p.portalEnabled);

  return (
    <div>
      <PageHeader title="Portal Projects" sub="Choose which projects are visible in the Client Portal and what is shared inside each one. Everything starts as Internal Only."/>
      <div className="grid-stat-4">
        <Stat label="Portal-enabled projects" value={`${enabled.length} / ${projects.length}`}/>
        <Stat label="Awaiting client approval" value={approvals.filter(a => a.status==='awaiting').length} color="#d46b08"/>
        <Stat label="Open change requests" value={changeRequests.filter(c => !['completed','rejected','cancelled'].includes(c.status)).length}/>
        <Stat label="Delayed milestones" value={milestones.filter(m => m.status==='delayed' && projects.find(p => p.id===m.projectId && p.portalEnabled)).length} color="#faad14" sub="On portal projects"/>
      </div>
      <div style={{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap' }}>
        <input className="form-input" style={{ maxWidth:280 }} placeholder="Search projects…" value={query} onChange={e=>setQuery(e.target.value)}/>
        <select className="form-select" style={{ width:'auto' }} value={orgFilter} onChange={e=>setOrgFilter(e.target.value)}>
          <option value="all">All clients</option>{clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
        <select className="form-select" style={{ width:'auto' }} value={portalFilter} onChange={e=>setPortalFilter(e.target.value)}>
          <option value="all">Portal on or off</option><option value="on">Portal on</option><option value="off">Portal off</option>
        </select>
      </div>
      <div className="card" style={{ padding:0 }}>
        <div style={{ overflowX:'auto' }}>
          <table className="wl-table">
            <thead><tr><th>Project</th><th>Client-facing status</th><th>Phase</th><th>Progress</th><th>Next milestone</th><th>Client users</th><th>Portal</th><th></th></tr></thead>
            <tbody>
              {paged.map(p => {
                const org = clients.find(c => c.id===p.orgId);
                const nm = nextMilestone(milestones, p.id);
                return (
                  <tr key={p.id} style={{ cursor:'pointer' }} onClick={()=>{ setTab(null); setOpenId(p.id); }}>
                    <td><div style={{ fontWeight:600, fontSize:13 }}>{p.name}</div><div style={{ fontSize:11.5, opacity:.55 }}>{org ? org.name : 'No client'}</div></td>
                    <td><ProjectStatusTag s={p.status}/></td>
                    <td style={{ fontSize:12.5 }}>{p.phase}</td>
                    <td><Progress value={p.progress} color={p.color}/></td>
                    <td style={{ fontSize:12.5 }}>{nm ? <>{nm.name}<div style={{ fontSize:11.5, opacity:.5 }}>{fmtDate(nm.target)}</div></> : <span style={{ opacity:.4 }}>—</span>}</td>
                    <td style={{ fontSize:12.5 }}>{users.filter(u => u.status==='active' && u.projects.includes(p.id)).length} active</td>
                    <td onClick={e=>e.stopPropagation()}><PortalSwitch project={p}/></td>
                    <td onClick={e=>e.stopPropagation()}><button className="btn btn-default btn-sm" onClick={()=>{ setTab(null); setOpenId(p.id); }}>Manage</button></td>
                  </tr>
                );
              })}
              {rows.length===0 && <tr><td colSpan="8" style={{ textAlign:'center', padding:30, opacity:.4 }}>No projects match.</td></tr>}
            </tbody>
          </table>
        </div>
        {pager}
      </div>
    </div>
  );
};

const P_TABS = [
  { key:'overview', label:'Overview' }, { key:'milestones', label:'Milestones' }, { key:'tasks', label:'Tasks' },
  { key:'files', label:'Files' }, { key:'discussions', label:'Discussions' }, { key:'access', label:'Client Access' },
];

const ProjectWorkspace = ({ project, initialTab, onBack }) => {
  const { clients, tasks, milestones, files, threads, users, go } = useStore();
  const [tab, setTab] = useState(initialTab || 'overview');
  const org = clients.find(c => c.id===project.orgId);
  const counts = {
    milestones:milestones.filter(m => m.projectId===project.id).length,
    tasks:tasks.filter(t => t.projectId===project.id && t.visibility==='client').length,
    files:files.filter(f => f.projectId===project.id && f.visibility==='client').length,
    discussions:threads.filter(t => t.projectId===project.id && t.unread>0).length,
  };
  return (
    <div>
      <div style={{ display:'flex', alignItems:'center', gap:14, marginBottom:18, flexWrap:'wrap' }}>
        <button className="btn btn-default btn-sm" onClick={onBack}>← Portal Projects</button>
        <div style={{ flex:1, minWidth:220 }}>
          <div style={{ fontWeight:700, fontSize:17 }}>{project.name}</div>
          <div style={{ fontSize:12, opacity:.55 }}>{org ? org.name : 'No client assigned'} · {project.phase} · <ProjectStatusTag s={project.status}/></div>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:12.5 }}><span style={{ opacity:.6 }}>Client Portal</span><PortalSwitch project={project}/></div>
        <button className="btn btn-default btn-sm" onClick={()=>go('portal', { projectId:project.id })}><SvgIcon name="eye" size={13}/> Preview as client</button>
      </div>
      {!project.orgId && <Banner kind="warn" icon="briefcase">This project has no client yet. Link it to a client on the Client Access tab, or pick it when you add a client. Then the Client Portal can be switched on.</Banner>}
      {!project.portalEnabled && project.orgId && <Banner kind="warn" icon="lock">The Client Portal is off for this project. Clients cannot see anything here, even items marked Client Visible. Turn it on to share.</Banner>}
      <div className="section-tabs" style={{ flexWrap:'wrap' }}>
        {P_TABS.map(t => (

          </button>
        ))}
      </div>
      {tab==='overview' && <ProjectOverviewTab project={project}/>}
      {tab==='milestones' && <MilestonesTab project={project}/>}
      {tab==='tasks' && <TasksTab project={project}/>}

};

const ProjectOverviewTab = ({ project }) => {
  const { updateProject, updates, setUpdates, notify, log } = useStore();
  const [f, setF] = useState({ status:project.status, phase:project.phase, progressSource:project.progressSource, progress:project.progress, start:project.start||'', due:project.due||'', contactId:project.contactId, summary:project.summary, allowUploads:project.allowUploads });
  const [post, setPost] = useState('');
  const [notes, setNotes] = useState(project.internalNotes);
  const mine = updates.filter(u => u.projectId===project.id).sort((a,b) => b.date.localeCompare(a.date));
  const worklenzProgress = { 1:54, 2:72, 4:38, 5:81, 6:91, 7:12, 8:30 }[project.id] ?? project.progress;
  const dirty = JSON.stringify(f) !== JSON.stringify({ status:project.status, phase:project.phase, progressSource:project.progressSource, progress:project.progress, start:project.start||'', due:project.due||'', contactId:project.contactId, summary:project.summary, allowUploads:project.allowUploads });

  const save = () => {
    updateProject(project.id, { status:f.status, phase:f.phase, progressSource:f.progressSource, progress: f.progressSource==='worklenz' ? worklenzProgress : Math.max(0, Math.min(100, Number(f.progress)||0)), start:f.start||null, due:f.due||null, contactId:f.contactId, summary:f.summary, allowUploads:f.allowUploads });
    toast('Client-facing project information saved. Clients see it on their next page load.');
  };
  const publish = () => {
    if (!post.trim()) return;
    setUpdates(list => [{ id:uid('u'), projectId:project.id, authorId:ME.id, date:TODAY, text:post.trim() }, ...list]);
    notify({ type:'Project', title:`Update published on ${project.name}`, body:post.trim().slice(0,80), route:{ key:'projects', params:{ id:project.id } }, unread:false });
    setPost('');
    toast('Update published. Client users are notified in the portal and by email.');
  };

  return (
    <div style={{ display:'flex', gap:20, alignItems:'flex-start', flexWrap:'wrap' }}>
      <div style={{ flex:'3 1 440px', minWidth:0 }}>
        <div className="card">
          <div className="card-header"><span className="card-title">Client-facing project information</span><span className="tag tag-green"><SvgIcon name="eye" size={11}/>&nbsp;Shown to the client</span></div>
          <div className="form-row">
            <Field label="Status"><select className="form-select" value={f.status} onChange={e=>setF({ ...f, status:e.target.value })}>{Object.keys(PROJECT_STATUS).map(k => <option key={k} value={k}>{PROJECT_STATUS[k].label}</option>)}</select></Field>
            <Field label="Current phase"><select className="form-select" value={f.phase} onChange={e=>setF({ ...f, phase:e.target.value })}>{PHASES.map(p => <option key={p}>{p}</option>)}</select></Field>
          </div>
          <Field label="Progress" hint={f.progressSource==='worklenz' ? `Read from the project's WorkLenz progress (${worklenzProgress}%). It updates as tasks are completed.` : 'Set by hand. It will not change when tasks are completed.'}>
            <div style={{ display:'flex', gap:10, alignItems:'center' }}>
              <Seg value={f.progressSource} onChange={v=>setF({ ...f, progressSource:v })} options={[['worklenz','WorkLenz progress'],['manual','Set manually']]}/>
              {f.progressSource==='manual' && <input className="form-input" type="number" min="0" max="100" style={{ width:90 }} value={f.progress} onChange={e=>setF({ ...f, progress:e.target.value })}/>}
              {f.progressSource==='worklenz' && <b>{worklenzProgress}%</b>}
            </div>
          </Field>
          <div className="form-row">
            <Field label="Start date"><input className="form-input" type="date" value={f.start} onChange={e=>setF({ ...f, start:e.target.value })}/></Field>
            <Field label="Expected completion" hint="Leave blank and the portal shows “Not set” instead of inventing a date."><input className="form-input" type="date" value={f.due} onChange={e=>setF({ ...f, due:e.target.value })}/></Field>
          </div>
          <Field label="Primary contact"><select className="form-select" value={f.contactId} onChange={e=>setF({ ...f, contactId:e.target.value })}>{TEAM.map(t => <option key={t.id} value={t.id}>{t.name} · {t.title}</option>)}</select></Field>
          <Field label="Summary for the client" hint="Written for the client. Keep internal context in the private notes on the right."><textarea className="form-input" rows={3} value={f.summary} onChange={e=>setF({ ...f, summary:e.target.value })}/></Field>
          <div className="toggle-row" style={{ display:'flex', justifyContent:'space-between', padding:'10px 0', borderTop:'1px solid var(--border)' }}>
            <div><div style={{ fontSize:13, fontWeight:600 }}>Allow client uploads</div><div style={{ fontSize:11.5, opacity:.55 }}>Client Admins and Client Members can add files in this project. Client Viewers never can.</div></div>
            <Switch on={f.allowUploads} onChange={v=>setF({ ...f, allowUploads:v })}/>
          </div>
          <div style={{ marginTop:12 }}><button className="btn btn-primary btn-sm" disabled={!dirty} onClick={save}>Save changes</button></div>
        </div>
      </div>

      <div style={{ flex:'2 1 320px', minWidth:280 }}>
        <div className="card" style={{ marginBottom:16 }}>
          <div className="card-header"><span className="card-title">Publish an update</span></div>
          <textarea className="form-input" rows={3} placeholder="What should the client know this week?" value={post} onChange={e=>setPost(e.target.value)}/>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:10 }}>
            <span style={{ fontSize:11.5, opacity:.5 }}>Visible to every client user on this project</span>
            <button className="btn btn-primary btn-sm" disabled={!post.trim()} onClick={publish}>Publish update</button>
          </div>
          <div style={{ marginTop:14 }}>
            {mine.slice(0,4).map((u,i) => (
              <div key={u.id} style={{ padding:'9px 0', borderTop:'1px solid var(--border)' }}>
                <div style={{ fontSize:12, fontWeight:600 }}>{teamById(u.authorId).short} <span style={{ fontWeight:400, opacity:.5, marginLeft:6 }}>{fmtDate(u.date)}</span>{i===0 && <span className="tag tag-blue" style={{ marginLeft:8 }}>Latest</span>}</div>
                <div style={{ fontSize:12.5, marginTop:3, opacity:.85 }}>{u.text}</div>
              </div>
