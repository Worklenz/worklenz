        <div style={{ overflowX:'auto' }}>
          <table className="wl-table">
            <thead><tr><th>Project</th><th>Status</th><th>Phase</th><th>Progress</th><th>Expected completion</th><th>Project contact</th><th>Open items</th><th></th></tr></thead>
            <tbody>
              {myProjects.map(p => {
                const open = myApprovals.filter(a => a.projectId===p.id && a.status==='awaiting').length + myCRs.filter(c => c.projectId===p.id && ['submitted','under_review','more_info'].includes(c.status)).length;
                return (
                  <tr key={p.id} style={{ cursor:'pointer' }} onClick={()=>go('projects', { id:p.id })}>
                    <td style={{ color:'var(--accent)', fontWeight:600 }}>{p.name}</td>
                    <td><Tag v={PROJECT_STATUS[p.status]}/></td><td style={{ fontSize:12.5 }}>{p.phase}</td>
                    <td><Progress value={p.progress} color={p.color}/></td>
                    <td style={{ fontSize:12.5 }}>{fmtDate(p.due)}</td><td style={{ fontSize:12.5 }}>{p.contact.name}</td>
                    <td>{open>0 ? <span className="tag tag-orange">{open}</span> : <span style={{ opacity:.35 }}>—</span>}</td>
                    <td><button className="btn btn-default btn-sm" onClick={()=>go('projects', { id:p.id })}>Open</button></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
};

// ─── PROJECT WORKSPACE: Overview · Milestones · Tasks · Files · Discussions ──

const P_TABS = [['overview','Overview'],['milestones','Milestones'],['tasks','Tasks'],['files','Files'],['discussions','Discussions']];

const ProjectWorkspace = ({ projectId, params }) => {
  const { myProjects, go, threadsOf, unreadIn, role } = usePortal();
  const [tab, setTab] = useState(params.tab || 'overview');
  useEffect(() => { setTab(params.tab || 'overview'); }, [params.tab, projectId]);
  const project = myProjects.find(p => p.id===projectId);
  if (!project) return <Unavailable onBack={()=>go('projects')} backLabel="Back to projects"/>;
  const unread = threadsOf(project.id).filter(unreadIn).length;
  return (
    <div>
      <button className="btn btn-default btn-sm" style={{ marginBottom:14 }} onClick={()=>go('projects')}>← Projects</button>
      <div className="page-header-row" style={{ marginBottom:14 }}>
        <div><h1 style={{ fontSize:22, fontWeight:700, margin:0 }}>{project.name}</h1>
          <p style={{ opacity:.5, fontSize:13, margin:'4px 0 0' }}>{project.phase} · Expected completion {fmtDate(project.due)}</p></div>
        <div style={{ display:'flex', gap:8, alignItems:'center' }}><Tag v={PROJECT_STATUS[project.status]}/><span className="tag tag-blue">Your role: {role.label}</span></div>
      </div>
      <div className="section-tabs">
        {P_TABS.map(([k,l]) => <button key={k} className={`section-tab${tab===k?' active':''}`} onClick={()=>{ setTab(k); go('projects', { id:project.id, tab:k }); }}>{l}{k==='discussions' && unread>0 && <span className="count-dot">{unread}</span>}</button>)}
      </div>
      {tab==='overview' && <OverviewTab project={project}/>}
      {tab==='milestones' && <MilestonesTab project={project} params={params}/>}
      {tab==='tasks' && <TasksTab project={project} params={params}/>}
      {tab==='files' && <FilesTab project={project} params={params}/>}
      {tab==='discussions' && <DiscussionsTab project={project} params={params}/>}
    </div>
  );
};

const OverviewTab = ({ project }) => {
  const { updates, msOf, tasksOf, filesOf, threadsOf, unreadIn, myApprovals, myCRs, go } = usePortal();
  const latest = updates.filter(u => u.projectId===project.id).sort((a,b) => b.date.localeCompare(a.date))[0];
  const phaseIdx = PHASES.indexOf(project.phase);
  const links = [
    ['Milestones', msOf(project.id).length, 'milestones', 'flag'], ['Tasks', tasksOf(project.id).length, 'tasks', 'check-square'],
    ['Files', filesOf(project.id).length, 'files', 'file-text'], ['Discussions', threadsOf(project.id).filter(unreadIn).length || threadsOf(project.id).length, 'discussions', 'message'],
  ];
  const pendingAp = myApprovals.filter(a => a.projectId===project.id && a.status==='awaiting').length;
  const openCR = myCRs.filter(c => c.projectId===project.id && ['submitted','under_review','more_info'].includes(c.status)).length;
  return (
    <div style={{ display:'flex', gap:20, alignItems:'flex-start', flexWrap:'wrap' }}>
      <div style={{ flex:'3 1 460px', minWidth:0 }}>
        <div className="card" style={{ marginBottom:16 }}>
          <div style={{ fontSize:13.5, lineHeight:1.6, marginBottom:16 }}>{project.summary}</div>
          <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:6 }}><span style={{ fontSize:12, opacity:.55, width:70 }}>Progress</span><div style={{ flex:1 }}><Progress value={project.progress} color={project.color} width={0}/></div></div>
          <div className="phase-track">
            {PHASES.map((ph,i) => <div key={ph} className={`phase${i<phaseIdx?' done':i===phaseIdx?' cur':''}`}><span className="dot"/><span className="lbl">{ph}</span></div>)}
          </div>
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">Latest update</span></div>
          {latest ? <><div style={{ fontSize:12, fontWeight:600 }}>{latest.author} <span style={{ fontWeight:400, opacity:.5, marginLeft:6 }}>{fmtDate(latest.date)}</span></div><div style={{ fontSize:13.5, marginTop:5, lineHeight:1.6 }}>{latest.text}</div></> : <div style={{ fontSize:13, opacity:.5 }}>No updates have been published yet.</div>}
        </div>
      </div>
      <div style={{ flex:'2 1 260px', minWidth:240 }}>
        <div className="card" style={{ marginBottom:16 }}>
          <div className="card-header"><span className="card-title">Key dates</span></div>
          <KV rows={[['Start', fmtDate(project.start)], ['Expected completion', fmtDate(project.due)], ['Status', PROJECT_STATUS[project.status]], ['Current phase', project.phase]]}/>
        </div>
        <div className="card" style={{ marginBottom:16 }}>
          <div className="card-header"><span className="card-title">Project contact</span></div>
          <div style={{ display:'flex', gap:10, alignItems:'center' }}><Av initials={initialsFromName(project.contact.name)} color={project.color} size={36}/>
            <div><div style={{ fontWeight:600, fontSize:13 }}>{project.contact.name}</div><div style={{ fontSize:11.5, opacity:.55 }}>{project.contact.title}</div><div style={{ fontSize:11.5, color:'var(--accent)' }}>{project.contact.email}</div></div></div>
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">Quick links</span></div>
          {links.map(([l,n,tab,icon]) => <div key={l} className="action-row" onClick={()=>go('projects', { id:project.id, tab })}><span style={{ opacity:.55 }}><SvgIcon name={icon} size={15}/></span><div style={{ flex:1, fontSize:13 }}>{l}</div><span style={{ fontSize:12, opacity:.5 }}>{n}</span></div>)}
          <div className="action-row" onClick={()=>go('approvals')}><span style={{ opacity:.55 }}><SvgIcon name="clipboard-check" size={15}/></span><div style={{ flex:1, fontSize:13 }}>Approvals</div>{pendingAp>0 ? <span className="tag tag-orange">{pendingAp} pending</span> : <span style={{ fontSize:12, opacity:.5 }}>None pending</span>}</div>
          <div className="action-row" onClick={()=>go('change-requests')}><span style={{ opacity:.55 }}><SvgIcon name="repeat" size={15}/></span><div style={{ flex:1, fontSize:13 }}>Change requests</div><span style={{ fontSize:12, opacity:.5 }}>{openCR} open</span></div>
        </div>
      </div>
    </div>
  );
};

const MilestonesTab = ({ project, params }) => {
  const { msOf, myApprovals, go, milestones, tasksOf, filesOf } = usePortal();
  const list = msOf(project.id);
  // Linked work is filtered by each item's own visibility. A hidden task or file is never listed or counted.
  const linkedOf = (m) => ({
    tasks:(m.taskIds||[]).map(id => tasksOf(project.id).find(t => t.id===id)).filter(Boolean),
    files:(m.fileIds||[]).map(id => filesOf(project.id).find(f => f.id===id)).filter(Boolean),
  });
  const [open, setOpen] = useState(params.ms || null);
  useEffect(() => { if (params.ms) setOpen(params.ms); }, [params.ms]);
  const missing = params.ms && !list.some(m => m.id===params.ms);
  const dot = { completed:'#52c41a', in_progress:'var(--accent)', delayed:'#faad14', upcoming:'var(--border)' };
  return (
    <div>
      {missing && <Banner kind="warn" icon="lock">The milestone you opened isn't available. It may have been removed or you may no longer have access to it.</Banner>}
      <div className="card">
        {list.map((m,i) => {
          const aps = myApprovals.filter(a => a.linked.type==='milestone' && a.linked.id===m.id);
          const isOpen = open===m.id;
          return (
            <div key={m.id} className="ms-row" style={{ background: isOpen ? 'var(--hover)' : undefined }} onClick={()=>setOpen(isOpen ? null : m.id)}>
              <div className="ms-rail"><span className="ms-dot" style={{ background:dot[m.status], borderColor:m.status==='upcoming'?'var(--text-sec)':dot[m.status] }}/>{i<list.length-1 && <span className="ms-line"/>}</div>
              <div style={{ flex:1, minWidth:0, paddingBottom:14 }}>
                <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap' }}><span style={{ fontWeight:600, fontSize:13.5 }}>{m.name}</span><Tag v={MS_LABEL[m.status]}/></div>
                <div style={{ fontSize:12, opacity:.55, marginTop:3 }}>Target {fmtDate(m.target)}{m.completed && ` · Completed ${fmtDate(m.completed)}`}</div>
                {m.description && <div style={{ fontSize:12.5, opacity:.8, marginTop:5 }}>{m.description}</div>}
                {isOpen && (
                  <div style={{ marginTop:10 }}>
                    {m.completionNote && <div className="card card-sm" style={{ marginBottom:8 }}><div style={{ fontSize:11, opacity:.5, fontWeight:700, marginBottom:3 }}>COMPLETION NOTE</div><div style={{ fontSize:13 }}>{m.completionNote}</div></div>}
                    {m.status==='delayed' && <div style={{ fontSize:12, opacity:.65, marginBottom:8 }}>The target date has moved. Your project contact can share more detail.</div>}
                    {(() => { const lk = linkedOf(m); return (lk.tasks.length+lk.files.length)>0 && (
                      <div style={{ marginBottom:8 }}>
                        <div style={{ fontSize:11, opacity:.5, fontWeight:700, marginBottom:3 }}>LINKED WORK</div>
                        {lk.tasks.map(t => <div key={'t'+t.id} className="action-row" onClick={e=>{ e.stopPropagation(); go('projects', { id:project.id, tab:'tasks', task:t.id }); }}><span style={{ opacity:.55 }}><SvgIcon name="check-square" size={15}/></span><div style={{ flex:1, fontSize:12.5 }}>{t.title}</div><Tag v={CLIENT_TASK_STATUS[t.status]}/></div>)}
                        {lk.files.map(f => <div key={'f'+f.id} className="action-row" onClick={e=>{ e.stopPropagation(); go('projects', { id:project.id, tab:'files', file:f.id }); }}><span style={{ opacity:.55 }}><SvgIcon name="file-text" size={15}/></span><div style={{ flex:1, fontSize:12.5 }}>{f.name} <span style={{ opacity:.5 }}>v{f.version}</span></div></div>)}
                      </div>
                    ); })()}
                    {aps.map(a => <div key={a.id} className="action-row" onClick={e=>{ e.stopPropagation(); go('approvals', { id:a.id }); }}><span style={{ opacity:.55 }}><SvgIcon name="clipboard-check" size={15}/></span><div style={{ flex:1, fontSize:12.5 }}>{a.id} · {a.title}</div><Tag v={APPROVAL_STATUS[a.status]}/></div>)}
                    {!m.completionNote && aps.length===0 && m.status!=='delayed' && (() => { const lk = linkedOf(m); return (lk.tasks.length+lk.files.length)===0; })() && <div style={{ fontSize:12, opacity:.5 }}>Nothing more to share on this milestone yet.</div>}
                  </div>
                )}
              </div>
            </div>
          );
        })}
        {list.length===0 && <div style={{ fontSize:13, opacity:.55 }}>No milestones are shared with you yet.</div>}
      </div>
    </div>
  );
};

const TasksTab = ({ project, params }) => {
  const { tasksOf, filesOf, threads, can, user, setThreads, addActivity, logClient } = usePortal();
  const list = tasksOf(project.id);
  const downloadAttachment = (f) => filesOf(project.id).some(x => x.id===f.id)
    ? (toast(`Downloading ${f.name}…`), logClient('Client file downloaded', `File: ${f.name} (v${f.version})`))
    : toast('Download denied. This file is no longer shared with you.');
  const [openId, setOpenId] = useState(params.task || null);
  useEffect(() => { if (params.task) setOpenId(params.task); }, [params.task]);
  const open = list.find(t => t.id===openId);
  const missing = params.task && !list.some(t => t.id===params.task);
  const thread = open && threads.find(t => t.ctx.type==='task' && t.ctx.refId===open.id);
  const [draft, setDraft] = useState('');
  const send = () => {
    if (!draft.trim()) return;
    const msg = { id:uid('m'), author:user.name, side:'client', text:draft.trim(), time:'Just now' };
    if (thread) setThreads(l => l.map(t => t.id===thread.id ? { ...t, messages:[...t.messages, msg], readBy:[user.id] } : t));
    else setThreads(l => [{ id:uid('th'), projectId:project.id, ctx:{ type:'task', refId:open.id, label:`Task: ${open.title}` }, readBy:[user.id], messages:[msg] }, ...l]);
    addActivity({ projectId:project.id, icon:'message', text:`You commented on ${open.title}`, route:{ page:'projects', params:{ id:project.id, tab:'tasks', task:open.id } }, ref:{ type:'task', id:open.id } });
    logClient('Client comment created', `${project.name} · Task: ${open.title}`);
    setDraft(''); toast('Comment posted. Your team is notified.');
  };
  return (
    <div>
      {missing && <Banner kind="warn" icon="lock">The task you opened isn't available. It may have been removed or you may no longer have access to it.</Banner>}
      <div className="card" style={{ padding:0 }}>
        <div style={{ overflowX:'auto' }}>
          <table className="wl-table">
            <thead><tr><th>Task</th><th>Status</th><th>Due</th><th>About</th></tr></thead>
            <tbody>
              {list.map(t => (
                <tr key={t.id} style={{ cursor:'pointer' }} onClick={()=>setOpenId(t.id)}>
                  <td style={{ fontWeight:600, color:'var(--accent)' }}>{t.title}</td><td><Tag v={CLIENT_TASK_STATUS[t.status]}/></td>
                  <td style={{ fontSize:12.5 }}>{t.due ? fmtDate(t.due) : '—'}</td><td style={{ fontSize:12.5, opacity:.7, maxWidth:360 }}>{t.desc}</td>
                </tr>
              ))}
              {list.length===0 && <tr><td colSpan="4" style={{ textAlign:'center', padding:30, opacity:.45 }}>No tasks are shared with you yet. Your team shares the ones that matter to you.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      <p style={{ fontSize:11.5, opacity:.5, marginTop:10 }}>You see the tasks your team chose to share. You cannot edit them.</p>
      <Drawer open={!!open} onClose={()=>setOpenId(null)} title={open ? open.title : ''} subtitle={open ? `${CLIENT_TASK_STATUS[open.status]}${open.due ? ` · Due ${fmtDate(open.due)}` : ''}` : ''}>
        {open && <>
          <div style={{ fontSize:13.5, lineHeight:1.6, marginBottom:16 }}>{open.desc}</div>
          {(() => { const atts = (open.fileIds||[]).map(id => filesOf(project.id).find(f => f.id===id)).filter(Boolean); return atts.length>0 && (
            <div style={{ marginBottom:16 }}>
              <div className="form-label">ATTACHMENTS</div>
              {atts.map(f => (
                <div key={f.id} className="action-row" style={{ cursor:'default' }}>
                  <span style={{ opacity:.55 }}><SvgIcon name="paperclip" size={14}/></span>
                  <div style={{ flex:1, fontSize:12.5 }}>{f.name} <span style={{ opacity:.5 }}>v{f.version} · {f.size}</span></div>
                  <button className="btn btn-default btn-sm" onClick={()=>downloadAttachment(f)}><SvgIcon name="download" size={12}/></button>
                </div>
              ))}
            </div>
          ); })()}
          <div className="form-label">COMMENTS</div>
          {(thread ? thread.messages : []).map(m => (
            <div key={m.id} style={{ marginBottom:12 }}>
              <div style={{ fontSize:12, fontWeight:600 }}>{m.author} {m.side==='team' && <span className="tag tag-blue" style={{ marginLeft:4 }}>Team</span>}<span style={{ fontWeight:400, opacity:.45, marginLeft:6 }}>{m.time}</span></div>
              <div style={{ fontSize:13, marginTop:2 }}>{m.text}</div>
            </div>
          ))}
          {(!thread || thread.messages.length===0) && <div style={{ fontSize:12.5, opacity:.45, marginBottom:10 }}>No comments yet.</div>}
          {can.comment ? (
            <div style={{ display:'flex', gap:8, marginTop:8 }}>
              <input className="form-input" placeholder="Add a comment…" value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==='Enter' && send()}/>
              <button className="btn btn-primary btn-sm" onClick={send}>Send</button>
            </div>
          ) : <LockedNote>Client Viewers can't comment.</LockedNote>}
        </>}
      </Drawer>
    </div>
  );
};

const FILE_ICON = { pdf:'file-text' };

const FilesTab = ({ project, params }) => {
  const { filesOf, can, user, setFiles, addActivity, logClient } = usePortal();
  const list = filesOf(project.id);
  const [cat, setCat] = useState('all');
  const [preview, setPreview] = useState(null);
  const [upload, setUpload] = useState(false);
  const [hl, setHl] = useState(params.file || null);
  useEffect(() => { if (params.file) { setHl(params.file); const t = setTimeout(() => setHl(null), 3500); return () => clearTimeout(t); } }, [params.file]);
  const missing = params.file && !list.some(f => f.id===params.file);
  const shown = list.filter(f => cat==='all' || f.category===cat);
  const cats = [...new Set(list.map(f => f.category))];
  const canUpload = can.upload && project.allowUploads;
  // Opening, previewing and downloading are authorized per request and logged as client activity (spec 16.3).
  const download = (f) => filesOf(project.id).some(x => x.id===f.id)
    ? (toast(`Downloading ${f.name}…`), logClient('Client file downloaded', `File: ${f.name} (v${f.version})`))
    : toast('Download denied. This file is no longer shared with you.');
  const openPreview = (f) => { setPreview(f); logClient('Client file previewed', `File: ${f.name} (v${f.version})`); };
  return (
    <div>
      {missing && <Banner kind="warn" icon="lock">The file you opened isn't available. It may have been removed or you may no longer have access to it.</Banner>}
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, flexWrap:'wrap', marginBottom:12 }}>
        <div style={{ display:'flex', gap:6, flexWrap:'wrap' }}>
          {['all', ...cats].map(c => <button key={c} className={`chip${cat===c?' on':''}`} onClick={()=>setCat(c)}>{c==='all' ? `All (${list.length})` : c}</button>)}
        </div>
        {canUpload ? <button className="btn btn-primary btn-sm" onClick={()=>setUpload(true)}><SvgIcon name="upload" size={13}/> Upload file</button>
          : <LockedNote>{!can.upload ? "Client Viewers can't upload files." : 'Uploads are turned off for this project.'}</LockedNote>}
      </div>
      <div className="card" style={{ padding:0 }}>
        <div style={{ overflowX:'auto' }}>
          <table className="wl-table">
            <thead><tr><th>File</th><th>Category</th><th>Version</th><th>Uploaded by</th><th>Date</th><th></th></tr></thead>
            <tbody>
              {shown.map(f => (
                <tr key={f.id} style={{ background: hl===f.id ? 'var(--accent-soft)' : undefined }}>
                  <td><div style={{ display:'flex', gap:8, alignItems:'center', fontWeight:600, fontSize:13 }}><SvgIcon name="file-text" size={15}/>{f.name}</div><div style={{ fontSize:11.5, opacity:.5, marginLeft:23 }}>{f.size}</div></td>
                  <td style={{ fontSize:12.5 }}>{f.category}</td>
                  <td style={{ fontSize:12.5 }}>v{f.version}{f.versions>1 && <span style={{ opacity:.5 }}> · {f.versions} versions</span>}{f.versions>1 && <div style={{ fontSize:11, opacity:.5 }}>Replaced {fmtDate(f.date)}</div>}</td>
                  <td style={{ fontSize:12.5 }}>{f.by}{f.side==='client' && <span className="tag tag-purple" style={{ marginLeft:6 }}>{f.by===user.name ? 'You' : 'Client'}</span>}</td>
                  <td style={{ fontSize:12, opacity:.65 }}>{fmtDate(f.date)}</td>
                  <td style={{ whiteSpace:'nowrap' }}>
                    <button className="btn btn-default btn-sm" onClick={()=>openPreview(f)}><SvgIcon name="eye" size={12}/> Preview</button>{' '}
                    <button className="btn btn-default btn-sm" onClick={()=>download(f)}><SvgIcon name="download" size={12}/></button>
                  </td>
                </tr>
              ))}
              {shown.length===0 && <tr><td colSpan="6" style={{ textAlign:'center', padding:30, opacity:.45 }}>No files are shared with you yet.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      <Modal open={!!preview} onClose={()=>setPreview(null)} width={560} title={preview ? preview.name : ''}
        footer={<><button className="btn btn-default btn-sm" onClick={()=>setPreview(null)}>Close</button><button className="btn btn-primary btn-sm" onClick={()=>download(preview)}>Download</button></>}>
        {preview && <>
          <div className="file-preview"><SvgIcon name="file-text" size={42}/><div style={{ fontWeight:600, marginTop:8 }}>{preview.name}</div><div style={{ fontSize:12, opacity:.55 }}>Preview isn't rendered in this prototype</div></div>
          <KV rows={[['Category', preview.category], ['Version', `v${preview.version}`], ['Uploaded by', preview.by], ['Date', fmtDate(preview.date)], ['Size', preview.size]]}/>
        </>}
      </Modal>
      <UploadModal open={upload} project={project} onClose={()=>setUpload(false)}/>
    </div>
  );
};

const UploadModal = ({ open, project, onClose }) => {
  const { setFiles, user, addActivity, logClient } = usePortal();
  const [name, setName] = useState('');
  const [cat, setCat] = useState('Supporting Document');
  const ref = useRef(null);
  useEffect(() => { if (open) { setName(''); setCat('Supporting Document'); } }, [open]);
  const save = () => {
    if (!name.trim()) { toast('Choose a file first.'); return; }
    const id = uid('f');
    setFiles(l => [{ id, projectId:project.id, name:name.trim(), category:cat, visibility:'client', side:'client', by:user.name, date:TODAY, size:'1.1 MB', version:1, versions:1 }, ...l]);
    addActivity({ projectId:project.id, icon:'upload', text:`You uploaded ${name.trim()}`, route:{ page:'projects', params:{ id:project.id, tab:'files', file:id } }, ref:{ type:'file', id } });
    logClient('Client file uploaded', `${name.trim()} (v1)`);
    toast(`${name.trim()} uploaded. Your team can see it and is notified.`);
    onClose();
  };
  return (
    <Modal open={open} onClose={onClose} width={460} title="Upload a file"
      footer={<><button className="btn btn-default btn-sm" onClick={onClose}>Cancel</button><button className="btn btn-primary btn-sm" onClick={save}>Upload</button></>}>
      <div style={{ border:'1px dashed var(--border)', borderRadius:8, padding:'18px 10px', textAlign:'center', marginBottom:14 }}>
        <input ref={ref} type="file" style={{ display:'none' }} onChange={e=>{ const f = e.target.files && e.target.files[0]; if (f) setName(f.name); }}/>
        <button className="btn btn-default btn-sm" onClick={()=>ref.current && ref.current.click()}>Choose file</button>
        <div style={{ fontSize:12.5, marginTop:8, fontWeight:600 }}>{name || 'No file chosen'}</div>
        <input className="form-input" style={{ marginTop:10 }} placeholder="…or type a file name for the demo" value={name} onChange={e=>setName(e.target.value)}/>
      </div>
      <Field label="Category"><select className="form-select" value={cat} onChange={e=>setCat(e.target.value)}>{FILE_CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></Field>
      <div className="form-hint">Files you upload are visible to your project team and recorded as client activity.</div>
    </Modal>
  );
};

const CTX_ICON = { project:'folder', task:'check-square', file:'file-text', approval:'clipboard-check', direct:'user' };

// Top-level Discussions page: every project the user can open, plus direct chats with the team that belong to no project.
const DiscussionsPage = () => {
  const { route } = usePortal();
  return (
    <div>
      <PageHeader title="Discussions" sub="Conversations from all your projects, and direct chats with your team."/>
      <DiscussionsView project={null} params={route.params}/>
    </div>
  );
};

const DiscussionsTab = ({ project, params }) => <DiscussionsView project={project} params={params}/>;

// One view for both entry points. With a project it is that project's tab. Without one it is the whole inbox.
const DiscussionsView = ({ project, params }) => {
  const { myThreads, threadsOf, myProjects, can, user, setThreads, readThread, unreadIn, addActivity, logClient, go } = usePortal();
  const all = project ? threadsOf(project.id) : myThreads;
  const [filter, setFilter] = useState('all');
  const list = project ? all : all.filter(t => filter==='all' || (filter==='direct' ? t.projectId==null : String(t.projectId)===filter));
  const [activeId, setActiveId] = useState(params.thread || (list[0] && list[0].id));
  const [draft, setDraft] = useState('');
  const [showNew, setShowNew] = useState(false);
  useEffect(() => { if (params.thread) setActiveId(params.thread); }, [params.thread]);
  const pOf = (id) => myProjects.find(p => p.id===id);
  const active = list.find(t => t.id===activeId);
  const missing = params.thread && !all.some(t => t.id===params.thread);
  const current = active || list[0];
  const currentProject = current && current.projectId!=null ? pOf(current.projectId) : null;
  useEffect(() => { if (current) readThread(current.id); }, [current && current.id, current && current.messages.length]);
  const send = () => {
    if (!draft.trim() || !current) return;
    setThreads(l => l.map(t => t.id===current.id ? { ...t, readBy:[user.id], messages:[...t.messages, { id:uid('m'), author:user.name, side:'client', text:draft.trim(), time:'Just now' }] } : t));
    if (currentProject) {
      addActivity({ projectId:currentProject.id, icon:'message', text:`You commented in ${current.ctx.label}`, route:{ page:'projects', params:{ id:currentProject.id, tab:'discussions', thread:current.id } }, ref: current.ctx.type==='task' ? { type:'task', id:current.ctx.refId } : current.ctx.type==='file' ? { type:'file', id:current.ctx.refId } : undefined });
    }
    logClient('Client comment created', `${currentProject ? currentProject.name : 'Direct chat'} · ${current.ctx.label}`);
    setDraft(''); toast(currentProject ? 'Comment posted. Your team is notified.' : 'Message sent. Your team is notified.');
  };
  const emptyText = project || filter==='all' ? 'No discussions yet' : filter==='direct' ? 'No direct chats yet' : 'No discussions in this project yet';
  return (
    <div>
      {missing && <Banner kind="warn" icon="lock">The discussion you opened isn't available. The item it was about may no longer be shared with you.</Banner>}
      <div className="chat-layout">
        <div className="chat-sidebar">
          <div style={{ padding:'12px 14px', display:'flex', justifyContent:'space-between', alignItems:'center', borderBottom:'1px solid var(--border)' }}>
            <span style={{ fontWeight:700, fontSize:13 }}>Discussions</span>
            {can.comment && <button className="btn btn-default btn-sm" onClick={()=>setShowNew(true)}>+ New</button>}
          </div>
          {!project && (
            <div style={{ padding:'8px 14px', borderBottom:'1px solid var(--border)' }}>
              <select className="form-select" style={{ fontSize:12.5, padding:'5px 8px' }} value={filter} onChange={e=>setFilter(e.target.value)} title="Filter discussions">
                <option value="all">All discussions</option>
                <option value="direct">Direct chats (no project)</option>
                {myProjects.map(p => <option key={p.id} value={String(p.id)}>{p.name}</option>)}
              </select>
            </div>
          )}
          <div style={{ overflowY:'auto' }}>
            {list.map(t => {
              const last = t.messages[t.messages.length-1];
              const tp = t.projectId!=null ? pOf(t.projectId) : null;
              return (
                <div key={t.id} className={`chat-list-item${current && current.id===t.id?' active':''}`} onClick={()=>setActiveId(t.id)}>
                  <div style={{ display:'flex', gap:8, alignItems:'center' }}><span style={{ opacity:.55 }}><SvgIcon name={CTX_ICON[t.ctx.type]} size={14}/></span><span style={{ fontWeight:600, fontSize:13, flex:1 }}>{t.ctx.label}</span>{unreadIn(t) && <span style={{ width:8, height:8, borderRadius:'50%', background:'#ff4d4f' }}/>}</div>
                  {!project && <div style={{ fontSize:11, marginTop:3 }}>{tp ? <span style={{ opacity:.5 }}>{tp.name}</span> : <span className="tag tag-purple">Direct</span>}</div>}
                  <div style={{ fontSize:11.5, opacity:.5, marginTop:3, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{last ? `${last.author}: ${last.text}` : 'No messages yet'}</div>
                </div>
              );
            })}
            {list.length===0 && <div style={{ padding:20, fontSize:13, opacity:.5 }}>{emptyText}.</div>}
          </div>
        </div>
        <div className="chat-main">
          {current ? <>
            <div className="chat-main-head" style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
              <span>{current.ctx.label}</span>
              {current.ctx.type==='direct'
                ? <span className="tag tag-purple">Direct chat with {OPERATOR}</span>
                : !project && currentProject && <button className="btn btn-default btn-sm" onClick={()=>go('projects', { id:currentProject.id, tab:'discussions', thread:current.id })}>{currentProject.name} →</button>}
            </div>
            {current.ctx.type==='direct' && <div style={{ padding:'8px 18px', fontSize:12, opacity:.6, borderBottom:'1px solid var(--border)' }}>Not part of any project. Only you and the {OPERATOR} team can see this chat. Your colleagues cannot.</div>}
            <div className="chat-messages">
              {current.messages.map(m => (
                <div key={m.id} className={`chat-msg-row${m.author===user.name?' mine':''}`}>
                  <div className="chat-msg-sender">{m.author}{m.side==='team' && ' · Team'}</div>
                  <div className={`chat-msg ${m.author===user.name?'mine':'theirs'}`}>{renderMentions(m.text)}</div>
                  <div className="chat-msg-time">{m.time}</div>
                </div>
              ))}
            </div>
            {can.comment ? (
              <div className="chat-input-row">
                <input className="chat-input" placeholder="Write a reply…" value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>e.key==='Enter' && send()}/>
                <button className="btn btn-primary btn-sm" onClick={send}>Send</button>
              </div>
            ) : <div style={{ padding:'12px 16px', borderTop:'1px solid var(--border)' }}><LockedNote>Client Viewers can read discussions but can't reply.</LockedNote></div>}
          </> : <Empty icon="message" text={emptyText} sub={can.comment ? 'Start one with the New button.' : undefined}/>}
        </div>
      </div>
      <NewThreadModal open={showNew} project={project} onClose={()=>setShowNew(false)} onCreated={(id)=>{ setFilter('all'); setActiveId(id); }}/>
    </div>
  );
};

// From a project's tab the discussion belongs to that project. From the Discussions page the user picks a project or "No project", which is a direct chat with the team.
const NewThreadModal = ({ open, project, onClose, onCreated }) => {
  const { tasksOf, myProjects, user, setThreads, logClient } = usePortal();
  const [where, setWhere] = useState('direct');
  const [about, setAbout] = useState('project');
  const [subject, setSubject] = useState('');
  const [text, setText] = useState('');
  useEffect(() => { if (open) { setWhere(project ? String(project.id) : 'direct'); setAbout('project'); setSubject(''); setText(''); } }, [open]);
  const direct = !project && where==='direct';
  const proj = project || (direct ? null : myProjects.find(p => String(p.id)===where));
  const ts = proj ? tasksOf(proj.id) : [];
  const valid = text.trim() && (!direct || subject.trim());
  const create = () => {
    const task = proj && about!=='project' ? ts.find(t => t.id===Number(about)) : null;
    const id = uid('th');
    const ctx = direct ? { type:'direct', label:subject.trim() } : task ? { type:'task', refId:task.id, label:`Task: ${task.title}` } : { type:'project', label:'General' };
    setThreads(l => [{ id, projectId: proj ? proj.id : null, ...(direct ? { ownerId:user.id } : {}), ctx, readBy:[user.id], messages:[{ id:uid('m'), author:user.name, side:'client', text:text.trim(), time:'Just now' }] }, ...l]);
    logClient('Client comment created', `${proj ? proj.name : 'Direct chat'} · ${ctx.label}`);
    toast(direct ? 'Message sent. Your team is notified.' : 'Discussion started. Your team is notified.'); onCreated(id); onClose();
  };
  return (
    <Modal open={open} onClose={onClose} width={460} title={direct ? 'New direct message' : 'New discussion'}
      footer={<><button className="btn btn-default btn-sm" onClick={onClose}>Cancel</button><button className="btn btn-primary btn-sm" disabled={!valid} onClick={create}>{direct ? 'Send message' : 'Start discussion'}</button></>}>
      {!project && (
        <Field label="Project" hint={direct ? `Only you and the ${OPERATOR} team can see a direct chat.` : 'Everyone assigned to this project can see the discussion.'}>
          <select className="form-select" value={where} onChange={e=>{ setWhere(e.target.value); setAbout('project'); }}>
            <option value="direct">No project: message your team directly</option>
            {myProjects.map(p => <option key={p.id} value={String(p.id)}>{p.name}</option>)}
          </select>
        </Field>
      )}
      {direct
        ? <Field label="Subject"><input className="form-input" value={subject} onChange={e=>setSubject(e.target.value)} placeholder="What is this about?"/></Field>
        : <Field label="About"><select className="form-select" value={about} onChange={e=>setAbout(e.target.value)}><option value="project">The project in general</option>{ts.map(t => <option key={t.id} value={t.id}>Task: {t.title}</option>)}</select></Field>}
      <Field label="Message"><textarea className="form-input" rows={3} value={text} onChange={e=>setText(e.target.value)}/></Field>
    </Modal>
  );
};

// ─── APPROVALS (spec 11) — approve or request changes, with the exact version recorded ──

const ApprovalsPage = () => {
  const { route } = usePortal();
  return route.params.id ? <ApprovalDetail id={route.params.id}/> : <ApprovalsList/>;
};

const ApprovalsList = () => {
  const { myApprovals, myProjects, user, can, go, pendingApprovals } = usePortal();
  const [tab, setTab] = useState('awaiting');
  const awaiting = myApprovals.filter(a => a.status==='awaiting');
  const done = myApprovals.filter(a => a.status!=='awaiting');
  const rows = tab==='awaiting' ? awaiting : done;
  const pName = (id) => (myProjects.find(p => p.id===id)||{}).name;
  return (
    <div>
      <PageHeader title="Approvals" sub="Items your team needs you to approve, and the decisions already made."/>
      {!can.approve && <Banner kind="info" icon="lock">As a {ROLES[user.role].label} you can see approvals but not decide them. Only a Client Admin can approve.</Banner>}
      <div className="section-tabs">
        <button className={`section-tab${tab==='awaiting'?' active':''}`} onClick={()=>setTab('awaiting')}>Awaiting approval{awaiting.length>0 && <span className="count-dot">{awaiting.length}</span>}</button>
        <button className={`section-tab${tab==='completed'?' active':''}`} onClick={()=>setTab('completed')}>Completed ({done.length})</button>
      </div>
      {rows.length===0 ? <Empty icon="clipboard-check" text={tab==='awaiting' ? 'Nothing is waiting for approval' : 'No completed approvals yet'}/> : (
        <div className="card" style={{ padding:0 }}>
          <div style={{ overflowX:'auto' }}>
            <table className="wl-table">
              <thead><tr><th>Approval</th><th>Project</th><th>Linked item</th><th>{tab==='awaiting' ? 'Due' : 'Decision'}</th><th>Status</th><th></th></tr></thead>
              <tbody>
                {rows.map(a => (
                  <tr key={a.id} style={{ cursor:'pointer' }} onClick={()=>go('approvals', { id:a.id })}>
                    <td><div style={{ color:'var(--accent)', fontWeight:600, fontSize:13 }}>{a.title}</div><div style={{ fontSize:11.5, opacity:.5 }}>{a.id}{a.revision>1 ? ` · Revision ${a.revision}` : ''}</div></td>
                    <td style={{ fontSize:12.5 }}>{pName(a.projectId)}</td>
                    <td style={{ fontSize:12.5 }}>{a.linked.name}{a.linked.version ? ` · v${a.linked.version}` : ''}<div style={{ fontSize:11, opacity:.5 }}>{LINK_TYPE_LABEL[a.linked.type]}</div></td>
                    <td style={{ fontSize:12.5 }}>{tab==='awaiting' ? (a.due ? dueTag(a.due) : '—') : (a.decision ? `${a.decision.by} · ${a.decision.at}` : '—')}</td>
                    <td><Tag v={APPROVAL_STATUS[a.status]}/></td>
                    <td><button className={`btn btn-sm ${a.status==='awaiting' && pendingApprovals.includes(a) ? 'btn-primary' : 'btn-default'}`}>{a.status==='awaiting' && pendingApprovals.includes(a) ? 'Review' : 'View'}</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
};

const ApprovalDetail = ({ id }) => {
  const { myApprovals, myProjects, user, can, files, go, updateApproval, addActivity, filesOf, tasksOf, logClient, threads, setThreads } = usePortal();
  const [comment, setComment] = useState('');
  const [cDraft, setCDraft] = useState('');        // a comment on the approval item itself, separate from the decision comment
  const [nudge, setNudge] = useState(false);       // "Request changes" without a comment asks once before it records
  const busy = useRef(false);
  useEffect(() => { busy.current = false; setComment(''); setCDraft(''); setNudge(false); }, [id]);
  const a = myApprovals.find(x => x.id===id);
  if (!a) return <Unavailable onBack={()=>go('approvals')} backLabel="Back to approvals"/>;
  const proj = myProjects.find(p => p.id===a.projectId);
  const file = a.linked.type==='file' ? files.find(f => f.id===a.linked.id) : null;
  const fileShared = file && filesOf(a.projectId).some(f => f.id===file.id);
  const moved = fileShared && a.linked.version && file.version > a.linked.version;
  const taskShared = a.linked.type==='task' && tasksOf(a.projectId).some(t => t.id===a.linked.id);
  const isApprover = a.approverId===user.id;
  const canDecide = can.approve && isApprover && a.status==='awaiting';
  const thread = threads.find(t => t.ctx.type==='approval' && t.ctx.refId===a.id);
  const sendComment = () => {
    if (!cDraft.trim()) return;
    const msg = { id:uid('m'), author:user.name, side:'client', text:cDraft.trim(), time:'Just now' };
    if (thread) setThreads(l => l.map(t => t.id===thread.id ? { ...t, messages:[...t.messages, msg], readBy:[user.id] } : t));
    else setThreads(l => [{ id:uid('th'), projectId:a.projectId, ctx:{ type:'approval', refId:a.id, label:`Approval: ${a.id}` }, readBy:[user.id], messages:[msg] }, ...l]);
    addActivity({ projectId:a.projectId, icon:'message', text:`You commented on ${a.id}`, route:{ page:'approvals', params:{ id:a.id } } });
    logClient('Client comment created', `${proj ? proj.name : ''} · Approval: ${a.id}`);
    setCDraft(''); toast('Comment posted. Your team is notified.');
  };

  const decide = (outcome) => {
    if (busy.current || a.status!=='awaiting') return;   // idempotent: one decision per request
    // A comment is optional but recommended when asking for changes (spec 11), so ask once before recording an empty one.
    if (outcome==='changes_requested' && !comment.trim() && !nudge) { setNudge(true); return; }
    busy.current = true;
    const text = outcome==='approved' ? 'Approved' : 'Requested changes';
    updateApproval(a.id, x => ({ status:outcome, decision:{ by:user.name, at:'Just now', outcome, comment:comment.trim() }, history:[...x.history, { ts:'Just now', actor:user.name, text:`${text}${comment.trim() ? `: “${comment.trim()}”` : ''} (${decisionRef(a)})` }] }));
    addActivity({ projectId:a.projectId, icon:'clipboard-check', text:`You ${outcome==='approved' ? 'approved' : 'requested changes on'} ${a.title}`, route:{ page:'approvals', params:{ id:a.id } } });
    logClient(outcome==='approved' ? 'Approval: approved' : 'Approval: changes requested', `${a.id} · ${a.title} (${decisionRef(a)})`);
    toast(outcome==='approved' ? `Approved. Your team is notified and ${a.linked.name}${a.linked.version ? ` v${a.linked.version}` : ''} is recorded as approved.` : 'Changes requested. Your team is notified and will send a new revision.');
  };

  return (
    <div>
      <button className="btn btn-default btn-sm" style={{ marginBottom:14 }} onClick={()=>go('approvals')}>← Approvals</button>
      <div className="page-header-row" style={{ marginBottom:14 }}>
        <div><h1 style={{ fontSize:20, fontWeight:700, margin:0 }}>{a.title}</h1><p style={{ opacity:.5, fontSize:13, margin:'4px 0 0' }}>{a.id} · {proj ? proj.name : ''} · Revision {a.revision}</p></div>
        <Tag v={APPROVAL_STATUS[a.status]}/>
      </div>
      <div style={{ display:'flex', gap:20, alignItems:'flex-start', flexWrap:'wrap' }}>
        <div style={{ flex:'3 1 440px', minWidth:0 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">What you are approving</span></div>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, padding:'10px 12px', border:'1px solid var(--border)', borderRadius:8 }}>
              <div style={{ display:'flex', gap:10, alignItems:'center' }}><SvgIcon name={LINK_ICON[a.linked.type]} size={18}/>
                <div><div style={{ fontWeight:600, fontSize:13.5 }}>{a.linked.name}</div><div style={{ fontSize:11.5, opacity:.55 }}>{a.linked.type==='file' ? `Version ${a.linked.version}` : a.linked.type==='task' ? 'Task' : a.linked.type==='freeform' ? 'Details from your team' : 'Milestone'}</div></div></div>
              {a.linked.type==='file' && (fileShared
                ? <button className="btn btn-default btn-sm" onClick={()=>go('projects', { id:a.projectId, tab:'files', file:a.linked.id })}>Open file</button>
                : <span className="tag tag-gray"><SvgIcon name="lock" size={11}/>No longer shared</span>)}
              {a.linked.type==='milestone' && <button className="btn btn-default btn-sm" onClick={()=>go('projects', { id:a.projectId, tab:'milestones', ms:a.linked.id })}>Open milestone</button>}
              {a.linked.type==='task' && (taskShared
                ? <button className="btn btn-default btn-sm" onClick={()=>go('projects', { id:a.projectId, tab:'tasks', task:a.linked.id })}>Open task</button>
                : <span className="tag tag-gray"><SvgIcon name="lock" size={11}/>No longer shared</span>)}
            </div>
            {a.linked.type==='freeform' && (
              <div style={{ marginTop:10, fontSize:13.5, lineHeight:1.6 }}>
                {a.linked.description ? <div style={{ whiteSpace:'pre-wrap' }}>{a.linked.description}</div> : <span style={{ opacity:.5 }}>Your team did not add a description. See the instructions below.</span>}
                {(a.linked.snapshots || []).length>1 && (
                  <div style={{ marginTop:10, paddingTop:8, borderTop:'1px solid var(--border)' }}>
                    <div style={{ fontSize:11.5, opacity:.5, fontWeight:700, marginBottom:4, letterSpacing:.5 }}>EARLIER REVISIONS</div>
                    {a.linked.snapshots.slice(0,-1).reverse().map(sn => <div key={sn.rev} style={{ fontSize:12.5, opacity:.7, marginBottom:4 }}><b>Revision {sn.rev}:</b> {sn.description || 'No description.'}</div>)}
                  </div>
                )}
              </div>
            )}
            {moved && <div style={{ marginTop:10 }}><Banner kind="info" icon="clock">This approval covers <b>v{a.linked.version}</b>. The file is now <b>v{file.version}</b>, so your decision applies to the earlier version.</Banner></div>}
            <div style={{ fontSize:11.5, opacity:.5, fontWeight:700, margin:'16px 0 6px', letterSpacing:.5 }}>INSTRUCTIONS</div>
            <div style={{ fontSize:13.5, lineHeight:1.6 }}>{a.instructions || 'No instructions were added.'}</div>
            <div style={{ display:'flex', gap:18, marginTop:14, fontSize:12.5, opacity:.7, flexWrap:'wrap' }}><span>Requested by {a.requestedBy}</span><span>Approver: {a.approver}</span>{a.due && <span>Due {fmtDate(a.due)}</span>}</div>
          </div>

          {a.decision && (
            <div className="card" style={{ marginBottom:16, borderColor: a.decision.outcome==='approved' ? '#b7eb8f' : '#ffccc7' }}>
              <div className="card-header"><span className="card-title">Decision</span></div>
              <div style={{ fontSize:13.5, fontWeight:600 }}>{a.decision.outcome==='approved' ? 'Approved' : 'Changes requested'} by {a.decision.by}<span style={{ fontWeight:400, opacity:.5 }}> · {a.decision.at}</span></div>
              {a.decision.comment && <div style={{ fontSize:13.5, marginTop:6 }}>“{a.decision.comment}”</div>}
              <div style={{ fontSize:11.5, opacity:.5, marginTop:8 }}>A decision is final. Changing it needs a new revision from your team.</div>
            </div>
          )}

          {a.status==='awaiting' && (
            <div className="card">
              <div className="card-header"><span className="card-title">Your decision</span></div>
              {canDecide ? <>
                <textarea className="form-input" rows={3} placeholder="Add a comment (optional, but helpful if you request changes)" value={comment} onChange={e=>{ setComment(e.target.value); setNudge(false); }}/>
                {nudge && <div style={{ marginTop:10 }}><Banner kind="warn" icon="clock">Tell your team what to change. A comment is optional, but it saves a round of questions. Add one, or choose “Request changes without a comment”.</Banner></div>}
                <div style={{ display:'flex', gap:10, marginTop:12 }}>
                  <button className="btn btn-primary" onClick={()=>decide('approved')}><SvgIcon name="check" size={14}/> Approve</button>
                  <button className="btn btn-default" onClick={()=>decide('changes_requested')}>{nudge ? 'Request changes without a comment' : 'Request changes'}</button>
                </div>
              </> : (
                <Banner kind="info" icon="lock">{!can.approve ? `As a ${ROLES[user.role].label} you can view this approval but not decide it. Only a Client Admin can approve.` : `Only ${a.approver} was asked to decide this approval. You can follow along here.`}</Banner>
              )}
              {!canDecide && <div style={{ display:'flex', gap:10, opacity:.5 }}><button className="btn btn-primary" disabled>Approve</button><button className="btn btn-default" disabled>Request changes</button></div>}
            </div>
          )}

          <div className="card" style={{ marginTop:16 }}>
            <div className="card-header"><span className="card-title">Discussion about this approval</span></div>
            {(thread ? thread.messages : []).map(m => (
              <div key={m.id} style={{ marginBottom:12 }}>
                <div style={{ fontSize:12, fontWeight:600 }}>{m.author} {m.side==='team' && <span className="tag tag-blue" style={{ marginLeft:4 }}>Team</span>}<span style={{ fontWeight:400, opacity:.45, marginLeft:6 }}>{m.time}</span></div>
                <div style={{ fontSize:13, marginTop:2 }}>{renderMentions(m.text)}</div>
              </div>
            ))}
            {(!thread || thread.messages.length===0) && <div style={{ fontSize:12.5, opacity:.5, marginBottom:10 }}>No comments yet. Ask your team a question here before you decide.</div>}
            {can.comment ? (
              <div style={{ display:'flex', gap:8 }}>
                <input className="form-input" placeholder="Comment on this approval…" value={cDraft} onChange={e=>setCDraft(e.target.value)} onKeyDown={e=>e.key==='Enter' && sendComment()}/>
                <button className="btn btn-primary btn-sm" onClick={sendComment}>Send</button>
              </div>
            ) : <LockedNote>Client Viewers can't comment.</LockedNote>}
          </div>
        </div>

          <div className="card">
            <div className="card-header"><span className="card-title">History</span></div>

              <div key={i} style={{ padding:'8px 0', borderBottom:'1px solid var(--border)' }}>
                <div style={{ fontSize:12.5 }}><b>{h.actor}</b> {h.text}</div><div style={{ fontSize:11, opacity:.45, marginTop:2 }}>{h.ts}</div>

const CR_STEPS = ['Submitted','Under review','Decision','In progress','Completed'];
const crStep = (s) => ({ submitted:0, under_review:1, more_info:1, approved:2, rejected:2, in_progress:3, completed:4, cancelled:-1 }[s]);

const CRStepper = ({ status }) => {
  const idx = crStep(status);
  return (
    <div style={{ display:'flex', gap:4 }}>
      {CR_STEPS.map((label,i) => {
        const done = idx>=0 && i<idx, cur = i===idx, rej = cur && status==='rejected';
        const lbl = i===2 ? (status==='rejected' ? 'Rejected' : idx>2 || status==='approved' ? 'Approved' : 'Decision') : label;
        return (
          <div key={label} style={{ flex:1 }}>
            <div style={{ height:4, borderRadius:2, background: rej ? '#ff4d4f' : (done||cur) ? 'var(--accent)' : 'var(--border)', opacity: done ? .55 : 1 }}/>
            <div style={{ fontSize:11, marginTop:5, fontWeight:cur?700:500, opacity:cur?1:done?.7:.4, color:rej?'#ff4d4f':undefined }}>{lbl}</div>
          </div>
        );
      })}
    </div>
  );
};

const ChangeRequestsPage = () => {
  const { route } = usePortal();

};

    <div>

      {myCRs.length===0 ? <Empty icon="repeat" text="No change requests yet" sub="Need something added, changed or removed? Submit a change request and your team will review it." action={can.submitCR && <button className="btn btn-primary btn-sm" onClick={()=>setShowNew(true)}>Submit your first request</button>}/> : (

          <div style={{ overflowX:'auto' }}>
            <table className="wl-table">

const NewCRModal = ({ open, onClose }) => {
  const { myProjects, user, crs, setCrs, go, addActivity, logClient } = usePortal();
  const [f, setF] = useState({ projectId:'', title:'', description:'', priority:'Medium', notes:'', attachments:[] });
  const ref = useRef(null);
  useEffect(() => { if (open) setF({ projectId:String(myProjects[0] ? myProjects[0].id : ''), title:'', description:'', priority:'Medium', notes:'', attachments:[] }); }, [open]);
  const valid = f.projectId && f.title.trim() && f.description.trim();
  const submit = () => {
    const id = Math.max(...crs.map(c => c.id)) + 1;
    const crNo = 'CR-' + String(Math.max(...crs.map(c => Number(c.crNo.slice(3)))) + 1).padStart(4, '0');
    setCrs(l => [{ id, crNo, projectId:Number(f.projectId), title:f.title.trim(), description:f.description.trim(), notes:f.notes.trim(), priority:f.priority, requesterId:user.id, requester:user.name, submitted:TODAY, status:'submitted', attachments:f.attachments, estimate:null, thread:[], timeline:[{ ts:'Today', text:'Submitted' }] }, ...l]);
    addActivity({ projectId:Number(f.projectId), icon:'repeat', text:`You submitted ${crNo}: ${f.title.trim()}`, route:{ page:'change-requests', params:{ id } } });
    logClient('Change request created', `${crNo} · ${f.title.trim()}`);
    toast(`${crNo} submitted. Your team reviews it first. It does not create a task by itself.`);
    onClose(); go('change-requests', { id });
  };
  return (
    <Modal open={open} onClose={onClose} width={540} title="New change request"
      footer={<><button className="btn btn-default btn-sm" onClick={onClose}>Cancel</button><button className="btn btn-primary btn-sm" disabled={!valid} onClick={submit}>Submit request</button></>}>
      <Field label="Project"><select className="form-select" value={f.projectId} onChange={e=>setF({ ...f, projectId:e.target.value })}>{myProjects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}</select></Field>
      <Field label="Title"><input className="form-input" value={f.title} onChange={e=>setF({ ...f, title:e.target.value })} placeholder="A short summary of the change"/></Field>
      <Field label="Description"><textarea className="form-input" rows={4} value={f.description} onChange={e=>setF({ ...f, description:e.target.value })} placeholder="What do you need, and why?"/></Field>
      <div className="form-row">
        <Field label="Priority"><div className="seg">{['Low','Medium','High'].map(p => <button key={p} type="button" className={f.priority===p?'on':''} onClick={()=>setF({ ...f, priority:p })}>{p}</button>)}</div></Field>
        <Field label="Attachments (optional)">
          <input ref={ref} type="file" style={{ display:'none' }} onChange={e=>{ const fl = e.target.files && e.target.files[0]; if (fl) setF(s => ({ ...s, attachments:[...s.attachments, fl.name] })); }}/>
          <button className="btn btn-default btn-sm" type="button" onClick={()=>ref.current && ref.current.click()}><SvgIcon name="paperclip" size={13}/> Add file</button>
          <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginTop:6 }}>{f.attachments.map(a => <span key={a} className="tag tag-gray">{a}</span>)}</div>
        </Field>
      </div>
      <Field label="Notes (optional)"><input className="form-input" value={f.notes} onChange={e=>setF({ ...f, notes:e.target.value })} placeholder="Anything else the team should know"/></Field>
    </Modal>
  );
};

const CRDetail = ({ id }) => {
  const { myCRs, myProjects, user, can, go, updateCR, addActivity, logClient } = usePortal();
  const [info, setInfo] = useState('');
  const [confirm, setConfirm] = useState(false);
  useEffect(() => { setInfo(''); }, [id]);
  const c = myCRs.find(x => x.id===id);
  if (!c) return <Unavailable onBack={()=>go('change-requests')} backLabel="Back to change requests"/>;
  const proj = myProjects.find(p => p.id===c.projectId);
  const est = fmtEstimate(c.estimate);
  const mine = c.requesterId===user.id || can.manageUsers;
  const canFollow = c.status==='more_info' && can.submitCR;
  const canCancel = ['submitted','under_review','more_info'].includes(c.status) && can.submitCR && mine;

  const sendInfo = () => {
    if (!info.trim()) return;
    updateCR(c.id, x => ({ status:'under_review', thread:[...x.thread, { from:'client', author:user.name, text:info.trim(), ts:'Just now' }], timeline:[...x.timeline, { ts:'Today', text:'Information provided' }, { ts:'Today', text:'Under review' }] }));
    addActivity({ projectId:c.projectId, icon:'repeat', text:`You replied on ${c.crNo}`, route:{ page:'change-requests', params:{ id:c.id } } });
    logClient('Change request status changed', `${c.crNo} · More Information Required → Under Review`);
    toast('Thanks. Your team has the information and the request is back under review.'); setInfo('');
  };

  return (
    <div>
      <button className="btn btn-default btn-sm" style={{ marginBottom:14 }} onClick={()=>go('change-requests')}>← Change requests</button>
      <div className="page-header-row" style={{ marginBottom:14 }}>
        <div><h1 style={{ fontSize:20, fontWeight:700, margin:0 }}>{c.title}</h1><p style={{ opacity:.5, fontSize:13, margin:'4px 0 0' }}>{c.crNo} · {proj ? proj.name : ''} · Submitted {fmtDate(c.submitted)} by {c.requester}</p></div>
        <div style={{ display:'flex', gap:8 }}><Tag v={c.priority}/><Tag v={CR_STATUS[c.status]}/></div>
      </div>
      <div className="card" style={{ marginBottom:16 }}>{c.status==='cancelled' ? <Banner kind="warn" icon="x">This request was cancelled.</Banner> : <CRStepper status={c.status}/>}</div>

      <div style={{ display:'flex', gap:20, alignItems:'flex-start', flexWrap:'wrap' }}>
        <div style={{ flex:'3 1 440px', minWidth:0 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Your request</span></div>
            <div style={{ fontSize:13.5, lineHeight:1.6 }}>{c.description}</div>
            {c.notes && <div style={{ fontSize:12.5, opacity:.7, marginTop:10 }}><b>Notes:</b> {c.notes}</div>}
            {c.attachments.length>0 && <div style={{ display:'flex', gap:8, marginTop:12, flexWrap:'wrap' }}>{c.attachments.map(a => <span key={a} className="tag tag-gray" style={{ padding:'4px 10px', gap:5 }}><SvgIcon name="paperclip" size={11}/>{a}</span>)}</div>}
          </div>

          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Conversation with your team</span></div>
            {c.thread.map((m,i) => (
              <div key={i} style={{ display:'flex', gap:10, marginBottom:14 }}>
                <Av initials={initialsFromName(m.author)} color={m.from==='client' ? 'var(--accent)' : '#52c41a'} size={30}/>
                <div><div style={{ fontSize:12.5, fontWeight:600 }}>{m.author} {m.from==='team' && <span className="tag tag-blue" style={{ marginLeft:4 }}>Team</span>}<span style={{ fontWeight:400, opacity:.45, marginLeft:8 }}>{m.ts}</span></div>
                  <div style={{ fontSize:13.5, marginTop:3 }}>{m.text}</div></div>
              </div>
            ))}
            {c.thread.length===0 && <div style={{ fontSize:13, opacity:.5 }}>Your team has not responded yet. You are notified as soon as they do.</div>}
            {c.status==='more_info' && (canFollow ? (
              <div style={{ borderTop:'1px solid var(--border)', paddingTop:12 }}>
                <Banner kind="warn" icon="clock">Your team needs more information before they can decide.</Banner>
                <textarea className="form-input" rows={3} placeholder="Add the information they asked for…" value={info} onChange={e=>setInfo(e.target.value)}/>
                <div style={{ marginTop:10 }}><button className="btn btn-primary btn-sm" disabled={!info.trim()} onClick={sendInfo}>Send information</button></div>
              </div>
            ) : <LockedNote>Client Viewers can't reply to change requests.</LockedNote>)}
          </div>
        </div>
        <div style={{ flex:'1 1 260px', minWidth:240 }}>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Estimate</span></div>
            {est ? <><div style={{ fontSize:20, fontWeight:700 }}>{est}</div><div style={{ fontSize:11.5, opacity:.5, marginTop:4 }}>Estimated additional time and cost.</div></>
              : <div style={{ fontSize:13, opacity:.5 }}>No estimate yet. Your team adds one if it applies.</div>}
          </div>
          <div className="card" style={{ marginBottom:16 }}>
            <div className="card-header"><span className="card-title">Progress</span></div>
            {c.timeline.slice().reverse().map((t,i) => <div key={i} style={{ display:'flex', justifyContent:'space-between', padding:'7px 0', borderBottom:'1px solid var(--border)', fontSize:12.5 }}><span>{t.text}</span><span style={{ opacity:.45 }}>{t.ts}</span></div>)}
          </div>
          {canCancel && <button className="btn btn-default btn-sm" style={{ width:'100%', justifyContent:'center' }} onClick={()=>setConfirm(true)}>Cancel this request</button>}
        </div>
      </div>
      <Modal open={confirm} onClose={()=>setConfirm(false)} width={420} title="Cancel this request?"
        footer={<><button className="btn btn-default btn-sm" onClick={()=>setConfirm(false)}>Keep it</button><button className="btn btn-primary btn-sm" onClick={()=>{ updateCR(c.id, x => ({ status:'cancelled', timeline:[...x.timeline, { ts:'Today', text:'Cancelled' }] })); logClient('Change request status changed', `${c.crNo} · ${CR_STATUS[c.status]} → Cancelled`); setConfirm(false); toast(`${c.crNo} cancelled.`); }}>Cancel request</button></>}>
        <div style={{ fontSize:13 }}>Your team stops working on <b>{c.crNo}</b>. You can submit a new request later.</div>
      </Modal>
    </div>
  );
};

            <tbody>{NOTIF_TYPES.map(t => (
              <tr key={t}><td style={{ fontSize:13 }}>{t}</td><td style={{ textAlign:'center' }}><input type="checkbox" checked disabled/></td>
                <td style={{ textAlign:'center' }}>{op.emailTypes[t] ? <input type="checkbox" checked={prefs[t]} onChange={()=>setPrefs(p => ({ ...p, [t]:!p[t] }))} style={{ accentColor:'var(--accent)' }}/> : <span style={{ fontSize:11, opacity:.4 }}>Not offered</span>}</td></tr>
            ))}</tbody>
          </table>
        </div>
      )}

      {tab==='security' && (
        <div className="card" style={{ maxWidth:480 }}>
          <p style={{ fontSize:12.5, opacity:.55, margin:'-4px 0 14px' }}>Sign-in methods available for your account. Your project contact sets these.</p>
          {[['magicLink','Magic link sign-in'],['google','Google sign-in'],['password','Password sign-in']].filter(([k]) => op.auth[k]).map(([k,label]) => <div key={k} className="toggle-row"><span className="t">{label}</span><span className="tag tag-green">Enabled</span></div>)}
          <div style={{ marginTop:16 }}><button className="btn btn-default btn-sm" onClick={onSignOut}>Sign out</button></div>
        </div>
      )}
    </div>
  );
};

// ─── PROTOTYPE CONTROLS (meta panel) ─────────────────────────────────────────
// Everything here stands in for something that happens somewhere else: the operator's settings in the admin
// console, or an action by the internal project team. None of it is part of the client-facing product.

const ProtoControls = ({ branding, setBranding, setOp, userId, setUserId, onRevoke }) => {
  const P = usePortal();
  const { op } = P;
  const [open, setOpen] = useState(false);
  const chk = { accentColor:'var(--accent)', width:15, height:15 };
  const row = (label, checked, onChange) => (
    <div className="toggle-row" style={{ padding:'6px 0' }}><span className="t" style={{ fontWeight:400, fontSize:12.5 }}>{label}</span><input type="checkbox" checked={checked} onChange={onChange} style={chk}/></div>
  );
  const taskVisible = P.tasks.find(t => t.id===101).visibility==='client';
  const hasProject1 = (P.assign[P.user.id]||[]).includes(1);

  const sim = {
    update: () => {
      const text = 'The staging site is live and the homepage build is on track for UAT.';
      P.setUpdates(l => [{ id:uid('u'), projectId:1, author:'Kasun F.', date:TODAY, text }, ...l]);
      P.notify({ type:'Project', title:'Project update from Kasun F.', body:text, route:{ page:'projects', params:{ id:1 } } });
      P.addActivity({ projectId:1, icon:'briefcase', text:'Kasun F. posted a project update', route:{ page:'projects', params:{ id:1 } } });
      toast('Team published a project update.');
    },
    approval: () => {
      const n = Math.max(125, ...P.approvals.map(a => Number(a.id.slice(3)))) + 1;
      const id = 'AP-' + String(n).padStart(6, '0');
      P.setApprovals(l => [{ id, projectId:1, title:'Approve visual design direction', linked:{ type:'milestone', id:3, name:'Visual design & design system', version:null }, approverId:1, approver:'Alex Chen', instructions:'Review the three design directions and confirm the one we should develop.', due:'2026-06-12', status:'awaiting', revision:1, requestedBy:'Kasun F.', decision:null, history:[{ ts:'Just now', actor:'Kasun F.', text:'Requested approval of Visual design & design system' }] }, ...l]);
      P.notify({ type:'Approval', title:'New approval request', body:'Approve visual design direction · due Jun 12', route:{ page:'approvals', params:{ id } } });
      P.addActivity({ projectId:1, icon:'clipboard-check', text:'Kasun F. requested your approval: Approve visual design direction', route:{ page:'approvals', params:{ id } } });
      toast(`Team sent ${id} to Alex Chen.`);
    },
    file: () => {
      const id = uid('f');
      P.setFiles(l => [{ id, projectId:1, name:'Sitemap v2.pdf', category:'Deliverable', visibility:'client', side:'internal', by:'Nimesh S.', date:TODAY, size:'640 KB', version:1, versions:1 }, ...l]);
      P.notify({ type:'File', title:'New file shared', body:'Sitemap v2.pdf in Brandbase Website Relaunch', route:{ page:'projects', params:{ id:1, tab:'files', file:id } } });
      P.addActivity({ projectId:1, icon:'file-text', text:'Nimesh S. shared Sitemap v2.pdf', route:{ page:'projects', params:{ id:1, tab:'files', file:id } }, ref:{ type:'file', id } });
      toast('Team shared Sitemap v2.pdf.');
    },
    milestone: () => {
      const m = P.milestones.find(x => x.id===2);
      if (m.status==='completed') { toast('That milestone is already complete.'); return; }
      P.setMilestones(l => l.map(x => x.id===2 ? { ...x, status:'completed', completed:TODAY, completionNote:'Sitemap and wireframes are signed off.' } : x));
      P.notify({ type:'Milestone', title:'Milestone completed', body:'Site architecture & wireframes', route:{ page:'projects', params:{ id:1, tab:'milestones', ms:2 } } });
      P.addActivity({ projectId:1, icon:'flag', text:'Milestone completed: Site architecture & wireframes', route:{ page:'projects', params:{ id:1, tab:'milestones', ms:2 } }, ref:{ type:'milestone', id:2 } });
      toast('Team marked a milestone complete.');
    },
    askInfo: () => {
      const c = P.crs.find(x => x.id===8);
      if (c.status==='more_info') { toast('CR-0048 is already waiting on you.'); return; }
      P.updateCR(8, x => ({ status:'more_info', thread:[...x.thread, { from:'team', author:'Kasun F.', text:'Do you want the Spanish site on a separate domain or under a /es path?', ts:'Just now' }], timeline:[...x.timeline, { ts:'Today', text:'More information requested' }] }));
      P.notify({ type:'Change Request', title:'CR-0048 needs more information', body:'The team asked about the Spanish site setup.', to:[1], route:{ page:'change-requests', params:{ id:8 } } });
      toast('Team asked Alex for more information on CR-0048.');
    },
    reply: () => {
      P.updateThread('th1', x => ({ readBy:[], messages:[...x.messages, { id:uid('m'), author:'Kasun F.', side:'team', text:'Quick update: staging is ready for your team to click around.', time:'Just now' }] }));
      P.notify({ type:'Comment', title:'Kasun F. replied in General', body:'Quick update: staging is ready for your team…', route:{ page:'projects', params:{ id:1, tab:'discussions', thread:'th1' } } });
      toast('Team replied in the General discussion.');
    },
    replyDirect: () => {
      P.updateThread('th6', x => ({ readBy:[], messages:[...x.messages, { id:uid('m'), author:'Kasun F.', side:'team', text:'The June invoice is also in the portal now if Sam wants to check it.', time:'Just now' }] }));
      P.notify({ type:'Comment', title:'Kasun F. replied in Invoice timing', body:'The June invoice is also in the portal now…', to:[1], route:{ page:'discussions', params:{ thread:'th6' } } });
      toast('Team replied in Alex\'s direct chat “Invoice timing”.');
    },
    status: () => {
      const p = P.projects.find(x => x.id===1);
      const next = p.status==='at_risk' ? 'on_track' : 'at_risk';
      P.updateProject(1, { status:next });
      P.notify({ type:'Project', title:`Project status is now ${PROJECT_STATUS[next]}`, body:'Brandbase Website Relaunch', route:{ page:'projects', params:{ id:1 } } });
      P.addActivity({ projectId:1, icon:'briefcase', text:`Project status changed to ${PROJECT_STATUS[next]}`, route:{ page:'projects', params:{ id:1 } } });
      toast(`Team changed the project status to ${PROJECT_STATUS[next]}.`);
    },
    task: () => {
      P.setTasks(l => l.map(t => t.id===101 ? { ...t, visibility: t.visibility==='client' ? 'internal' : 'client' } : t));
      toast(taskVisible ? 'Team set “Landing page copy” to Internal Only. It is gone from the portal immediately.' : 'Team shared “Landing page copy” again.');
    },
    revoke: () => {
      P.setAssign(a => ({ ...a, [P.user.id]: hasProject1 ? (a[P.user.id]||[]).filter(x => x!==1) : [...(a[P.user.id]||[]), 1] }));
      toast(hasProject1 ? 'Team removed your access to Brandbase Website Relaunch.' : 'Team gave you access to Brandbase Website Relaunch again.');
    },
  };

  return (
    <>
      <button className="proto-fab" onClick={()=>setOpen(v=>!v)}><SvgIcon name="sliders" size={15}/> Prototype Controls</button>
      {open && (
        <div className="proto-panel">
          <p className="proto-note">Stands in for the admin console's Portal Settings and for actions by your project team, so you can watch this portal react. Not part of the product.</p>

          <h4>Signed in as</h4>
          <select className="form-select" value={userId} onChange={e=>setUserId(Number(e.target.value))}>
            {P.orgUsers.filter(u => u.status==='Active').map(u => <option key={u.id} value={u.id}>{u.name} · {ROLES[u.role].label}</option>)}
          </select>

          <h4>Branding</h4>
          <div className="form-group"><label className="form-label">Portal title</label><input className="form-input" value={branding.title} onChange={e=>setBranding(b => ({ ...b, title:e.target.value }))}/></div>
          <div className="swatch-row">{BRAND_COLORS.map(c => <button key={c} className={`swatch${branding.color===c?' active':''}`} style={{ background:c }} onClick={()=>setBranding(b => ({ ...b, color:c }))}/>)}</div>

          <h4>Portal sections</h4>
          {row('Show Invoices page', op.invoicesVisible, ()=>setOp(o => ({ ...o, invoicesVisible:!o.invoicesVisible })))}
          {row('Client Admins can invite colleagues', op.adminsInvite, ()=>setOp(o => ({ ...o, adminsInvite:!o.adminsInvite })))}
          {row('Client Admins can remove colleagues', op.adminsRemove, ()=>setOp(o => ({ ...o, adminsRemove:!o.adminsRemove })))}

          <h4>Email offered for</h4>
          {NOTIF_TYPES.map(t => row(t, op.emailTypes[t], ()=>setOp(o => ({ ...o, emailTypes:{ ...o.emailTypes, [t]:!o.emailTypes[t] } }))))}

          <h4>Sign-in methods</h4>
          {[['magicLink','Magic link'],['google','Google sign-in'],['password','Password']].map(([k,l]) => row(l, op.auth[k], ()=>setOp(o => ({ ...o, auth:{ ...o.auth, [k]:!o.auth[k] } }))))}

          <h4>Simulate your project team</h4>
          <button className="btn btn-default btn-sm" onClick={sim.update}>Publish update</button>
          <button className="btn btn-default btn-sm" onClick={sim.approval}>Request approval</button>
          <button className="btn btn-default btn-sm" onClick={sim.file}>Share a file</button>
          <button className="btn btn-default btn-sm" onClick={sim.milestone}>Complete a milestone</button>
          <button className="btn btn-default btn-sm" onClick={sim.askInfo}>Ask info on CR-0048</button>
          <button className="btn btn-default btn-sm" onClick={sim.reply}>Reply in a discussion</button>
          <button className="btn btn-default btn-sm" onClick={sim.replyDirect}>Reply in a direct chat</button>
          <button className="btn btn-default btn-sm" onClick={sim.status}>Change project status</button>

          <h4>Simulate access changes</h4>
          <button className="btn btn-default btn-sm" onClick={sim.task}>{taskVisible ? 'Set “Landing page copy” to Internal Only' : 'Share “Landing page copy” again'}</button>
          <button className="btn btn-default btn-sm" onClick={sim.revoke}>{hasProject1 ? 'Remove my access to Website Relaunch' : 'Restore access to Website Relaunch'}</button>
          <button className="btn btn-default btn-sm" onClick={onRevoke}>Deactivate me</button>

          <h4>Recorded for your team</h4>
          <p className="proto-note">What your own actions write to the team's audit log as client activity. Internal-only content never appears here.</p>
          {P.clientLog.length===0
            ? <div className="proto-log">Nothing yet. Preview or download a file, post a comment, decide an approval or submit a change request.</div>
            : P.clientLog.slice(0,8).map(l => <div key={l.id} className="proto-log"><b>{l.action}</b> · {l.target}</div>)}
        </div>
      )}
    </>
  );
};

// ─── APP ─────────────────────────────────────────────────────────────────────

// Activating the invitation turns the invited user (Taylor) Active and signs in as that user, so the dashboard that opens
// holds only Taylor's assigned projects (spec 16.1).
const AcceptInviteFlow = ({ branding, onAccept, onBackToSignIn }) => {
  const { setOrgUsers } = usePortal();
  return <AcceptInviteScreen branding={branding} onBackToSignIn={onBackToSignIn}
    onAccept={()=>{ setOrgUsers(l => l.map(u => u.id===4 ? { ...u, status:'Active' } : u)); onAccept(); }} />;
};

const Shell = ({ branding, dark, setDark, setBranding, setOp, userId, setUserId, onSignOut, onRevoke }) => {
  const { route, op, invoices, go } = usePortal();
  const content = (() => {
    switch (route.page) {
      case 'dashboard': return <Dashboard/>;
      case 'projects': return route.params.id ? <ProjectWorkspace key={route.params.id} projectId={route.params.id} params={route.params}/> : <ProjectsList/>;
      case 'discussions': return <DiscussionsPage/>;
      case 'approvals': return <ApprovalsPage/>;
      case 'change-requests': return <ChangeRequestsPage/>;
      case 'invoices': return op.invoicesVisible ? <Invoices invoices={invoices}/> : <Unavailable onBack={()=>go('dashboard')}/>;
      case 'notifications': return <NotificationsPage/>;
      case 'account': return <AccountPage onSignOut={onSignOut}/>;
      default: return <Dashboard/>;
    }
  })();
  return (
    <div className="wl-app">
      <TopNav branding={branding} dark={dark} setDark={setDark} onSignOut={onSignOut}/>
      <div className="wl-body"><Sidebar/><main className="wl-content">{content}</main></div>
      <ProtoControls branding={branding} setBranding={setBranding} setOp={setOp} userId={userId} setUserId={setUserId} onRevoke={onRevoke}/>
    </div>
  );
};

const App = () => {
  const [stage, setStage] = useState('signin'); // signin | invite | expired | invalid | app
  const [returnTo, setReturnTo] = useState(null); // an email link that was opened before sign-in; the user lands on it afterwards
  const [route, setRoute] = useState({ page:'dashboard', params:{}, n:0 });
  const [dark, setDark] = useState(false);
  const [branding, setBranding] = useState(DEFAULT_BRANDING);
  const [op, setOp] = useState(DEFAULT_OP);
  const [userId, setUserId] = useState(1);
  const [revoked, setRevoked] = useState(false);
  const go = (page, params={}) => { setRoute(r => ({ page, params, n:r.n+1 })); const m = document.querySelector('.wl-content'); if (m) m.scrollTop = 0; window.scrollTo(0, 0); };

  useEffect(() => { document.body.className = dark ? 'dark' : ''; }, [dark]);
  useEffect(() => { document.documentElement.style.setProperty('--accent', branding.color); document.documentElement.style.setProperty('--accent-soft', branding.color + '18'); }, [branding.color]);
  useEffect(() => { go('dashboard'); }, [userId]);

  const signOut = () => { setStage('signin'); setRevoked(false); setReturnTo(null); toast('Signed out.'); };

  let screen;
  if (stage==='signin') screen = (<SignInScreen branding={branding} auth={op.auth} returnTo={returnTo}
      onSignIn={()=>{ setStage('app'); if (returnTo) { go(returnTo.page, returnTo.params); setReturnTo(null); toast('Signed in. Opened the item from your email.'); } else toast('Signed in.'); }}
      onGoInvite={()=>setStage('invite')} onGoExpired={()=>setStage('expired')} onGoInvalid={()=>setStage('invalid')}
      onGoEmailLink={()=>{ setReturnTo({ page:'approvals', params:{ id:'AP-000123' } }); toast('Email link opened. Sign in to continue.'); }} />);
  else if (stage==='invalid') screen = (<InviteInvalidScreen branding={branding} onBackToSignIn={()=>setStage('signin')} />);
  else if (stage==='invite') screen = (<AcceptInviteFlow branding={branding} onAccept={()=>{ setUserId(4); setStage('app'); toast('Email verified and account activated. You are signed in as Taylor Reed and see only the projects assigned to you.'); }} onBackToSignIn={()=>setStage('signin')} />);
  else if (stage==='expired') screen = (<InviteExpiredScreen branding={branding} onBackToSignIn={()=>setStage('signin')} />);
  else if (revoked) screen = (<AccessRevokedScreen branding={branding} onBackToSignIn={signOut} onRestore={()=>setRevoked(false)} />);
  else screen = <Shell branding={branding} dark={dark} setDark={setDark} setBranding={setBranding} setOp={setOp} userId={userId} setUserId={setUserId} onSignOut={signOut} onRevoke={()=>setRevoked(true)}/>;

  // One host for the whole app: a toast fired together with a stage change (sign in, activate, sign out) must outlive the screen that fired it.
  return <PortalProvider userId={userId} op={op} route={route} go={go}>{screen}<ToastHost/></PortalProvider>;
};

document.documentElement.style.setProperty('--accent', DEFAULT_BRANDING.color);
document.documentElement.style.setProperty('--accent-soft', DEFAULT_BRANDING.color + '18');
ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
