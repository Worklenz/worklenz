<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worklenz User Client Portal — Prototype (v2, spec-aligned)</title>
<style>
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
.wl-app{min-height:100vh;display:flex;flex-direction:column}

/* LIGHT THEME VARS */
body{
  --bg:#f0f2f5;
  --card:#ffffff;
  --border:#e8e8e8;
  --text:rgba(0,0,0,.88);
  --text-sec:rgba(0,0,0,.45);
  --hover:rgba(0,0,0,.04);
  --sidebar-bg:#ffffff;
  --topnav-bg:#ffffff;
  --shadow:0 2px 8px rgba(0,0,0,.08);
  --menu-bg:#ffffff;
  --menu-hover:rgba(0,0,0,.05);
}
/* DARK THEME VARS */
body.dark{
  --bg:#141414;
  --card:#1f1f1f;
  --border:#303030;
  --text:rgba(255,255,255,.88);
  --text-sec:rgba(255,255,255,.45);
  --hover:rgba(255,255,255,.06);
  --sidebar-bg:#0d0d0d;
  --topnav-bg:#1a1a1a;
  --shadow:0 2px 8px rgba(0,0,0,.4);
  --menu-bg:#1a1a1a;
  --menu-hover:rgba(255,255,255,.08);
}
body{background:var(--bg);color:var(--text)}

/* AUTH SCREENS */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.auth-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:36px 34px;box-shadow:var(--shadow)}
.auth-logo-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px}
.auth-logo-row img{height:32px;object-fit:contain}
.auth-title{font-size:20px;font-weight:700;text-align:center;margin:6px 0 2px}
.auth-sub{font-size:13px;opacity:.55;text-align:center;margin-bottom:22px}
.auth-note{font-size:11.5px;opacity:.45;text-align:center;margin-top:18px;line-height:1.5}
.auth-input-wrap{position:relative}
.auth-input-wrap .pre-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4;font-size:13px}
.auth-input-wrap .post-icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);opacity:.4;cursor:pointer;font-size:13px;background:none;border:none}
.auth-input-wrap input{padding-left:32px}
.auth-banner{display:flex;gap:8px;align-items:flex-start;background:rgba(22,119,255,.08);border:1px solid rgba(22,119,255,.25);border-radius:8px;padding:11px 13px;font-size:12.5px;margin-bottom:18px}

/* TOP NAV */
.wl-topnav{height:52px;display:flex;align-items:center;padding:0 18px;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;background:var(--topnav-bg);border-bottom:1px solid var(--border);box-shadow:var(--shadow)}
.wl-logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);min-width:120px}
.wl-logo img{height:24px;width:auto;object-fit:contain}
.wl-logo span{font-weight:700;font-size:15px}
.wl-page-title{font-size:13.5px;font-weight:600;opacity:.6}
.wl-nav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.wl-icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;background:transparent;font-size:15px;position:relative;color:var(--text)}
.wl-icon-btn:hover{background:var(--hover)}
.wl-badge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:8px;background:#ff4d4f;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600}

/* LAYOUT */
.wl-body{display:flex;flex:1;margin-top:52px;min-height:calc(100vh - 52px)}
.wl-sidebar{width:80px;min-width:80px;background:var(--sidebar-bg);border-right:1px solid var(--border);padding:10px 0 0;display:flex;flex-direction:column;align-items:center;gap:0;position:fixed;top:52px;left:0;bottom:0;overflow-y:auto}
.wl-sidebar-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;padding:11px 4px 10px;cursor:pointer;border:none;background:transparent;transition:all .15s;position:relative;color:var(--text-sec)}
.wl-sidebar-item .icon{display:flex;align-items:center;justify-content:center;flex-shrink:0}
.wl-sidebar-item .label{font-size:10px;font-weight:500;text-align:center;line-height:1.2;white-space:nowrap}
.wl-sidebar-item.active{background:var(--accent-soft)}
.wl-sidebar-item.active .icon,.wl-sidebar-item.active .label{color:var(--accent);font-weight:600}
.wl-sidebar-item:hover:not(.active){background:var(--hover)}
.wl-sidebar-item .badge{position:absolute;top:6px;right:10px;min-width:16px;height:16px;border-radius:8px;background:#ff4d4f;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 4px}
.wl-content{flex:1;margin-left:80px;min-height:calc(100vh - 52px);padding:24px;overflow-y:auto}

/* DROPDOWN */
.dropdown{position:relative;display:inline-block}
.dropdown-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--menu-bg);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.16);min-width:230px;z-index:999;padding:6px;color:var(--text)}
.dropdown-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;cursor:pointer;font-size:13px;border-radius:7px;transition:background .1s}
.dropdown-item:hover{background:var(--menu-hover)}
.dropdown-divider{height:1px;background:var(--border);margin:5px 2px}

/* CARDS / STATS / TABLES */
.stat-card{border-radius:10px;padding:18px 20px;border:1px solid var(--border);background:var(--card)}
.stat-card .label{font-size:12px;opacity:.55;margin-bottom:4px}
.stat-card .value{font-size:26px;font-weight:700;line-height:1.2}
.grid-stat-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px}
.card-sm{padding:14px 16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:14px;font-weight:600}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.services-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.service-card{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.service-card .thumb{height:110px;background:var(--hover);display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--accent)}
.service-card .body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.service-card .name{font-size:13.5px;font-weight:600}
.service-card .desc{font-size:12px;opacity:.55;line-height:1.4;flex:1}
.service-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:6px}

.wl-table{width:100%;border-collapse:collapse;font-size:13px}
.wl-table th{padding:8px 12px;text-align:left;font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;opacity:.55;border-bottom:1px solid var(--border)}
.wl-table td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--text)}
.wl-table tr:hover td{background:var(--hover)}
.wl-table tr:last-child td{border-bottom:none}

.page-header{margin-bottom:20px}
.page-header h1{font-size:22px;font-weight:700;margin:0 0 4px}
.page-header p{font-size:13px;opacity:.55;margin:0}
.page-header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.section-tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:20px}
.section-tab{padding:8px 14px;cursor:pointer;font-size:13px;font-weight:500;border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--text)}
.section-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.section-tab:hover:not(.active){opacity:.75}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;text-align:center;gap:10px;opacity:.6}
.empty-state .icon-big{font-size:34px}

/* TAGS */
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
.tag-red{background:rgba(255,77,79,.12);color:#ff4d4f}
.tag-green{background:rgba(82,196,26,.12);color:#52c41a}
.tag-orange{background:rgba(250,173,20,.12);color:#d46b08}
.tag-blue{background:rgba(22,119,255,.12);color:#1677ff}
.tag-gray{background:rgba(128,128,128,.12);color:#888}
.locked-note{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.45;padding:8px 0}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{filter:brightness(.92)}
.btn-default{background:var(--card);border-color:var(--border);color:var(--text)}
.btn-default:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* FORMS */
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;opacity:.7}
.form-input,.form-select,textarea.form-input{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text);font-family:inherit}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent)}
.form-hint{font-size:11px;opacity:.5;margin-top:5px}
.toggle-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}
.toggle-row .t{font-size:13px;font-weight:600}
.toggle-row .d{font-size:11.5px;opacity:.5;margin-top:2px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--card);border-radius:12px;width:480px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{margin:0;font-size:16px;font-weight:600}
.modal-body{padding:20px 22px}
.modal-footer{padding:14px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}

/* CHAT */
.chat-layout{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 160px);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.chat-sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column}
.chat-list-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.chat-list-item.active{background:var(--hover)}
.chat-main{display:flex;flex-direction:column;min-width:0}
.chat-main-head{padding:13px 18px;border-bottom:1px solid var(--border);font-weight:600;font-size:13.5px}
.chat-messages{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.chat-msg-row{display:flex;flex-direction:column;margin-bottom:14px;max-width:72%}
.chat-msg-row.mine{align-self:flex-end;align-items:flex-end}
.chat-msg-sender{font-size:11px;font-weight:600;opacity:.5;margin-bottom:4px}
.chat-msg{display:inline-block;padding:8px 12px;border-radius:10px;font-size:13px;line-height:1.5}
.chat-msg.mine{background:var(--accent);color:#fff;border-radius:10px 10px 2px 10px}
.chat-msg.theirs{background:var(--hover);border-radius:10px 10px 10px 2px}
.chat-msg-time{font-size:10px;opacity:.4;margin-top:4px}
.chat-input-row{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input{flex:1;padding:9px 16px;border-radius:20px;border:1px solid var(--border);font-size:13px;background:var(--card);color:var(--text)}

/* PROJECT WORKSPACE */
.ws-layout{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.ws-rail{width:220px;flex:0 0 220px}

/* PROTOTYPE CONTROLS (meta — not part of the spec'd product) */
.proto-fab{position:fixed;bottom:20px;right:20px;z-index:120;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:22px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);cursor:pointer;font-size:12.5px;font-weight:600;color:var(--text)}
.proto-panel{position:fixed;bottom:70px;right:20px;width:340px;max-height:75vh;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 48px rgba(0,0,0,.25);z-index:121;padding:16px}
.proto-panel h4{margin:14px 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.5}
.proto-panel h4:first-child{margin-top:0}
.swatch-row{display:flex;gap:6px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.swatch.active{border-color:var(--text)}

.toast-host{position:fixed;left:24px;bottom:24px;z-index:600;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:11px 15px;font-size:13px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-width:340px;color:var(--text)}

/* ─── v2 additions ─── */
.tag-purple{background:rgba(114,46,209,.12);color:#722ed1}
.tag{white-space:nowrap}
.progress-bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden}
.progress-bar .fill{height:100%;border-radius:3px;transition:width .3s}
.org-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:16px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text);margin-left:6px;white-space:nowrap}
.count-dot{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;margin-left:6px;padding:0 4px}

.banner{display:flex;gap:8px;align-items:flex-start;border-radius:8px;padding:10px 12px;font-size:12.5px;margin:0 0 14px;line-height:1.5}
.banner.info{background:rgba(22,119,255,.08);border:1px solid rgba(22,119,255,.25)}
.banner.warn{background:rgba(250,173,20,.1);border:1px solid rgba(250,173,20,.35)}

.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{padding:5px 12px;font-size:12px;font-weight:500;border:none;background:var(--card);color:var(--text);cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.chip{padding:4px 11px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.action-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px}
.action-row:last-child{border-bottom:none}
.action-row:hover{background:var(--hover)}
.notif-row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.notif-row:last-child{border-bottom:none}
.notif-row:hover{background:var(--hover)}

.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.project-card{cursor:pointer;transition:border-color .15s}
.project-card:hover{border-color:var(--accent)}

.phase-track{display:flex;margin-top:14px}
.phase{flex:1;text-align:center;position:relative;font-size:11px;opacity:.45}
.phase::before{content:'';position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.phase:first-child::before{display:none}
.phase .dot{display:block;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--border);margin:0 auto 6px;position:relative;z-index:1}
.phase.done{opacity:.8}.phase.done .dot{background:var(--accent);border-color:var(--accent)}.phase.done::before{background:var(--accent)}
.phase.cur{opacity:1;font-weight:700}.phase.cur .dot{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.phase.cur::before{background:var(--accent)}

.ms-row{display:flex;gap:14px;cursor:pointer;padding:4px 8px;border-radius:8px}
.ms-rail{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.ms-dot{width:14px;height:14px;border-radius:50%;border:2px solid;flex-shrink:0}
.ms-line{flex:1;width:2px;background:var(--border);margin-top:4px}

.file-preview{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:10px;padding:34px 10px;margin-bottom:14px;background:var(--hover)}

.side-drawer{position:fixed;right:0;top:0;bottom:0;width:460px;max-width:92vw;background:var(--card);border-left:1px solid var(--border);z-index:499;box-shadow:-4px 0 24px rgba(0,0,0,.15);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease;color:var(--text)}
.side-drawer.open{transform:translateX(0)}
.side-drawer-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.side-drawer-body{padding:16px 20px 40px;overflow-y:auto;flex:1}
.side-drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:498;opacity:0;pointer-events:none;transition:opacity .2s}
.side-drawer-scrim.open{opacity:1;pointer-events:auto}

.chat-layout{height:min(560px,calc(100vh - 270px));min-height:360px}
.chat-list-item{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.timeline-note{font-size:11.5;opacity:.5}
.wl-content{padding-bottom:90px}
.proto-panel .btn{margin:0 6px 6px 0}
.proto-note{font-size:11.5px;opacity:.55;margin:0 0 8px;line-height:1.5}
@media (max-width:860px){.grid-2,.grid-3,.grid-stat-4{grid-template-columns:1fr!important}.chat-layout{grid-template-columns:1fr}.chat-sidebar{max-height:180px}}
.mention{display:inline-block;padding:0 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.proto-log{font-size:11.5px;opacity:.75;padding:4px 0;border-bottom:1px solid var(--border)}
.otp-input::placeholder{opacity:.22;font-weight:600}

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>

<script type="text/babel">
// Rebuilt against the Client Portal Prototype Functional Specification. Invoices are unchanged.
const { useState, useEffect, useRef } = React;

// ─── TOAST ───────────────────────────────────────────────────────────────────
let _toastFn = null;
const toast = (msg) => { if (_toastFn) _toastFn(msg); };
const ToastHost = () => {
  const [items, setItems] = useState([]);
  useEffect(() => {
    _toastFn = (msg) => {
      const id = Date.now() + Math.random();
      setItems(v => [...v, { id, msg }]);
      setTimeout(() => setItems(v => v.filter(x => x.id !== id)), 3200);
    };
    return () => { _toastFn = null; };
  }, []);
  return <div className="toast-host">{items.map(t => <div key={t.id} className="toast">{t.msg}</div>)}</div>;
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
// Same prototype "today" as the admin side, so dates line up across both prototypes.
const TODAY = '2026-06-02';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate = (iso, fallback='Not set') => {
  if (!iso) return fallback;
  const [y,m,d] = iso.split('-').map(Number);
  return `${MONTHS[m-1]} ${d}, ${y}`;
};
const daysFromToday = (iso) => Math.round((new Date(iso+'T00:00:00') - new Date(TODAY+'T00:00:00')) / 86400000);
const dueLabel = (iso) => { const d = daysFromToday(iso); return d<0 ? `${-d} day${d===-1?'':'s'} overdue` : d===0 ? 'Due today' : d===1 ? 'Due tomorrow' : `Due in ${d} days`; };
const uid = (p='id') => p + Math.random().toString(36).slice(2,8);
const initialsFromName = (name) => (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase() || '?';
// "@First Last" in a message is shown as a mention chip.
const renderMentions = (text) => String(text).split(/(@[A-Z][a-z]+ [A-Z][a-z]+)/g).map((p,i) => /^@[A-Z]/.test(p) ? <span key={i} className="mention">{p}</span> : p);

  const [files, setFiles] = useState(FILES_SEED);
  const [threads, setThreads] = useState(THREADS_SEED);
  const [approvals, setApprovals] = useState(APPROVALS_SEED);
  const [crs, setCrs] = useState(CRS_SEED);
  const [notifs, setNotifs] = useState(NOTIFS_SEED);
  const [activity, setActivity] = useState(ACTIVITY_SEED);
  const [invoices] = useState(INITIAL_INVOICES);
  const [prefs, setPrefs] = useState(() => Object.fromEntries(NOTIF_TYPES.map(t => [t, true])));
  // What this client's actions write to the team's audit log (spec 16.2 to 16.5: "activity logged"). Shown in Prototype Controls.
  const [clientLog, setClientLog] = useState([]);

  const user = orgUsers.find(u => u.id===userId) || orgUsers[0];
  const role = ROLES[user.role];
  const can = role.can;
  const myIds = assign[user.id] || [];
  const myProjects = projects.filter(p => myIds.includes(p.id) && p.portalEnabled);
  const myPids = myProjects.map(p => p.id);

  const upd = (setter) => (id, patch) => setter(l => l.map(x => x.id===id ? { ...x, ...(typeof patch==='function' ? patch(x) : patch) } : x));
  const updateThread = upd(setThreads), updateApproval = upd(setApprovals), updateCR = upd(setCrs), updateProject = upd(setProjects);

  // Visibility is enforced in these selectors, never in the page components.
  const msOf = (pid) => milestones.filter(m => m.projectId===pid && m.visibility==='client').sort((a,b) => a.target.localeCompare(b.target));
  const tasksOf = (pid) => tasks.filter(t => t.projectId===pid && t.visibility==='client');
  const filesOf = (pid) => files.filter(f => f.projectId===pid && f.visibility==='client');
  const threadVisible = (t) => (t.ctx.type==='direct' ? t.ownerId===user.id : t.ctx.type==='task' ? tasks.some(x => x.id===t.ctx.refId && x.visibility==='client') : t.ctx.type==='file' ? files.some(x => x.id===t.ctx.refId && x.visibility==='client') : true);
  const threadsOf = (pid) => threads.filter(t => t.projectId===pid && threadVisible(t));
  const myApprovals = approvals.filter(a => myPids.includes(a.projectId));
  const myCRs = crs.filter(c => myPids.includes(c.projectId));
  const myNotifs = notifs.filter(n => n.to.includes(user.id));
  const pendingApprovals = myApprovals.filter(a => a.status==='awaiting' && a.approverId===user.id && can.approve);
  const infoNeeded = myCRs.filter(c => c.status==='more_info' && c.requesterId===user.id);
  const unreadNotifs = myNotifs.filter(n => n.unread).length;
  const unreadIn = (t) => !t.readBy.includes(user.id);
  const myThreads = threads.filter(t => (t.projectId==null || myPids.includes(t.projectId)) && threadVisible(t));
  const unreadThreads = myThreads.filter(unreadIn).length;

  const refVisible = (ref) => !ref || (ref.type==='task' ? tasks.some(x => x.id===ref.id && x.visibility==='client')
    : ref.type==='file' ? files.some(x => x.id===ref.id && x.visibility==='client')
    : ref.type==='milestone' ? milestones.some(x => x.id===ref.id && x.visibility==='client') : true);
  const notify = (n) => setNotifs(l => [{ id:uid('n'), time:'Just now', unread:true, to:[1,2,3], ...n, email:!!op.emailTypes[n.type] }, ...l]);
  const logClient = (action, target) => setClientLog(l => [{ id:uid('lg'), who:user.name, action, target, time:'Just now' }, ...l].slice(0, 30));
  const addActivity = (a) => setActivity(l => [{ id:uid('ac'), time:'Just now', ...a }, ...l]);
  const markRead = (id, unread=false) => setNotifs(l => l.map(n => n.id===id ? { ...n, unread } : n));
  const markAllRead = () => setNotifs(l => l.map(n => n.to.includes(user.id) ? { ...n, unread:false } : n));
  const readThread = (id) => setThreads(l => l.map(t => t.id===id && !t.readBy.includes(user.id) ? { ...t, readBy:[...t.readBy, user.id] } : t));

  const value = {
    route, go, op, user, role, can, orgUsers, setOrgUsers, assign, setAssign, projects, setProjects, updateProject, updates, setUpdates,
    milestones, setMilestones, tasks, setTasks, files, setFiles, threads, setThreads, updateThread, approvals, setApprovals, updateApproval,
    crs, setCrs, updateCR, notifs, setNotifs, activity, setActivity, invoices, prefs, setPrefs, onRevoked,
    myProjects, myPids, msOf, tasksOf, filesOf, threadsOf, threadVisible, myThreads, unreadThreads, myApprovals, myCRs, myNotifs, pendingApprovals, infoNeeded, unreadNotifs, unreadIn,
    addActivity, markRead, markAllRead, readThread, refVisible, notify, clientLog, logClient,
  };
  return <PortalCtx.Provider value={value}>{children}</PortalCtx.Provider>;
};

const INVITEE = { name:'Taylor Reed', email:'taylor@brandbase.com', role:'member' };
const OTP_LENGTH = 6, OTP_MINUTES = 10, OTP_MAX_TRIES = 5, OTP_RESEND_SECONDS = 30;
const maskEmail = (e) => { const [l, d] = e.split('@'); return (l.length<=2 ? l[0]+'*' : l[0] + '*'.repeat(Math.min(l.length-2, 6)) + l[l.length-1]) + '@' + d; };
const newOtp = () => String(Math.floor(100000 + Math.random()*900000));

const AcceptInviteScreen = ({ branding, onAccept, onBackToSignIn }) => {
  const [step, setStep] = useState('details');     // details | code
  const [name, setName] = useState('');
  const [pw, setPw] = useState(''); const [pw2, setPw2] = useState('');
  const [code, setCode] = useState(null);          // the code "emailed" to the invited address; a new one replaces it
  const [entry, setEntry] = useState('');
  const [tries, setTries] = useState(0);
  const [expired, setExpired] = useState(false);
  const [wait, setWait] = useState(0);
  const [error, setError] = useState('');
  const ruleOk = pw.length>=8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw);
  const canSend = name.trim().length>0 && ruleOk && pw===pw2 && pw2.length>0;
  const locked = tries>=OTP_MAX_TRIES;
  useEffect(() => { if (wait<=0) return; const t = setTimeout(() => setWait(w => w-1), 1000); return () => clearTimeout(t); }, [wait]);

  const send = (again) => {
    setCode(newOtp()); setEntry(''); setTries(0); setExpired(false); setError(''); setWait(OTP_RESEND_SECONDS); setStep('code');
    toast(again ? 'New code sent. The earlier code no longer works.' : `Code sent to ${maskEmail(INVITEE.email)}.`);
  };
  const verify = () => {
    if (expired) { setError('This code has expired. Send a new code.'); return; }
    if (locked) { setError('Too many incorrect codes. Send a new code.'); return; }
    if (entry!==code) {
      const n = tries+1; setTries(n);
      setError(n>=OTP_MAX_TRIES ? 'Too many incorrect codes. Send a new code.' : `That code doesn't match. ${OTP_MAX_TRIES-n} attempt${OTP_MAX_TRIES-n===1?'':'s'} left.`);
      return;
    }
    onAccept();
  };
  const canResend = wait<=0 || locked || expired;

  return (
    <div className="auth-shell">
      <div className="auth-card">
        <div className="auth-logo-row"><BrandLogo branding={branding} /></div>
        <div className="auth-title">{branding.title}</div>

        {step==='details' && <>
          <div className="auth-sub">Activate your account</div>
          <div className="auth-banner">ℹ️ <span>You've been invited to <b>{ORG.name}</b> as a <b>{ROLES[INVITEE.role].label}</b>. Set up your account to see the projects shared with you. Step 1 of 2.</span></div>
          <div className="form-group"><label className="form-label">Full Name</label><input className="form-input" placeholder="Full Name" value={name} onChange={e=>setName(e.target.value)} /></div>
          <div className="form-group"><label className="form-label">Email</label><input className="form-input" disabled value={INVITEE.email} style={{ opacity:.6 }} /></div>
          <div className="form-group">
            <label className="form-label">Create Password</label>
            <input className="form-input" type="password" placeholder="Create Password" value={pw} onChange={e=>setPw(e.target.value)} />
            <div className="form-hint">At least 8 characters, with uppercase and lowercase letters, a number and a special character.</div>
          </div>
          <div className="form-group"><label className="form-label">Confirm Password</label><input className="form-input" type="password" placeholder="Confirm Password" value={pw2} onChange={e=>setPw2(e.target.value)} /></div>
          <button className="btn btn-primary" disabled={!canSend} style={{ width:'100%', justifyContent:'center', padding:'9px 0' }} onClick={()=>send(false)}>Send verification code</button>
          <div className="form-hint" style={{ textAlign:'center', marginTop:8 }}>We email a one-time code to {maskEmail(INVITEE.email)} to confirm this address is yours.</div>
          <div className="auth-note">Already have an account? <a href="#" style={{ color:branding.color }} onClick={e=>{ e.preventDefault(); onBackToSignIn(); }}>Sign In</a></div>
        </>}

        {step==='code' && <>
          <div className="auth-sub">Verify your email</div>
          <div className="auth-banner">✉️ <span>We sent a {OTP_LENGTH}-digit code to <b>{maskEmail(INVITEE.email)}</b>. It is valid for {OTP_MINUTES} minutes. Step 2 of 2.</span></div>
          <div className="form-group">
            <label className="form-label">Verification code</label>
            <input className="form-input otp-input" inputMode="numeric" autoComplete="one-time-code" maxLength={OTP_LENGTH} placeholder="000000" value={entry}
              style={{ fontSize:22, letterSpacing:10, textAlign:'center', fontWeight:700, borderColor:error ? '#ff4d4f' : undefined }}
              onChange={e=>{ setEntry(e.target.value.replace(/\D/g, '').slice(0, OTP_LENGTH)); setError(''); }} onKeyDown={e=>{ if (e.key==='Enter' && entry.length===OTP_LENGTH) verify(); }} />
            {error && <div className="form-hint" style={{ color:'#ff4d4f', opacity:1 }}>{error}</div>}
          </div>
          <button className="btn btn-primary" disabled={entry.length!==OTP_LENGTH} style={{ width:'100%', justifyContent:'center', padding:'9px 0', marginBottom:10 }} onClick={verify}>Verify and continue</button>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:12.5 }}>
            <a href="#" style={{ color:branding.color }} onClick={e=>{ e.preventDefault(); setStep('details'); }}>← Back</a>
            <button className="btn btn-default btn-sm" disabled={!canResend} onClick={()=>send(true)}>{canResend ? 'Resend code' : `Resend code in ${wait}s`}</button>
          </div>
          <div className="auth-note" style={{ marginTop:14 }}>The code goes to the address your invitation was sent to. To use a different address, ask your project contact.</div>

          <div style={{ marginTop:16, border:'1px dashed var(--border)', borderRadius:8, padding:'10px 12px', background:'var(--hover)' }}>
            <div style={{ fontSize:10.5, fontWeight:700, letterSpacing:.6, textTransform:'uppercase', opacity:.55, marginBottom:6 }}>Prototype helper · the email arriving at {maskEmail(INVITEE.email)}</div>
            <div style={{ fontSize:12 }}>Subject: Your {branding.title} verification code</div>
            <div style={{ fontSize:12.5, margin:'4px 0 8px' }}>Your code is <b style={{ letterSpacing:2 }}>{code}</b>. It expires in {OTP_MINUTES} minutes. If you did not request it, ignore this email.</div>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              <button className="btn btn-default btn-sm" onClick={()=>setWait(0)}>Skip the resend wait</button>
              <button className="btn btn-default btn-sm" onClick={()=>{ setExpired(true); toast(`${OTP_MINUTES} minutes passed. This code has expired.`); }}>Expire this code</button>
            </div>
          </div>
        </>}
      </div>
    </div>
  );
};

// Recovery flow (spec 16.1): the client asks for a new link and an authorized team member resends the invitation.
const RecoveryRequest = () => {
  const [asked, setAsked] = useState(false);
  return asked
    ? <div className="auth-banner" style={{ textAlign:'left', marginBottom:10 }}>✅ <span>Request sent. Your project contact resends the invitation from their side, and you get a new email with a fresh link.</span></div>
    : <button className="btn btn-primary" style={{ width:'100%', justifyContent:'center', padding:'9px 0', marginBottom:10 }} onClick={()=>{ setAsked(true); toast('Request sent to your project contact.'); }}>Ask for a new invitation</button>;
};

const TopNav = ({ branding, dark, setDark, onSignOut }) => {
  const { route, go, user, myProjects, myNotifs, unreadNotifs, markRead } = usePortal();
  const [open, setOpen] = useState(false);
  const [bell, setBell] = useState(false);
  const [langOpen, setLangOpen] = useState(false);
  const [lang, setLang] = useState('English');
  const ref = useRef(null), bellRef = useRef(null);
  useEffect(() => {
    const close = (e) => {
      if (ref.current && !ref.current.contains(e.target)) { setOpen(false); setLangOpen(false); }
      if (bellRef.current && !bellRef.current.contains(e.target)) setBell(false);
    };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, []);
  const inProject = route.page==='projects' && route.params.id;
  const openNotif = (n) => { markRead(n.id); setBell(false); go(n.route.page, n.route.params); };

  return (
    <nav className="wl-topnav">
      <a className="wl-logo" href="#" onClick={e=>{ e.preventDefault(); go('dashboard'); }}><BrandLogo branding={branding} size={26} /><span>{branding.title}</span></a>
      <span className="org-chip" title="Your organization"><SvgIcon name="building" size={13}/> {ORG.name}</span>
      {inProject && myProjects.length>1 && (
        <select className="form-select" style={{ width:'auto', maxWidth:240, padding:'5px 8px', fontSize:12.5 }} value={route.params.id}
          onChange={e=>go('projects', { id:Number(e.target.value), tab:route.params.tab })} title="Current project">
          {myProjects.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      )}
      <div className="wl-nav-right">
        <div className="dropdown" ref={bellRef}>
          <button className="wl-icon-btn" onClick={()=>setBell(v=>!v)} title="Notifications"><SvgIcon name="bell" size={18}/>{unreadNotifs>0 && <span className="wl-badge">{unreadNotifs}</span>}</button>
          {bell && (
            <div className="dropdown-menu" style={{ width:340, padding:0 }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'10px 14px', borderBottom:'1px solid var(--border)' }}>
                <span style={{ fontWeight:700, fontSize:13 }}>Notifications</span>
                <a href="#" style={{ fontSize:12, color:'var(--accent)' }} onClick={e=>{ e.preventDefault(); setBell(false); go('notifications'); }}>View all</a>
              </div>
              <div style={{ maxHeight:340, overflowY:'auto' }}>
                {myNotifs.length ? <NotifList items={myNotifs.slice(0,5)} onOpen={openNotif}/> : <div style={{ padding:20, textAlign:'center', opacity:.5, fontSize:13 }}>You're all caught up.</div>}
              </div>
            </div>
          )}
        </div>
        <div className="dropdown" ref={ref}>
          <div style={{ cursor:'pointer' }} onClick={()=>setOpen(v=>!v)}><Av initials={user.initials} color={user.color} /></div>
          {open && (
            <div className="dropdown-menu">
              <div style={{ padding:'8px 12px 10px', borderBottom:'1px solid var(--border)', marginBottom:4 }}>
                <div style={{ fontWeight:600, fontSize:13 }}>{user.name}</div>
                <div style={{ fontSize:11, opacity:.5, marginTop:2 }}>{user.email}</div>
                <div style={{ marginTop:6 }}><RoleTag role={user.role}/></div>
              </div>
              <div className="dropdown-item" onClick={()=>setDark(v=>!v)}>
                <span style={{ display:'flex', alignItems:'center', gap:8 }}><SvgIcon name={dark?'sun':'moon'} size={15}/> {dark?'Light Mode':'Dark Mode'}</span>
              </div>
              <div style={{ position:'relative' }}>
                <div className="dropdown-item" onClick={()=>setLangOpen(v=>!v)}>
                  <span style={{ display:'flex', alignItems:'center', gap:8 }}><SvgIcon name="globe" size={15}/> Language</span>
                  <span style={{ fontSize:11.5, opacity:.5 }}>{lang} ▾</span>
                </div>
                {langOpen && (
                  <div style={{ background:'var(--hover)', borderRadius:7, margin:'2px 6px 6px', overflow:'hidden' }}>
                    {LANGUAGES.map(l => <div key={l} className="dropdown-item" style={{ borderRadius:0, fontSize:12.5 }} onClick={()=>{ setLang(l); setLangOpen(false); toast(`Language set to ${l} (display copy unchanged in this prototype).`); }}>{l}{l===lang && ' ✓'}</div>)}
                  </div>
                )}
              </div>
              <div className="dropdown-item" onClick={()=>{ go('account'); setOpen(false); }}>
                <span style={{ display:'flex', alignItems:'center', gap:8 }}><SvgIcon name="user" size={15}/> Account</span>
              </div>
              <div className="dropdown-divider"></div>
              <div className="dropdown-item" onClick={()=>{ setOpen(false); onSignOut(); }}>
                <span style={{ display:'flex', alignItems:'center', gap:8 }}><SvgIcon name="log-out" size={15}/> Sign out</span>
              </div>
            </div>
          )}
        </div>
      </div>
    </nav>
  );
};

// ─── DASHBOARD (spec 5) — action-oriented summary of every project the user can access ──

const dueTag = (iso) => { const d = daysFromToday(iso); return <span className={`tag ${d<0?'tag-red':d<=3?'tag-orange':'tag-gray'}`}>{dueLabel(iso)}</span>; };

const Dashboard = () => {
  const { user, role, can, myProjects, msOf, myApprovals, pendingApprovals, infoNeeded, activity, refVisible, myPids, go, op, invoices } = usePortal();
  const upcoming = myProjects.flatMap(p => msOf(p.id).filter(m => m.status!=='completed').map(m => ({ ...m, project:p })))
    .sort((a,b) => a.target.localeCompare(b.target)).slice(0,5);
  const pending = [
    ...pendingApprovals.map(a => ({ key:a.id, icon:'clipboard-check', title:a.title, sub:`${a.id} · ${(myProjects.find(p => p.id===a.projectId)||{}).name}`, due:a.due, tag:'Approve', cls:'tag-orange', go:()=>go('approvals', { id:a.id }) })),
    ...infoNeeded.map(c => ({ key:c.crNo, icon:'repeat', title:c.title, sub:`${c.crNo} · Your team needs more information`, due:null, tag:'Reply', cls:'tag-red', go:()=>go('change-requests', { id:c.id }) })),
  ];
  const waiting = myApprovals.filter(a => a.status==='awaiting' && !pendingApprovals.includes(a));
  const recent = activity.filter(a => myPids.includes(a.projectId) && refVisible(a.ref)).slice(0,6);
  const activeCount = myProjects.filter(p => p.status!=='completed').length;
  const unpaid = invoices.filter(i => i.status!=='Paid').reduce((s,i) => s+i.amount, 0);

  if (myProjects.length===0) return (
    <div>
      <PageHeader title="Dashboard" sub={`Welcome, ${user.name.split(' ')[0]}.`}/>
      <Empty icon="folder" text="No projects are shared with you yet" sub="When your project contact assigns you to a project, it appears here. Nothing from their workspace is shown until then."/>
    </div>
  );

  return (
    <div>
      <PageHeader title="Dashboard" sub={`Welcome back, ${user.name.split(' ')[0]}. Here is where your projects stand.`}/>
      <div className="grid-stat-4" style={{ gridTemplateColumns:`repeat(${op.invoicesVisible?4:3},1fr)` }}>
        <Stat label="Active projects" value={activeCount}/>
        <Stat label="Pending actions" value={pending.length} color={pending.length ? '#d46b08' : undefined} sub={pending.length ? 'Waiting on you' : 'Nothing waiting'}/>
        <Stat label="Upcoming milestones" value={upcoming.length} color="#52c41a" sub={upcoming[0] ? `Next: ${fmtDate(upcoming[0].target)}` : undefined}/>
        {op.invoicesVisible && <Stat label="Unpaid amount" value={'$'+unpaid.toLocaleString()} onClick={()=>go('invoices')}/>}
      </div>

      <div className="grid-2" style={{ marginBottom:16 }}>
        <div className="card">
          <div className="card-header"><span className="card-title">Needs your action{pending.length>0 && <span className="count-dot">{pending.length}</span>}</span></div>
          {pending.map(p => (
            <div key={p.key} className="action-row" onClick={p.go}>
              <span style={{ color:'#d46b08' }}><SvgIcon name={p.icon} size={17}/></span>
              <div style={{ flex:1, minWidth:0 }}><div style={{ fontSize:13, fontWeight:600 }}>{p.title}</div><div style={{ fontSize:11.5, opacity:.55 }}>{p.sub}</div></div>
              {p.due && dueTag(p.due)}<span className={`tag ${p.cls}`}>{p.tag}</span>
            </div>
          ))}
          {pending.length===0 && <div style={{ fontSize:13, opacity:.55, padding:'6px 0' }}>{can.approve ? 'You are all caught up.' : 'Nothing needs your action. Only a Client Admin can approve items.'}</div>}
          {waiting.length>0 && (
            <div style={{ marginTop:10, paddingTop:10, borderTop:'1px solid var(--border)' }}>
              <div style={{ fontSize:11, fontWeight:700, opacity:.45, letterSpacing:.5, marginBottom:4 }}>WAITING ON SOMEONE ELSE</div>
              {waiting.map(a => <div key={a.id} className="action-row" onClick={()=>go('approvals', { id:a.id })}><span style={{ opacity:.5 }}><SvgIcon name="clipboard-check" size={16}/></span><div style={{ flex:1, fontSize:12.5 }}>{a.title}<div style={{ fontSize:11, opacity:.5 }}>Waiting for {a.approver}</div></div><Tag v="Awaiting Approval"/></div>)}
            </div>
          )}
        </div>
        <div className="card">
          <div className="card-header"><span className="card-title">Upcoming milestones</span></div>
          {upcoming.map(m => (
            <div key={m.id} className="action-row" onClick={()=>go('projects', { id:m.projectId, tab:'milestones', ms:m.id })}>
              <span style={{ color:m.status==='delayed' ? '#d46b08' : 'var(--accent)' }}><SvgIcon name="flag" size={16}/></span>
              <div style={{ flex:1, minWidth:0 }}><div style={{ fontSize:13, fontWeight:600 }}>{m.name}</div><div style={{ fontSize:11.5, opacity:.55 }}>{m.project.name}</div></div>
              <div style={{ textAlign:'right' }}><div style={{ fontSize:12.5 }}>{fmtDate(m.target)}</div><Tag v={MS_LABEL[m.status]}/></div>
            </div>
          ))}
          {upcoming.length===0 && <div style={{ fontSize:13, opacity:.55 }}>No upcoming milestones are shared with you.</div>}
        </div>
      </div>

      <div className="card-title" style={{ fontSize:14, margin:'18px 0 10px' }}>Your projects</div>
      <div className="project-grid">
        {myProjects.map(p => {
          const nm = msOf(p.id).filter(m => m.status!=='completed')[0];
          return (
            <div key={p.id} className="card project-card" onClick={()=>go('projects', { id:p.id })}>
              <div style={{ display:'flex', justifyContent:'space-between', gap:8, alignItems:'flex-start' }}>
                <div style={{ fontWeight:700, fontSize:14 }}>{p.name}</div><Tag v={PROJECT_STATUS[p.status]}/>
              </div>
              <div style={{ margin:'12px 0' }}><Progress value={p.progress} color={p.color} width={0}/></div>
              <KV rows={[['Current phase', p.phase], ['Next milestone', nm ? nm.name : '—'], ['Expected completion', fmtDate(p.due)]]}/>
            </div>
          );
        })}
      </div>

      <div className="card" style={{ marginTop:16 }}>
        <div className="card-header"><span className="card-title">Recent activity</span></div>
        {recent.map(a => (
          <div key={a.id} className="action-row" onClick={()=>go(a.route.page, a.route.params)}>
            <span style={{ opacity:.55 }}><SvgIcon name={a.icon} size={15}/></span><div style={{ flex:1, fontSize:13 }}>{a.text}</div><span style={{ fontSize:11.5, opacity:.45 }}>{a.time}</span>
          </div>
        ))}
        {recent.length===0 && <div style={{ fontSize:13, opacity:.55 }}>No recent activity.</div>}
      </div>
    </div>
  );
};
